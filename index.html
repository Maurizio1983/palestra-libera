<script>/* Motore del piano: puro, senza DOM, testabile in Node. */
(function (root) {
  'use strict';

  const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
  const DAYS_SHORT = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  const GOALFR = {
    salute: [0.15, 0.45, 0.75],
    forza: [0.0, 0.3, 0.6],
    massa: [0.4, 0.7, 1.0],
    resistenza: [0.7, 0.9, 1.0],
    skill: [0.2, 0.5, 0.8],
  };
  const REST = { salute: 60, forza: 90, massa: 60, resistenza: 40, skill: 75 };
  const EXP_DEFAULT_LV = { sedentario: 0, ripartenza: 1, attivo: 2, esperto: 3 };
  const TENDON_SKILLS = ['sk_fl', 'sk_pl', 'sk_mu'];
  const SKILL_FREQ = { sk_hs: 2, sk_fl: 2, sk_pl: 2, sk_mu: 1 };
  const PHASES = ['Introduzione', 'Costruzione', 'Picco', 'Scarico'];

  const KINDS = {
    1: ['FULL_A'],
    2: ['FULL_A', 'FULL_B'],
    3: ['FULL_A', 'FULL_B', 'FULL_C'],
    4: ['UPPER_1', 'LOWER_1', 'UPPER_2', 'LOWER_2'],
    5: ['UPPER_1', 'LOWER_1', 'FULL_LIGHT', 'UPPER_2', 'LOWER_2'],
    6: ['UPPER_1', 'LOWER_1', 'UPPER_2', 'LOWER_2', 'FULL_LIGHT', 'COND_CORE'],
    7: ['UPPER_1', 'LOWER_1', 'UPPER_2', 'LOWER_2', 'FULL_LIGHT', 'COND_CORE', 'FULL_A'],
  };
  const KIND_LABEL = {
    FULL_A: 'Corpo intero A', FULL_B: 'Corpo intero B', FULL_C: 'Corpo intero C',
    UPPER_1: 'Parte alta A', UPPER_2: 'Parte alta B', LOWER_1: 'Gambe A', LOWER_2: 'Gambe B',
    FULL_LIGHT: 'Corpo intero leggero', COND_CORE: 'Core e condizionamento',
  };
  const SLOTS = {
    FULL_A: ['push_h', 'squat', 'PULL', 'core_ext', 'hinge', 'core_lat', 'lunge'],
    FULL_B: [['push_v', 'dip', 'push_h'], 'hinge', 'PULL', 'lunge', 'core_flex', 'push_h', 'core_post'],
    FULL_C: ['push_h', 'lunge', 'PULL', 'squat', 'core_post', 'hinge', 'core_lat'],
    UPPER_1: ['push_h', 'PULL', 'push_v', 'pull_h', 'core_ext', 'dip'],
    UPPER_2: ['push_h', 'PULL', 'dip', 'pull_h', 'core_flex', 'push_v'],
    LOWER_1: ['squat', 'hinge', 'lunge', 'core_ext', 'core_lat', 'core_post'],
    LOWER_2: ['lunge', 'hinge', 'squat', 'core_flex', 'core_lat', 'core_post'],
    FULL_LIGHT: ['squat', 'push_h', 'PULL', 'core_ext', 'hinge'],
    COND_CORE: ['core_ext', 'core_flex', 'core_lat', 'core_post', 'hinge'],
  };

  let LIB = null, BY = {}, CH = {}, POS = {};

  function init(lib) {
    LIB = lib; BY = {}; CH = {}; POS = {};
    lib.exercises.forEach(function (e) {
      BY[e.id] = e;
      (CH[e.chain] = CH[e.chain] || []).push(e);
    });
    Object.keys(CH).forEach(function (c) { CH[c].forEach(function (e, i) { POS[e.id] = i; }); });
    return api;
  }

  /* ---------------------------------------------------------- filtri */
  function capLv(p) {
    if (p.caution || p.exp === 'sedentario') return 2;
    if (p.exp === 'ripartenza') return 3;
    return 5;
  }
  function noImpact(p) { return p.caution || p.limits.indexOf('salti') >= 0; }
  function haveEq(p, req) {
    return p.eq.indexOf(req) >= 0 || (req === 'tavolo' && p.eq.indexOf('anelli') >= 0);
  }
  function blockReason(ex, p, ignoreCap) {
    const miss = ex.eq.filter(function (r) { return !haveEq(p, r); });
    if (miss.length) return { type: 'eq', detail: miss };
    const lim = ex.flags.filter(function (f) { return p.limits.indexOf(f) >= 0; });
    if (lim.length) return { type: 'limit', detail: lim };
    if (noImpact(p) && ex.flags.indexOf('salti') >= 0) return { type: 'limit', detail: ['salti'] };
    if (!ignoreCap && ex.lv > capLv(p)) return { type: 'cap', detail: [capLv(p)] };
    return null;
  }
  function avail(ex, p, ignoreCap) { return !blockReason(ex, p, ignoreCap); }

  /* ---------------------------------------------------------- catene */
  function limLabel(l) { return LIB.limits[l] || l; }
  function eqLabel(e) { return LIB.equipment[e] || e; }

  function resolve(cid, p, memo) {
    if (memo[cid]) return memo[cid];
    const meta = LIB.chains[cid], full = CH[cid];
    const isSkill = meta.group === 'skill';
    const res = { chain: cid, label: meta.label, steps: [], idx: -1, disabled: null, skill: isSkill };
    memo[cid] = res;

    if (isSkill) {
      if (p.skills.indexOf(cid) < 0) { res.disabled = 'Non selezionata'; res.unselected = true; return res; }
      if (p.caution || p.exp === 'sedentario') {
        res.disabled = 'Le skill avanzate si sbloccano dopo la fase di base: restano escluse con un profilo prudente o sedentario.';
        return res;
      }
      const forb = (meta.forbid || []).filter(function (f) { return p.limits.indexOf(f) >= 0; });
      if (forb.length) {
        res.disabled = 'Esclusa per le tue limitazioni (' + forb.map(limLabel).join(', ').toLowerCase() + ').';
        return res;
      }
    }

    const steps = full.filter(function (e) { return avail(e, p, isSkill); });
    if (!steps.length) {
      const first = full[0], r = blockReason(first, p, isSkill);
      res.disabled = r && r.type === 'eq'
        ? 'Manca l\'attrezzatura: ' + r.detail.map(eqLabel).join(', ').toLowerCase() + '.'
        : 'Nessun esercizio compatibile con le tue limitazioni.';
      return res;
    }
    res.steps = steps;

    if (isSkill) {
      for (let i = 0; i < (meta.prereq || []).length; i++) {
        const pr = meta.prereq[i], r = resolve(pr.chain, p, memo);
        const ok = r.idx >= 0 && POS[r.steps[r.idx].id] >= POS[pr.min];
        if (!ok) {
          res.disabled = 'Prerequisito mancante. ' + (meta.reqmsg || '');
          res.steps = []; return res;
        }
      }
    }

    const targetId = p.starts && p.starts[cid];
    let idx = -1;
    if (targetId && BY[targetId] && BY[targetId].chain === cid) {
      const tpos = POS[targetId];
      steps.forEach(function (s, i) { if (POS[s.id] <= tpos) idx = i; });
      if (idx < 0 && steps[0].lv <= BY[targetId].lv + 1) idx = 0;
    } else if (isSkill) {
      idx = 0;
    } else {
      let anchorLv = EXP_DEFAULT_LV[p.exp];
      let derived = false;
      if (meta.derive) {
        const a = resolve(meta.derive.frm, p, memo);
        if (a.idx >= 0) { anchorLv = a.steps[a.idx].lv + meta.derive.off; derived = true; }
      }
      steps.forEach(function (s, i) { if (s.lv <= anchorLv) idx = i; });
      if (idx < 0 && steps[0].lv <= anchorLv + 1) idx = 0;
      if (idx < 0 && derived) idx = -1;
    }
    if (idx < 0) {
      res.disabled = 'Non ancora disponibile al tuo livello.';
      res.steps = [];
      return res;
    }
    const advN = (p.adv && p.adv[cid]) || 0;
    idx = Math.min(steps.length - 1, idx + advN);
    res.idx = idx;
    return res;
  }

  function current(r) { return r && r.idx >= 0 ? r.steps[r.idx] : null; }
  function nextStep(r) { return r && r.idx >= 0 ? (r.steps[r.idx + 1] || null) : null; }

  /* ---------------------------------------------------------- prescrizione */
  function baseSets(p, b) {
    if (p.caution) return 2;
    if (p.exp === 'sedentario') return 2;
    if (p.exp === 'ripartenza') return b >= 1 ? 3 : 2;
    if (p.exp === 'attivo') return 3;
    return b >= 1 ? 4 : 3;
  }
  function frac(goal, wb, b) {
    const arr = GOALFR[goal] || GOALFR.salute;
    const f = arr[Math.min(wb === 3 ? 1 : wb, 2)];
    return Math.min(1, f + 0.15 * b);
  }
  function rirText(p) {
    if (p.caution || p.exp === 'sedentario') return 'Sforzo 5-6 su 10: devi riuscire a parlare. Mai a cedimento.';
    if (p.exp === 'ripartenza') return 'Lascia sempre 3 ripetizioni di riserva.';
    if (p.exp === 'attivo') return 'Lascia 2 ripetizioni di riserva.';
    return 'Lascia 1-2 ripetizioni di riserva; i tentativi di skill restano puliti e mai a cedimento.';
  }
  function workSec(ex, target) {
    const w = ex.kind === 'time' ? target : target * 3.5;
    return (ex.per ? w * 2 : w) + 10;
  }
  function restFor(p, ex, skill) {
    let r = skill ? REST.skill : (REST[p.goal] || 60);
    if (p.caution || p.exp === 'sedentario') r = Math.max(r, 60);
    if (ex.kind === 'time' && !skill) r = Math.min(r, 60);
    return r;
  }
  function prescribe(ex, p, w, opts) {
    opts = opts || {};
    const b = Math.floor(w / 4), wb = w % 4, deload = wb === 3;
    const skill = !!opts.skill;
    const goal = skill ? 'skill' : p.goal;
    const bb = (p.adv && p.adv[ex.chain]) ? 0 : b;
    const f = frac(goal, wb, bb);
    const target = Math.round(ex.lo + f * (ex.hi - ex.lo));
    let sets = opts.sets != null ? opts.sets : baseSets(p, bb);
    if (deload) sets = Math.max(1, Math.ceil(sets / 2));
    return { sets: sets, target: target, rest: restFor(p, ex, skill) };
  }
  function graduateText(ex, p, sets) {
    const rir = (p.caution || p.exp === 'sedentario') ? 'senza arrivare al limite' : 'con 2 ripetizioni di riserva';
    if (ex.kind === 'time')
      return sets + ' serie da ' + ex.hi + ' secondi' + (ex.per ? ' per lato' : '') + ' con tecnica pulita.';
    return sets + ' serie da ' + ex.hi + ' ripetizioni' + (ex.per ? ' per lato' : '') + ' con tecnica pulita, ' + rir + '.';
  }
  function estMin(ex, pr) {
    return pr.sets * (workSec(ex, pr.target) + pr.rest) / 60;
  }
  function worstMin(ex, p, skill, sets) {
    let m = 0;
    for (let w = 0; w < p.weeks; w++) {
      if (w % 4 === 3) continue;
      m = Math.max(m, estMin(ex, prescribe(ex, p, w, { skill: skill, sets: sets })));
    }
    return m;
  }

  /* ---------------------------------------------------------- skill */
  function adjacent(a, b) { const d = (a - b + 7) % 7; return d === 1 || d === 6; }
  function combos(arr, k) {
    const out = [];
    (function rec(start, cur) {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    })(0, []);
    return out;
  }
  function minGap(set, days) {
    if (set.length < 2) return 7;
    let g = 99;
    for (let i = 0; i < set.length; i++)
      for (let j = i + 1; j < set.length; j++) {
        const d = Math.abs(days[set[i]] - days[set[j]]);
        g = Math.min(g, d, 7 - d);
      }
    return g;
  }
  function scheduleSkills(days, skills, freqs) {
    const n = days.length;
    const plan = days.map(function () { return []; });
    const dropped = [];
    const idxs = days.map(function (_, i) { return i; });
    skills.forEach(function (sk) {
      const want = Math.min((freqs && freqs[sk]) || SKILL_FREQ[sk] || 1, n);
      const tendon = TENDON_SKILLS.indexOf(sk) >= 0;
      let placed = false;
      for (let f = want; f >= 1 && !placed; f--) {
        const cand = combos(idxs, f).sort(function (a, b) {
          return minGap(b, days) - minGap(a, days) || a.join().localeCompare(b.join());
        });
        for (let c = 0; c < cand.length && !placed; c++) {
          const set = cand[c];
          let ok = true;
          for (let k = 0; k < set.length && ok; k++) {
            const d = set[k];
            if (plan[d].length >= 2) { ok = false; break; }
            if (tendon) {
              if (plan[d].some(function (s) { return TENDON_SKILLS.indexOf(s) >= 0; })) { ok = false; break; }
              for (let o = 0; o < n; o++)
                if (o !== d && adjacent(days[o], days[d]) &&
                    plan[o].some(function (s) { return TENDON_SKILLS.indexOf(s) >= 0; })) { ok = false; break; }
              // anche tra i giorni scelti per la stessa skill
              for (let k2 = 0; k2 < set.length && ok; k2++)
                if (k2 !== k && adjacent(days[set[k2]], days[d])) ok = false;
            }
          }
          if (ok) { set.forEach(function (d) { plan[d].push(sk); }); placed = true; if (f < want) dropped.push({ skill: sk, partial: true, freq: f }); }
        }
      }
      if (!placed) dropped.push({ skill: sk, partial: false });
    });
    return { plan: plan, dropped: dropped };
  }

  /* ---------------------------------------------------------- riscaldamento e defaticamento */
  function warmup(minutes, session, p, hasBar) {
    const m = minutes;
    const items = [{ name: 'Marcia sul posto', detail: m <= 4 ? '60 secondi' : '90 secondi, ritmo crescente' }];
    items.push({ name: 'Gatto-cammello e rotazioni toraciche', detail: '8 ripetizioni + 6 per lato' });
    if (m > 4) items.push({ name: 'Circonduzioni delle spalle', detail: '10 per verso' });
    if (session.wrist) items.push({ name: 'Mobilità dei polsi', detail: 'Palmi e dorsi a terra, dondolii in avanti e indietro, 45 secondi' });
    if (session.push) items.push({ name: 'Scapular push-up', detail: 'In plank a braccia tese, avvicina e allarga le scapole, 8 ripetizioni' });
    if (session.pull && hasBar) items.push({ name: 'Appeso attivo', detail: '2 serie da 15 secondi, spalle basse' });
    if (session.lower) items.push({ name: 'Squat leggeri e cerchi con le anche', detail: '8 squat + 8 cerchi per lato' });
    if (m <= 4) return items.slice(0, 3);
    return items;
  }
  function cooldown(session) {
    const items = [{ name: 'Respirazione diaframmatica', detail: '5 respiri lenti, mani sull\'addome' }];
    if (session.upper) {
      items.push({ name: 'Pettorali al muro', detail: '30 secondi per lato' });
      items.push({ name: 'Posizione del bambino con braccia avanti', detail: '30 secondi' });
    }
    if (session.lower) {
      items.push({ name: 'Quadricipiti in piedi', detail: '30 secondi per lato' });
      items.push({ name: 'Femorali da seduto', detail: '30 secondi per lato' });
    }
    if (session.grip) items.push({ name: 'Avambracci e polsi', detail: '30 secondi per lato' });
    return items;
  }

  /* ---------------------------------------------------------- piano */
  function normalize(p) {
    const q = Object.assign({}, p);
    q.eq = (p.eq || []).slice();
    q.limits = (p.limits || []).slice();
    q.skills = (p.skills || []).slice();
    q.starts = Object.assign({}, p.starts || {});
    q.adv = Object.assign({}, p.adv || {});
    q.checked = p.checked || 0;
    q.exp = p.exp || 'ripartenza';
    q.goal = p.goal || 'salute';
    q.minutes = Math.max(15, Math.min(90, p.minutes || 30));
    q.weeks = [4, 8, 12].indexOf(p.weeks) >= 0 ? p.weeks : 4;
    q.days = (p.days || [0, 2, 4]).slice().sort(function (a, b) { return a - b; });
    if (q.goal !== 'skill' && q.goal !== 'forza' && q.goal !== 'massa' && q.goal !== 'resistenza') q.goal = 'salute';
    return q;
  }

  function buildPlan(profile) {
    const p = normalize(profile);
    const memo = {};
    const warnings = [];
    const chains = {};
    Object.keys(LIB.chains).forEach(function (cid) { chains[cid] = resolve(cid, p, memo); });

    const W = function (t, why, fix, lvl) { warnings.push({ t: t, why: why, fix: fix, lvl: lvl || 'warn' }); };
    const TENDON_WHY = 'Front lever, planche e muscle-up caricano molto gomiti, spalle e tendini, che si adattano più lentamente dei muscoli. Per questo l\'app non li mette mai in giorni consecutivi e mai due nello stesso giorno. È una regola prudente di buona pratica scelta da me, non un risultato di studi su questo programma.';
    if (p.caution)
      W('Hai risposto sì ad almeno una domanda di idoneità. Parlane con il medico prima di iniziare: il piano è in modalità prudente (intensità bassa, nessun salto, nessuna skill avanzata).',
        'Hai risposto "sì" ad almeno una delle domande iniziali. Non significa che tu abbia un problema, ma che prima di allenarti con intensità conviene un parere medico. Le domande sono scritte per questa app e non sono un test clinico validato.',
        'Parla con il tuo medico. Intanto il piano resta prudente: sforzo basso, niente salti, niente skill avanzate. Dopo la visita puoi rifare le domande da "Modifica profilo".');
    if (chains.pull_v.idx < 0 && chains.pull_h.steps.length && chains.pull_h.steps.every(function (s) { return s.eq.length === 0; }))
      W('Senza sbarra né tavolo robusto la tirata resta limitata: una sbarra da porta o due anelli cambiano molto il risultato.',
        'Trazioni e rematori richiedono un punto fisso a cui appendersi o un tavolo molto robusto. Senza, l\'app può proporre solo tirate leggere a terra, che non allenano la schiena come servirebbe, e le skill di tirata restano bloccate.',
        'Una sbarra da porta costa poco. In alternativa due anelli o cinghie appese a un punto sicuro. Poi aggiungila in "Modifica profilo", passo Attrezzi.');
    p.skills.forEach(function (sk) {
      const c = chains[sk];
      if (c.disabled && !c.unselected) {
        const dz = c.disabled;
        W(LIB.chains[sk].label + ': ' + dz,
          dz + ' Ogni skill richiede una base di forza e articolazioni sane: l\'app non te la propone finché non ci sono, per proteggere gomiti e spalle.',
          /limitazion/.test(dz) ? 'Se la limitazione è passata, toglila da "Modifica profilo". Altrimenti scegli un\'altra skill.'
            : /Prerequisito/.test(dz) ? 'Allena la base nel piano (trazioni, push-up). Quando avanzi di livello con il check di fine blocco, la skill si sblocca da sola.'
            : /prudente|sedentario|Le skill/.test(dz) ? 'Completa la fase di base: le skill si sbloccano dopo, con un nuovo piano.'
            : 'Controlla attrezzi e livello in "Modifica profilo".');
      }
    });

    if (p.minutes < 30 && activeSkillsPre(p, chains))
      W('Con meno di 30 minuti a sessione le skill avanzate restano fuori: servono riscaldamento specifico e pause lunghe.',
        'Una skill richiede energia fresca, un riscaldamento specifico e pause da 75 secondi o più tra i tentativi. In meno di 30 minuti non c\'è spazio per farle bene insieme alla forza.',
        'Porta il tempo a 30 minuti o più in "Modifica profilo", oppure tieni questo piano come fase di forza di base.');
    const n = p.days.length;
    const kinds = KINDS[n] || KINDS[3];
    const activeSkills = p.skills.filter(function (sk) { return chains[sk] && chains[sk].idx >= 0; });
    const freqs = {}, reduced = [];
    let sched;
    for (;;) {
      sched = scheduleSkills(p.days, activeSkills, freqs);
      const lost = sched.dropped.filter(function (d) { return !d.partial; }).map(function (d) { return d.skill; });
      if (!lost.length) break;
      const cand = activeSkills.filter(function (sk) {
        return lost.indexOf(sk) < 0 && TENDON_SKILLS.indexOf(sk) >= 0 && (freqs[sk] || SKILL_FREQ[sk] || 1) > 1;
      });
      if (!cand.length) break;
      freqs[cand[0]] = 1; reduced.push({ skill: cand[0], for: lost });
    }
    reduced.forEach(function (r) {
      W(LIB.chains[r.skill].label + ': con i tuoi giorni la porto a una volta a settimana per far entrare ' + r.for.map(function (x) { return LIB.chains[x].label; }).join(' e ') + '.',
        'Con i giorni scelti hai pochi posti per le skill che caricano i tendini. ' + TENDON_WHY + ' Tenere due skill a una volta a settimana è meglio che farne una sola a due volte, ma i progressi su ciascuna saranno più lenti.',
        'Per tenere entrambe a due volte a settimana servono giorni più distanziati, ad esempio lunedì, martedì, giovedì e sabato. Puoi cambiarli in "Modifica profilo".', 'info');
    });
    sched.dropped.forEach(function (d) {
      W(LIB.chains[d.skill].label + (d.partial
        ? ': con i giorni scelti riesco a inserirla solo ' + d.freq + ' volta a settimana.'
        : ': non trovo un giorno compatibile con le altre skill, per questo l\'ho lasciata fuori.'),
        'Con i giorni scelti non c\'è posto sufficiente. ' + TENDON_WHY,
        'Cambia i giorni (servono giorni non consecutivi) oppure togli una delle skill in "Modifica profilo".');
    });

    const m = p.minutes;
    const warmMin = m < 20 ? 3 : Math.max(4, Math.min(8, Math.round(m * 0.12)));
    const coolMin = m < 20 ? 2 : Math.max(3, Math.min(5, Math.round(m * 0.06)));
    const hasBar = p.eq.indexOf('sbarra') >= 0;

    const sessions = [];
    const pullVDays = {};
    p.days.forEach(function (wd, di) {
      const kind = kinds[di];
      const skillsToday = (m >= 30 ? sched.plan[di] : []);
      const hasSkill = skillsToday.length > 0;
      const skillMin = hasSkill ? Math.max(6, Math.min(12, Math.round(m * 0.22))) : 0;

      let condMin = 0;
      if (m >= 25) {
        const rem = m - warmMin - coolMin - skillMin;
        if (p.goal === 'resistenza') condMin = Math.round(rem * 0.3);
        else if (p.goal === 'salute') condMin = Math.max(5, Math.round(rem * 0.2));
        else if (kind === 'COND_CORE') condMin = Math.round(rem * 0.4);
      }
      if (kind === 'COND_CORE' && condMin === 0 && m >= 20) condMin = Math.round((m - warmMin - coolMin) * 0.3);
      const strengthBudget = m - warmMin - coolMin - skillMin - condMin;

      // skill
      const skillBlock = [];
      skillsToday.forEach(function (sk) {
        const r = chains[sk], ex = current(r);
        const allot = skillMin / skillsToday.length;
        const rest = restFor(p, ex, true);
        const maxSets = p.exp === 'esperto' ? 5 : p.exp === 'attivo' ? 4 : 3;
        let sets = maxSets;
        while (sets > 1 && worstMin(ex, p, true, sets) > allot) sets--;
        skillBlock.push({ chain: sk, exId: ex.id, sets: sets });
      });

      // forza
      const used = {};
      const strength = [];
      let acc = 0;
      const slots = SLOTS[kind];
      for (let s = 0; s < slots.length; s++) {
        let cand = slots[s];
        let cid = null;
        if (cand === 'PULL') {
          const vOK = chains.pull_v.idx >= 0;
          const adjV = p.days.some(function (od) { return adjacent(od, wd) && pullVDays[od]; });
          cid = (vOK && !adjV && !used.pull_v) ? 'pull_v' : 'pull_h';
          if (used[cid]) cid = null;
        } else {
          const list = Array.isArray(cand) ? cand : [cand];
          for (let k = 0; k < list.length; k++)
            if (!used[list[k]] && chains[list[k]] && chains[list[k]].idx >= 0) { cid = list[k]; break; }
        }
        if (!cid || used[cid] || chains[cid].idx < 0) continue;
        const ex = current(chains[cid]);
        const t = worstMin(ex, p, false, null);
        if (strength.length >= 1 && acc + t > strengthBudget) continue;
        strength.push({ chain: cid, exId: ex.id });
        used[cid] = true; acc += t;
        if (cid === 'pull_v') pullVDays[wd] = true;
      }
      if (!strength.length) {
        ['hinge', 'core_ext', 'core_post', 'pull_h'].some(function (c) {
          if (chains[c] && chains[c].idx >= 0) { strength.push({ chain: c, exId: current(chains[c]).id }); return true; }
          return false;
        });
      }
      // core in fondo
      const isCore = function (x) { return LIB.chains[x.chain].group === 'core'; };
      strength.sort(function (a, b) { return (isCore(a) ? 1 : 0) - (isCore(b) ? 1 : 0); });

      // condizionamento
      let cond = null;
      if (condMin > 0) cond = buildCond(p, chains, condMin);

      const ctx = {
        upper: strength.some(function (x) { return ['push_h', 'push_v', 'dip', 'pull_h', 'pull_v'].indexOf(x.chain) >= 0; }),
        lower: strength.some(function (x) { return ['squat', 'lunge', 'hinge'].indexOf(x.chain) >= 0; }),
        push: strength.some(function (x) { return ['push_h', 'push_v', 'dip'].indexOf(x.chain) >= 0; }) || skillsToday.indexOf('sk_hs') >= 0 || skillsToday.indexOf('sk_pl') >= 0,
        pull: strength.some(function (x) { return x.chain === 'pull_v'; }) || skillsToday.some(function (s) { return s === 'sk_fl' || s === 'sk_mu'; }),
      };
      const all = strength.concat(skillBlock);
      ctx.wrist = all.some(function (x) { return BY[x.exId].flags.indexOf('polsi') >= 0; });
      ctx.grip = ctx.pull;

      sessions.push({
        d: di, weekday: wd, dayName: DAYS[wd], kind: kind, label: KIND_LABEL[kind],
        warm: { min: warmMin, items: warmup(warmMin, ctx, p, hasBar) },
        skills: skillBlock, strength: strength, cond: cond,
        cool: { min: coolMin, items: cooldown(ctx) },
        skillMin: skillMin, condMin: condMin,
      });
    });

    // settimane
    const weeks = [];
    for (let w = 0; w < p.weeks; w++) {
      const b = Math.floor(w / 4), wb = w % 4;
      const wk = { w: w, block: b, wb: wb, phase: (b >= 1 && wb === 0) ? 'Ripresa' : PHASES[wb], deload: wb === 3, provisional: b > p.checked, sessions: [] };
      sessions.forEach(function (s) {
        const ws = {
          d: s.d, weekday: s.weekday, dayName: s.dayName, kind: s.kind, label: s.label,
          warm: s.warm, cool: s.cool, skills: [], strength: [], cond: null,
        };
        s.skills.forEach(function (x) {
          const ex = BY[x.exId], r = chains[x.chain];
          const pr = prescribe(ex, p, w, { skill: true, sets: x.sets });
          ws.skills.push(entry(ex, pr, nextStep(r), p, x.chain));
        });
        s.strength.forEach(function (x) {
          const ex = BY[x.exId], r = chains[x.chain];
          const pr = prescribe(ex, p, w);
          ws.strength.push(entry(ex, pr, nextStep(r), p, x.chain));
        });
        if (s.cond) ws.cond = condForWeek(s.cond, wk, p);
        // stima durata
        let est = s.warm.min + s.cool.min;
        ws.skills.forEach(function (e) { est += e.sets * (workSec(BY[e.exId], e.target) + e.rest) / 60; });
        ws.strength.forEach(function (e) { est += e.sets * (workSec(BY[e.exId], e.target) + e.rest) / 60; });
        if (ws.cond) est += ws.cond.min;
        const tm = function (e) { return e.sets * (workSec(BY[e.exId], e.target) + e.rest) / 60; };
        const pool = ws.strength.concat(ws.skills);
        while (est > m * 1.05 && pool.some(function (e) { return e.sets > 1; })) {
          pool.sort(function (a, b) { return tm(b) - tm(a); });
          const big = pool.filter(function (e) { return e.sets > 1; })[0];
          est -= (big.sets * (workSec(BY[big.exId], big.target) + big.rest) - (big.sets - 1) * (workSec(BY[big.exId], big.target) + big.rest)) / 60;
          big.sets -= 1;
        }
        ws.estMin = Math.round(est);
        wk.sessions.push(ws);
      });
      weeks.push(wk);
    }

    // cosa aspettarsi: stime prudenti, non promesse
    const blocks = Math.ceil(p.weeks / 4);
    const expect = [];
    function proj(cid, isSkill, freq) {
      const r = chains[cid];
      if (!r || r.idx < 0) return;
      const rate = isSkill ? (freq >= 2 ? 0.5 : 0.25) : 1;
      const gain = Math.floor(blocks * rate);
      const to = Math.min(r.steps.length - 1, r.idx + gain);
      const full = CH[cid][CH[cid].length - 1];
      expect.push({ chain: cid, label: LIB.chains[cid].label, skill: isSkill, from: r.steps[r.idx].name, to: r.steps[to].name,
        steps: to - r.idx, goal: full.name, reachesGoal: r.steps[to].id === full.id,
        capped: !isSkill && to === r.steps.length - 1 && CH[cid].length > r.steps.length });
    }
    ['push_h', chains.pull_v.idx >= 0 ? 'pull_v' : 'pull_h', 'squat', 'lunge'].forEach(function (c) { proj(c, false); });
    activeSkills.forEach(function (sk) {
      const days = sessions.filter(function (s) { return s.skills.some(function (x) { return x.chain === sk; }); }).length;
      if (days > 0) proj(sk, true, days);
    });
    expect.filter(function (e) { return e.skill && !e.reachesGoal; }).forEach(function (e) {
      W(e.label + ': in ' + p.weeks + ' settimane il traguardo realistico è «' + e.to + '», non «' + e.goal + '».',
        'Ogni gradino di una skill richiede in media molte settimane e la forza dei tendini cresce più lentamente di quella dei muscoli. Le mie stime (un gradino ogni 8 settimane con due sedute a settimana, uno ogni 16 con una seduta) sono prudenti e non sono una promessa: contano recupero, sonno, peso corporeo e costanza. Il piano non può saltare i gradini intermedi.',
        'Considera questo piano come la prima tappa. Alla fine rifai il profilo con i risultati nuovi e prosegui. Con 12 settimane e due sedute a settimana per la skill avanzi più in fretta.', 'info');
    });

    return {
      profile: p, warnings: warnings, expect: expect, rir: rirText(p),
      chains: summarizeChains(chains), sessions: sessions, weeks: weeks,
      meta: { n: n, minutes: m, goal: p.goal, exp: p.exp, caution: !!p.caution, capLv: capLv(p) },
    };
  }

  function activeSkillsPre(p, chains) {
    return p.skills.some(function (sk) { return chains[sk] && chains[sk].idx >= 0; });
  }

  function entry(ex, pr, next, p, chain) {
    return {
      exId: ex.id, chain: chain, sets: pr.sets, target: pr.target, rest: pr.rest,
      kind: ex.kind, per: ex.per, graduate: graduateText(ex, p, Math.max(2, Math.min(3, baseSets(p, 0)))),
      next: next ? { exId: next.id, name: next.name } : null,
    };
  }

  function summarizeChains(chains) {
    const out = {};
    Object.keys(chains).forEach(function (c) {
      const r = chains[c];
      out[c] = { label: r.label, idx: r.idx, disabled: r.disabled, unselected: !!r.unselected,
                 steps: r.steps.map(function (s) { return s.id; }),
                 current: r.idx >= 0 ? r.steps[r.idx].id : null };
    });
    return out;
  }

  /* ---------------------------------------------------------- condizionamento */
  function buildCond(p, chains, minutes) {
    const gentle = p.caution || p.exp === 'sedentario' || p.exp === 'ripartenza';
    const order = ['cond', 'squat', 'push_h', 'cond'];
    const items = [];
    const usedIds = {};
    order.forEach(function (cid, i) {
      const r = chains[cid];
      if (!r || r.idx < 0) return;
      let idx = r.idx;
      if (cid === 'push_h') idx = Math.max(0, r.idx - 1);
      if (cid === 'cond' && i === 3) idx = Math.max(0, r.idx - 1);
      let ex = r.steps[idx];
      if (usedIds[ex.id] && idx > 0) ex = r.steps[idx - 1];
      if (usedIds[ex.id]) return;
      usedIds[ex.id] = true;
      items.push(ex.id);
    });
    if (items.length < 3) {
      const r = chains.core_ext;
      if (r && r.idx >= 0) items.push(r.steps[Math.max(0, r.idx - 1)].id);
    }
    return { format: gentle ? 'intervalli' : 'amrap', min: minutes, items: items };
  }
  function condForWeek(c, wk, p) {
    const out = { format: c.format, min: c.min, items: [] };
    const scale = wk.deload ? 0.5 : 1;
    if (c.format === 'intervalli') {
      const work = 30, rest = wk.deload ? 45 : 30;
      const per = (work + rest) * c.items.length / 60;
      out.work = work; out.rest = rest;
      out.rounds = Math.max(1, Math.floor((c.min * (wk.deload ? 0.6 : 1)) / per));
      c.items.forEach(function (id) { out.items.push({ exId: id, secs: work }); });
      out.min = Math.round(out.rounds * per);
    } else {
      out.min = wk.deload ? Math.max(3, Math.round(c.min * 0.6)) : c.min;
      c.items.forEach(function (id) {
        const ex = BY[id];
        const f = frac(p.goal, wk.wb, wk.block);
        if (ex.kind === 'time') out.items.push({ exId: id, secs: Math.max(15, Math.round((ex.lo + (ex.hi - ex.lo) * f * 0.5) / 2)) });
        else out.items.push({ exId: id, reps: Math.max(4, Math.round((ex.lo + (ex.hi - ex.lo) * f * 0.5) * scale)) });
      });
    }
    return out;
  }

  /* ---------------------------------------------------------- scala di progressione (UI) */
  function ladder(cid, profile) {
    const p = normalize(profile);
    const memo = {}, r = resolve(cid, p, memo), isSkill = LIB.chains[cid].group === 'skill';
    return {
      chain: cid, label: LIB.chains[cid].label, disabled: r.disabled, idx: r.idx,
      steps: CH[cid].map(function (e) {
        const br = blockReason(e, p, isSkill);
        return { id: e.id, name: e.name, lv: e.lv, blocked: br ? br.type : null,
                 detail: br ? br.detail : null,
                 current: r.idx >= 0 && r.steps[r.idx].id === e.id };
      }),
    };
  }

  /* ---------------------------------------------------------- circuito rapido */
  const AREAS = {
    full: ['push_h', 'squat', 'PULL', 'hinge', 'core_ext', 'cond'],
    upper: ['push_h', 'PULL', 'push_v', 'dip', 'core_ext', 'pull_h'],
    lower: ['squat', 'lunge', 'hinge', 'cond', 'core_lat', 'squat'],
    core: ['core_ext', 'core_flex', 'core_lat', 'core_post', 'core_ext'],
    cardio: ['cond', 'squat', 'push_h', 'cond', 'hinge'],
  };
  function shuffle(a, rng) {
    const x = a.slice();

    if (wk.block > S.checked) return '<div class="card"><p class="small mut">Il check del blocco ' + (wk.block + 1) + ' si fa dopo quello del blocco ' + (S.checked + 1) + '.<\/p><\/div>';
    if (!list.length) return '<div class="card stack"><h3>Check di fine blocco<\/h3><button class="btn" data-act="closeblock">Chiudi il blocco<\/button><\/div>';
    return '<div class="card stack"><h3>Check di fine blocco ' + (wk.block + 1) + '<\/h3><p class="small mut">Spunta solo gli esercizi in cui hai davvero raggiunto il criterio, con tecnica pulita. Il piano avanza solo per quelli. Se non sei sicuro, lascia vuoto: ripetere un blocco è normale.<\/p>' +
      list.map(function (e) {
        return '<label class="opt ' + (S.chk[e.chain] ? 'on' : '') + '"><input type="checkbox" data-chk="' + e.chain + '" ' + (S.chk[e.chain] ? 'checked' : '') + '><span><b>' + esc(exName(e.exId)) + '<\/b><span class="small mut">Criterio: ' + esc(e.graduate) + ' Poi: ' + esc(e.next.name) + '<\/span><\/span><\/label>';
      }).join('') + '<button class="btn tape" data-act="closeblock">Conferma e aggiorna il piano<\/button><\/div>';
  }
  function curWeek() {
    for (var i = 0; i < plan.weeks.length; i++) if (weekDone(i) < plan.sessions.length) return i;
    return plan.weeks.length - 1;
  }
  function notifs() {
    if (!plan) return [];
    var out = plan.warnings.map(function (w) { return { key: w.t, t: w.t, why: w.why, fix: w.fix, lvl: w.lvl }; });
    var dl = S.checked * 4 + 3;
    if (dl < plan.weeks.length && curWeek() >= dl)
      out.unshift({ key: 'check-' + S.checked, t: 'È il momento del check di fine blocco ' + (S.checked + 1) + '.', lvl: 'info',
        why: 'Il piano avanza solo se confermi tu di aver raggiunto il criterio negli esercizi. Così non ti propone gradini che non sei pronto a fare.',
        fix: 'Vai nel tab Piano, apri la settimana ' + (dl + 1) + ' (scarico) e spunta solo gli esercizi in cui hai raggiunto il criterio con tecnica pulita.' });
    return out;
  }
  function unreadCount() { return notifs().filter(function (n) { return !has(S.seen, n.key); }).length; }
  function bellHtml() {
    if (S.step < 5 || !plan) return '<span><\/span>';
    var u = unreadCount();
    return '<button class="bell" data-act="bell" aria-label="Notifiche' + (u ? ', ' + u + ' nuove' : '') + '"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><\/svg>' + (u ? '<span class="badge">' + u + '<\/span>' : '') + '<\/button>';
  }
  function notifHtml() {
    if (!S.notif || !plan) return '';
    var list = notifs();
    var body = list.length ? list.map(function (n) {
      var isNew = has(S.newKeys, n.key);
      return '<div class="nt ' + (n.lvl === 'info' ? '' : 'w') + '"><p>' + (isNew ? '<span class="tag tp">Nuova<\/span> ' : '') + esc(n.t) + '<\/p>' +
        '<details><summary>Perché e cosa fare<\/summary><p class="small"><b>Perché.<\/b> ' + esc(n.why) + '<\/p><p class="small" style="margin-top:6px"><b>Cosa puoi fare.<\/b> ' + esc(n.fix) + '<\/p><\/details><\/div>';
    }).join('') : '<p class="mut">Nessuna notifica. Quando c\'è qualcosa da sapere sul tuo piano lo trovi qui.<\/p>';
    return '<div class="modal" data-act="bellclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="Notifiche"><div class="stack"><div class="row" style="justify-content:space-between"><h2>Notifiche<\/h2><button class="btn sec" data-act="bellclose">Chiudi<\/button><\/div>' + body + '<\/div><\/div><\/div>';
  }

  /* ------------------------------------------------ circuito rapido */
  var AREA = [['full', 'Corpo intero'], ['upper', 'Parte alta'], ['lower', 'Gambe'], ['core', 'Core'], ['cardio', 'Cardio']];
  function circuitView() {
    var o = S.circOpt, c = S.circ;
    var out = '<div class="stack"><h1>Circuito rapido<\/h1><p class="mut small">Un circuito singolo, costruito dalle tue progressioni al tuo livello attuale. Non sostituisce il piano.<\/p>' +
      '<h3>Zona<\/h3><div class="chips">' + AREA.map(function (a) { return '<button class="chip" data-act="carea" data-v="' + a[0] + '" aria-pressed="' + (o.area === a[0]) + '">' + a[1] + '<\/button>'; }).join('') + '<\/div>' +
      '<h3>Durata<\/h3><div class="chips">' + [8, 10, 15, 20].map(function (m) { return '<button class="chip" data-act="cmin" data-v="' + m + '" aria-pressed="' + (o.minutes === m) + '">' + m + ' min<\/button>'; }).join('') + '<\/div>' +
      '<h3>Esercizi<\/h3><div class="chips">' + [3, 4, 5, 6].map(function (m) { return '<button class="chip" data-act="cn" data-v="' + m + '" aria-pressed="' + (o.n === m) + '">' + m + '<\/button>'; }).join('') + '<\/div>' +
      '<button class="btn tape full" data-act="circ">Genera circuito<\/button>';
    if (c) {
      var head = c.mode === 'intervalli' ? c.rounds + ' giri · 30 s di lavoro, 30 s di pausa' : 'AMRAP ' + c.minutes + ' minuti';
      out += '<div class="card stack"><h2>' + head + '<\/h2>' + c.items.map(function (it) {
        var ex = E.byId(it.exId);
        return '<div class="ex"><div class="nm"><span>' + esc(ex.name) + '<\/span><span class="rx">' + (it.reps ? it.reps + (ex.per ? ' /lato' : '') : it.secs + ' s') + '<\/span><\/div>' + stepsHtml(ex) + '<\/div>';
      }).join('') + '<button class="btn sec" data-act="exportc">Esporta<\/button><\/div>';
    }
    return out + '<\/div>';
  }

  /* ------------------------------------------------ libreria */
  function libraryView() {
    var chains = Object.keys(LIB.chains), cid = S.ladderChain;
    var lad = E.ladder(cid, profile());
    var groups = { forza: 'Forza', core: 'Core', cond: 'Condizionamento', skill: 'Skill' };
    var out = '<div class="stack"><h1>Progressioni<\/h1><p class="mut small">Ogni movimento è una scala: parti dal gradino giusto e sali quando completi il criterio. Il gradino giallo è il tuo livello attuale; quelli grigi sono esclusi da attrezzi, limitazioni o livello.<\/p>' +
      '<div class="chips">' + chains.map(function (c) { return '<button class="chip" data-act="lc" data-v="' + c + '" aria-pressed="' + (c === cid) + '">' + esc(LIB.chains[c].label) + '<\/button>'; }).join('') + '<\/div>' +
      '<div class="card stack"><h2>' + esc(lad.label) + '<\/h2>' + (lad.disabled ? '<div class="warn">' + esc(lad.disabled) + '<\/div>' : '') + '<div class="ladder">' +
      lad.steps.slice().reverse().map(function (s) {
        var why = s.blocked === 'eq' ? 'serve ' + s.detail.map(function (x) { return LIB.equipment[x].toLowerCase(); }).join(', ') : s.blocked === 'limit' ? 'esclusa per: ' + s.detail.map(function (x) { return LIB.limits[x].toLowerCase(); }).join(', ') : s.blocked === 'cap' ? 'si sblocca con l\'esperienza' : '';
        return '<div class="stepbar ' + (s.current ? 'cur' : '') + (s.blocked ? ' blk' : '') + '"><span class="lv">L' + s.lv + '<\/span><span style="flex:1;min-width:0">' + esc(s.name) + (why ? '<span class="small mut" style="display:block">' + esc(why) + '<\/span>' : '') + '<\/span>' + (s.current ? '<span class="tag tp">Tu<\/span>' : '') + '<\/div>';
      }).join('') + '<\/div><\/div><\/div>';
    return out;
  }

  /* ------------------------------------------------ info */
  function infoView() {
    return '<div class="stack"><h1>Info<\/h1>' +
      '<div class="card stack"><h3>Come funziona<\/h3><p class="small">Il piano parte dal tuo livello dichiarato e dai test di collocazione, filtra gli esercizi per attrezzi e limitazioni, e alza la difficoltà solo quando raggiungi il criterio di passaggio. Ogni quarta settimana riduce le serie. Le skill che caricano i tendini (front lever, planche, muscle-up) non sono mai in giorni consecutivi.<\/p><\/div>' +
      '<div class="card stack"><h3>Limiti da conoscere<\/h3><ul class="small" style="margin:0;padding-left:20px"><li>Non è un consiglio medico e le domande iniziali non sono un test clinico validato.<\/li><li>Le regole su recuperi, frequenza delle skill e criteri di passaggio sono scelte di buona pratica, non risultati di studi su questo programma.<\/li><li>La libreria contiene 93 esercizi curati; non ci sono video o immagini.<\/li><li>Il progresso è salvato solo su questo dispositivo.<\/li><\/ul><\/div>' +
      '<div class="card stack"><h3>Dati e licenza<\/h3><p class="small">I testi di molti esercizi derivano dal dataset <i>exercises-dataset<\/i> di Hasan Emir Yıldırım, usato con licenza MIT. Le immagini e le animazioni di quel progetto sono © Gym visual e <b>non sono usate<\/b> in questa app.<\/p><pre class="lic">' + esc(LICENSE) + '<\/pre><\/div>' +
      '<div class="card stack"><h3>Dati personali<\/h3>' + (S.confirmReset
        ? '<p class="small">Cancello profilo e progressi da questo dispositivo?<\/p><div class="row"><button class="btn" data-act="reset2">Sì, cancella<\/button><button class="btn sec" data-act="reset0">Annulla<\/button><\/div>'
        : '<button class="btn sec" data-act="reset1">Cancella profilo e progressi<\/button>') + '<\/div><\/div>';
  }

  /* ------------------------------------------------ export */
  function planText() {
    var L = ['PIANO DI ALLENAMENTO' + (S.p.name ? ' - ' + S.p.name : ''), 'Obiettivo: ' + S.p.goal + ' | ' + plan.sessions.length + ' giorni | ' + S.p.minutes + ' min | ' + plan.weeks.length + ' settimane', plan.rir, ''];
    plan.warnings.forEach(function (w) { L.push('NOTA: ' + w.t); });
    plan.weeks.forEach(function (wk) {
      L.push('', '=== SETTIMANA ' + (wk.w + 1) + ' (' + wk.phase + (wk.deload ? ', scarico' : '') + ') ===');
      wk.sessions.forEach(function (s) {
        L.push('', s.dayName + ' - ' + s.label + ' (~' + s.estMin + ' min)');
        s.skills.concat(s.strength).forEach(function (e) { L.push('  ' + exName(e.exId) + ': ' + rx(e) + ', recupero ' + e.rest + ' s'); });
        if (s.cond) L.push('  Condizionamento: ' + (s.cond.format === 'intervalli' ? s.cond.rounds + ' giri 30/30' : 'AMRAP ' + s.cond.min + ' min') + ' - ' + s.cond.items.map(function (i) { return (i.reps || i.secs + 's') + ' ' + exName(i.exId); }).join(', '));
      });
    });
    L.push('', 'Non è un consiglio medico. Testi esercizi in parte da exercises-dataset (MIT, Hasan Emir Yildirim).');
    return L.join('\n');
  }
  function circText() {
    var c = S.circ;
    return ['CIRCUITO', c.mode === 'intervalli' ? c.rounds + ' giri 30/30' : 'AMRAP ' + c.minutes + ' min'].concat(c.items.map(function (i) { return '- ' + exName(i.exId) + ': ' + (i.reps ? i.reps : i.secs + ' s'); })).join('\n');
  }
  function exportText(name, text) {
    if (typeof claude === 'undefined' || !claude.use) {
      try {
        var u = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
        var a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000); toast('File salvato');
      } catch (e) { navigator.clipboard.writeText(text).then(function () { toast('Copiato negli appunti'); }, function () { toast('Esportazione non riuscita'); }); }
      return;
    }
    Promise.resolve(claude.use('downloads')).then(function (d) {
      if (!d) { return navigator.clipboard.writeText(text).then(function () { toast('Copiato negli appunti'); }); }
      return d.save({ filename: name, data: text }).then(function (r) { if (r) toast('Esportato'); });
    }).catch(function () { toast('Esportazione non riuscita'); });
  }

  /* ------------------------------------------------ render */
  var TABS = [['piano', 'Piano'], ['circuito', 'Circuito'], ['libreria', 'Scale'], ['info', 'Info']];
  function render() {
    var body;
    if (S.tab === 'piano') body = S.step >= 5 ? planView() : wizard();
    else if (S.tab === 'circuito') body = S.step >= 5 ? circuitView() : '<div class="stack"><h1>Circuito rapido<\/h1><div class="warn">Completa prima il profilo nel tab Piano: servono livello, attrezzi e limitazioni per costruire un circuito adatto a te.<\/div><\/div>';
    else if (S.tab === 'libreria') body = libraryView();
    else body = infoView();
    document.getElementById('app').innerHTML = '<div class="top"><span class="brand"><i><\/i>Palestra Libera<\/span>' + bellHtml() + '<\/div>' + body + notifHtml();
    document.getElementById('tabs').innerHTML = TABS.map(function (t) { return '<button role="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '<\/button>'; }).join('');
    save();
  }
  function go(fn) { fn(); render(); }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var a = b.dataset.act, v = b.dataset.v, p = S.p;
    if (a === 'bellclose' && b.classList.contains('modal') && ev.target !== b) return;
    var top = function () { window.scrollTo(0, 0); };
    go(function () {
      if (a === 'tab') { S.tab = v; top(); }
      else if (a === 'scr') { p.screenAns = p.screenAns || []; var i = +b.dataset.i; if (!has(p.screenAns, i)) p.screenAns.push(i); var idx = p.screen.indexOf(i); if (v === '1' && idx < 0) p.screen.push(i); if (v === '0' && idx >= 0) p.screen.splice(idx, 1); }
      else if (a === 'next') { S.step = Math.min(4, S.step + 1); top(); }
      else if (a === 'back') { S.step = Math.max(0, S.step - 1); top(); }
      else if (a === 'exp') { p.exp = v; if (v === 'sedentario') p.skills = []; if (p.goal === 'skill' && v !== 'attivo' && v !== 'esperto') p.goal = 'salute'; p.starts = {}; }
      else if (a === 'goal') { p.goal = v; }
      else if (a === 'min') p.minutes = +v;
      else if (a === 'weeks') p.weeks = +v;
      else if (a === 'day') { var d = +v; toggle(p.days, d); p.days.sort(function (x, y) { return x - y; }); }
      else if (a === 'start') { p.starts[b.dataset.c] = p.starts[b.dataset.c] === v ? undefined : v; if (p.starts[b.dataset.c] === undefined) delete p.starts[b.dataset.c]; }
      else if (a === 'gen') { S.step = 5; S.wk = 0; S.done = {}; S.adv = {}; S.checked = 0; S.chk = {}; S.seen = []; rebuild(); top(); }
      else if (a === 'bell') { S.newKeys = notifs().filter(function (n) { return !has(S.seen, n.key); }).map(function (n) { return n.key; }); notifs().forEach(function (n) { if (!has(S.seen, n.key)) S.seen.push(n.key); }); S.notif = true; }
      else if (a === 'bellclose') { S.notif = false; }
      else if (a === 'closeblock') { Object.keys(S.chk).forEach(function (c) { if (S.chk[c]) S.adv[c] = (S.adv[c] || 0) + 1; }); S.chk = {}; S.checked += 1; rebuild(); toast('Piano aggiornato'); }
      else if (a === 'edit') { S.step = 1; top(); }
      else if (a === 'wk') { S.wk = +v; }
      else if (a === 'export') exportText('piano-allenamento.txt', planText());
      else if (a === 'exportc') exportText('circuito.txt', circText());
      else if (a === 'carea') S.circOpt.area = v;
      else if (a === 'cmin') S.circOpt.minutes = +v;
      else if (a === 'cn') S.circOpt.n = +v;
      else if (a === 'circ') S.circ = E.quickCircuit(profile(), S.circOpt);
      else if (a === 'lc') S.ladderChain = v;
      else if (a === 'reset1') S.confirmReset = true;
      else if (a === 'reset0') S.confirmReset = false;
      else if (a === 'reset2') { S = JSON.parse(JSON.stringify(DEF)); plan = null; try { localStorage.removeItem(KEY); } catch (e) {} }
    });
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.notif) { S.notif = false; render(); } });
  document.addEventListener('change', function (ev) {
    var t = ev.target, p = S.p;
    if (t.dataset.bind) { p[t.dataset.bind] = t.type === 'checkbox' ? t.checked : t.value; if (t.type === 'checkbox') render(); else save(); }
    else if (t.dataset.tog) { toggle(p[t.dataset.tog], t.dataset.v); if (t.dataset.tog !== 'skills') p.starts = p.starts; render(); }
    else if (t.dataset.chk) { S.chk[t.dataset.chk] = t.checked; render(); }
    else if (t.dataset.done) { S.done[t.dataset.done] = t.checked; render(); }
  });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (S.step >= 5) rebuild();
  render();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script></body></html>
