<script>/* Motore del piano: puro, senza DOM, testabile in Node. */
(function (root) {
  'use strict';

  const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
  const DAYS_SHORT = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  const GOALFR = {
    salute: [0.15, 0.45, 0.75],
    forza: [0.0, 0.3, 0.6],
    massa: [0.4, 0.7, 1.0],
    resistenza: [0.7, 0.9, 1.0],
    skill: [0.2, 0.5, 0.8],
  };
  const REST = { salute: 60, forza: 90, massa: 60, resistenza: 40, skill: 75 };
  const EXP_DEFAULT_LV = { sedentario: 0, ripartenza: 1, attivo: 2, esperto: 3 };
  const TENDON_SKILLS = ['sk_fl', 'sk_pl', 'sk_mu'];
  const SKILL_FREQ = { sk_hs: 2, sk_fl: 2, sk_pl: 2, sk_mu: 1 };
  const PHASES = ['Introduzione', 'Costruzione', 'Picco', 'Scarico'];

  const KINDS = {
    1: ['FULL_A'],
    2: ['FULL_A', 'FULL_B'],
    3: ['FULL_A', 'FULL_B', 'FULL_C'],
    4: ['UPPER_1', 'LOWER_1', 'UPPER_2', 'LOWER_2'],
    5: ['UPPER_1', 'LOWER_1', 'FULL_LIGHT', 'UPPER_2', 'LOWER_2'],
    6: ['UPPER_1', 'LOWER_1', 'UPPER_2', 'LOWER_2', 'FULL_LIGHT', 'COND_CORE'],
    7: ['UPPER_1', 'LOWER_1', 'UPPER_2', 'LOWER_2', 'FULL_LIGHT', 'COND_CORE', 'FULL_A'],
  };
  const RUNKINDS = { 1: ['RUN_A'], 2: ['RUN_A', 'RUN_B'], 3: ['RUN_A', 'RUN_B', 'RUN_C'] };
  const KIND_LABEL = {
    FULL_A: 'Corpo intero A', FULL_B: 'Corpo intero B', FULL_C: 'Corpo intero C',
    UPPER_1: 'Parte alta A', UPPER_2: 'Parte alta B', LOWER_1: 'Gambe A', LOWER_2: 'Gambe B',
    FULL_LIGHT: 'Corpo intero leggero', COND_CORE: 'Core e condizionamento',
    RUN_A: 'Forza per la corsa A', RUN_B: 'Forza per la corsa B', RUN_C: 'Parte alta e core',
  };
  const SLOTS = {
    FULL_A: ['push_h', 'squat', 'PULL', 'core_ext', 'hinge', 'core_lat', 'lunge'],
    FULL_B: [['push_v', 'dip', 'push_h'], 'hinge', 'PULL', 'lunge', 'core_flex', 'push_h', 'core_post'],
    FULL_C: ['push_h', 'lunge', 'PULL', 'squat', 'core_post', 'hinge', 'core_lat'],
    UPPER_1: ['push_h', 'PULL', 'push_v', 'pull_h', 'core_ext', 'dip'],
    UPPER_2: ['push_h', 'PULL', 'dip', 'pull_h', 'core_flex', 'push_v'],
    LOWER_1: ['squat', 'hinge', 'lunge', 'core_ext', 'core_lat', 'core_post'],
    LOWER_2: ['lunge', 'hinge', 'squat', 'core_flex', 'core_lat', 'core_post'],
    FULL_LIGHT: ['squat', 'push_h', 'PULL', 'core_ext', 'hinge'],
    COND_CORE: ['core_ext', 'core_flex', 'core_lat', 'core_post', 'hinge'],
    RUN_A: ['squat', 'hinge', 'calf', 'lunge', 'core_lat'],
    RUN_B: ['lunge', 'hinge', 'calf', 'squat', 'core_ext', 'core_post'],
    RUN_C: ['push_h', 'PULL', 'core_ext', 'core_lat', 'hinge'],
  };

  let LIB = null, BY = {}, CH = {}, POS = {};

  function init(lib) {
    LIB = lib; BY = {}; CH = {}; POS = {};
    lib.exercises.forEach(function (e) {
      BY[e.id] = e;
      (CH[e.chain] = CH[e.chain] || []).push(e);
    });
    Object.keys(CH).forEach(function (c) { CH[c].forEach(function (e, i) { POS[e.id] = i; }); });
    return api;
  }

  /* ---------------------------------------------------------- filtri */
  function capLv(p) {
    if (p.caution || p.exp === 'sedentario') return 2;
    if (p.exp === 'ripartenza') return 3;
    return 5;
  }
  function wcap(p) {
    const base = { mai: 1, qualche: 2, regolare: 5 }[p.wexp || 'mai'];
    return Math.min(5, base + Math.min(2, p.checked || 0));
  }
  function noImpact(p) { return p.caution || p.limits.indexOf('salti') >= 0; }
  function haveEq(p, req) {
    return p.eq.indexOf(req) >= 0 || (req === 'tavolo' && p.eq.indexOf('anelli') >= 0);
  }
  function blockReason(ex, p, ignoreCap) {
    const miss = ex.eq.filter(function (r) { return !haveEq(p, r); });
    if (miss.length) return { type: 'eq', detail: miss };
    const lim = ex.flags.filter(function (f) { return p.limits.indexOf(f) >= 0; });
    if (lim.length) return { type: 'limit', detail: lim };
    if (noImpact(p) && ex.flags.indexOf('salti') >= 0) return { type: 'limit', detail: ['salti'] };
    const cap = ex.w ? Math.min(capLv(p), wcap(p)) : capLv(p);
    if (!ignoreCap && ex.lv > cap) return { type: 'cap', detail: [cap] };
    return null;
  }
  function avail(ex, p, ignoreCap) { return !blockReason(ex, p, ignoreCap); }

  /* ---------------------------------------------------------- catene */
  function limLabel(l) { return LIB.limits[l] || l; }
  function eqLabel(e) { return LIB.equipment[e] || e; }

  function resolve(cid, p, memo) {
    if (memo[cid]) return memo[cid];
    const meta = LIB.chains[cid], full = CH[cid];
    const isSkill = meta.group === 'skill';
    const res = { chain: cid, label: meta.label, steps: [], idx: -1, disabled: null, skill: isSkill };
    memo[cid] = res;

    if (meta.group === 'pesi' && p.mode !== 'pesi') { res.disabled = 'Modalità pesi non attiva'; res.unselected = true; return res; }
    if (isSkill) {
      if (p.skills.indexOf(cid) < 0) { res.disabled = 'Non selezionata'; res.unselected = true; return res; }
      if (p.caution || p.exp === 'sedentario') {
        res.disabled = 'Le skill avanzate si sbloccano dopo la fase di base: restano escluse con un profilo prudente o sedentario.';
        return res;
      }
      const forb = (meta.forbid || []).filter(function (f) { return p.limits.indexOf(f) >= 0; });
      if (forb.length) {
        res.disabled = 'Esclusa per le tue limitazioni (' + forb.map(limLabel).join(', ').toLowerCase() + ').';
        return res;
      }
    }

    const steps = full.filter(function (e) { return avail(e, p, isSkill); });
    if (!steps.length) {
      const first = full[0], r = blockReason(first, p, isSkill);
      res.disabled = r && r.type === 'eq'
        ? 'Manca l\'attrezzatura: ' + r.detail.map(eqLabel).join(', ').toLowerCase() + '.'
        : 'Nessun esercizio compatibile con le tue limitazioni.';
      return res;
    }
    res.steps = steps;

    if (isSkill) {
      for (let i = 0; i < (meta.prereq || []).length; i++) {
        const pr = meta.prereq[i], r = resolve(pr.chain, p, memo);
        const ok = r.idx >= 0 && POS[r.steps[r.idx].id] >= POS[pr.min];
        if (!ok) {
          res.disabled = 'Prerequisito mancante. ' + (meta.reqmsg || '');
          res.steps = []; return res;
        }
      }
    }

    const targetId = p.starts && p.starts[cid];
    let idx = -1;
    if (targetId && BY[targetId] && BY[targetId].chain === cid) {
      const tpos = POS[targetId];
      steps.forEach(function (s, i) { if (POS[s.id] <= tpos) idx = i; });
      if (idx < 0 && steps[0].lv <= BY[targetId].lv + 1) idx = 0;
    } else if (isSkill) {
      idx = 0;
    } else {
      let anchorLv = EXP_DEFAULT_LV[p.exp];
      if (meta.group === 'pesi') anchorLv = { mai: 0, qualche: 1, regolare: (p.exp === 'esperto' ? 3 : 2) }[p.wexp || 'mai'];
      let derived = false;
      if (meta.derive) {
        const a = resolve(meta.derive.frm, p, memo);
        if (a.idx >= 0) { anchorLv = a.steps[a.idx].lv + meta.derive.off; derived = true; }
      }
      steps.forEach(function (s, i) { if (s.lv <= anchorLv) idx = i; });
      if (idx < 0 && steps[0].lv <= anchorLv + 1) idx = 0;
      if (idx < 0 && derived) idx = -1;
    }
    if (idx < 0) {
      res.disabled = 'Non ancora disponibile al tuo livello.';
      res.steps = [];
      return res;
    }
    const advN = (p.adv && p.adv[cid]) || 0;
    idx = Math.min(steps.length - 1, idx + advN);
    res.idx = idx;
    return res;
  }

  function current(r) { return r && r.idx >= 0 ? r.steps[r.idx] : null; }
  function nextStep(r) { return r && r.idx >= 0 ? (r.steps[r.idx + 1] || null) : null; }

  /* ---------------------------------------------------------- prescrizione */
  function baseSets(p, b) {
    if (p.caution) return 2;
    if (p.exp === 'sedentario') return 2;
    if (p.exp === 'ripartenza') return b >= 1 ? 3 : 2;
    if (p.exp === 'attivo') return 3;
    return b >= 1 ? 4 : 3;
  }
  function frac(goal, wb, b) {
    const arr = GOALFR[goal] || GOALFR.salute;
    const f = arr[Math.min(wb === 3 ? 1 : wb, 2)];
    return Math.min(1, f + 0.15 * b);
  }
  function rirText(p) {
    if (p.caution || p.exp === 'sedentario') return 'Sforzo 5-6 su 10: devi riuscire a parlare. Mai a cedimento.';
    if (p.exp === 'ripartenza') return 'Lascia sempre 3 ripetizioni di riserva.';
    if (p.exp === 'attivo') return 'Lascia 2 ripetizioni di riserva.';
    return 'Lascia 1-2 ripetizioni di riserva; i tentativi di skill restano puliti e mai a cedimento.';
  }
  function workSec(ex, target) {
    const w = ex.kind === 'time' ? target : target * 3.5;
    const setup = ex.w ? (ex.w.ld === 'bar' ? 35 : 15) : 10;
    return (ex.per ? w * 2 : w) + setup;
  }
  /* ---------- pesi */
  const WR = { forza: [4, 6], massa: [8, 12], salute: [10, 15], resistenza: [12, 20], skill: [8, 12] };
  function wRange(ex, p, b) {
    let r = ex.w.mv === 'iso' ? [10, 15] : (WR[p.goal] || WR.salute);
    const begin = (p.wexp === 'mai' || p.caution || p.exp === 'sedentario' || p.exp === 'ripartenza') && b === 0;
    if (begin && ex.w.mv !== 'iso') r = [10, 15];
    let lo = Math.max(ex.lo, r[0]), hi = Math.min(ex.hi, r[1]);
    if (lo > hi) { lo = ex.lo; hi = Math.min(ex.hi, ex.lo + 3); }
    return [lo, hi];
  }
  function wRest(ex, p) {
    if (ex.w.mv === 'iso') return 60;
    const r = { forza: 150, massa: 90, salute: 75, resistenza: 60, skill: 75 }[p.goal] || 75;
    return r;
  }
  function restFor(p, ex, skill) {
    let r = skill ? REST.skill : (REST[p.goal] || 60);
    if (p.caution || p.exp === 'sedentario') r = Math.max(r, 60);
    if (ex.kind === 'time' && !skill) r = Math.min(r, 60);
    return r;
  }
  function prescribe(ex, p, w, opts) {
    opts = opts || {};
    const b = Math.floor(w / 4), wb = w % 4, deload = wb === 3;
    const skill = !!opts.skill;
    const goal = skill ? 'skill' : p.goal;
    const bb = (p.adv && p.adv[ex.chain]) ? 0 : b;
    if (ex.w) {
      let sw = opts.sets != null ? opts.sets : baseSets(p, bb);
      if (deload) sw = Math.max(1, Math.ceil(sw / 2));
      const rg = wRange(ex, p, bb);
      return { sets: sw, target: rg[1], rest: wRest(ex, p), range: rg };
    }
    const f = frac(goal, wb, bb);
    const target = Math.round(ex.lo + f * (ex.hi - ex.lo));
    let sets = opts.sets != null ? opts.sets : baseSets(p, bb);
    if (deload) sets = Math.max(1, Math.ceil(sets / 2));
    return { sets: sets, target: target, rest: restFor(p, ex, skill) };
  }
  function graduateW(ex, pr) {
    return 'tutte le serie in cima alla forbice (' + pr.range[1] + ' ripetizioni) con tecnica pulita per 4 settimane, avendo già aumentato il carico almeno 2 volte.';
  }
  function graduateText(ex, p, sets) {
    const rir = (p.caution || p.exp === 'sedentario') ? 'senza arrivare al limite' : 'con 2 ripetizioni di riserva';
    if (ex.kind === 'time')
      return sets + ' serie da ' + ex.hi + ' secondi' + (ex.per ? ' per lato' : '') + ' con tecnica pulita.';
    return sets + ' serie da ' + ex.hi + ' ripetizioni' + (ex.per ? ' per lato' : '') + ' con tecnica pulita, ' + rir + '.';
  }
  function estMin(ex, pr) {
    return pr.sets * (workSec(ex, pr.target) + pr.rest) / 60;
  }
  function worstMin(ex, p, skill, sets) {
    let m = 0;
    for (let w = 0; w < p.weeks; w++) {
      if (w % 4 === 3) continue;
      m = Math.max(m, estMin(ex, prescribe(ex, p, w, { skill: skill, sets: sets })));
    }
    return m;
  }

  /* ---------------------------------------------------------- skill */
  function adjacent(a, b) { const d = (a - b + 7) % 7; return d === 1 || d === 6; }
  function combos(arr, k) {
    const out = [];
    (function rec(start, cur) {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    })(0, []);
    return out;
  }
  function minGap(set, days) {
    if (set.length < 2) return 7;
    let g = 99;
    for (let i = 0; i < set.length; i++)
      for (let j = i + 1; j < set.length; j++) {
        const d = Math.abs(days[set[i]] - days[set[j]]);
        g = Math.min(g, d, 7 - d);
      }
    return g;
  }
  function scheduleSkills(days, skills, freqs) {
    const n = days.length;
    const plan = days.map(function () { return []; });
    const dropped = [];
    const idxs = days.map(function (_, i) { return i; });
    skills.forEach(function (sk) {
      const want = Math.min((freqs && freqs[sk]) || SKILL_FREQ[sk] || 1, n);
      const tendon = TENDON_SKILLS.indexOf(sk) >= 0;
      let placed = false;
      for (let f = want; f >= 1 && !placed; f--) {
        const cand = combos(idxs, f).sort(function (a, b) {
          return minGap(b, days) - minGap(a, days) || a.join().localeCompare(b.join());
        });
        for (let c = 0; c < cand.length && !placed; c++) {
          const set = cand[c];
          let ok = true;
          for (let k = 0; k < set.length && ok; k++) {
            const d = set[k];
            if (plan[d].length >= 2) { ok = false; break; }
            if (tendon) {
              if (plan[d].some(function (s) { return TENDON_SKILLS.indexOf(s) >= 0; })) { ok = false; break; }
              for (let o = 0; o < n; o++)
                if (o !== d && adjacent(days[o], days[d]) &&
                    plan[o].some(function (s) { return TENDON_SKILLS.indexOf(s) >= 0; })) { ok = false; break; }
              // anche tra i giorni scelti per la stessa skill
              for (let k2 = 0; k2 < set.length && ok; k2++)
                if (k2 !== k && adjacent(days[set[k2]], days[d])) ok = false;
            }
          }
          if (ok) { set.forEach(function (d) { plan[d].push(sk); }); placed = true; if (f < want) dropped.push({ skill: sk, partial: true, freq: f }); }
        }
      }
      if (!placed) dropped.push({ skill: sk, partial: false });
    });
    return { plan: plan, dropped: dropped };
  }

  /* ---------------------------------------------------------- riscaldamento e defaticamento */
  function warmup(minutes, session, p, hasBar) {
    const m = minutes;
    const items = [{ name: 'Marcia sul posto', detail: m <= 4 ? '60 secondi' : '90 secondi, ritmo crescente' }];
    items.push({ name: 'Gatto-cammello e rotazioni toraciche', detail: '8 ripetizioni + 6 per lato' });
    if (m > 4) items.push({ name: 'Circonduzioni delle spalle', detail: '10 per verso' });
    if (session.wrist) items.push({ name: 'Mobilità dei polsi', detail: 'Palmi e dorsi a terra, dondolii in avanti e indietro, 45 secondi' });
    if (session.push) items.push({ name: 'Scapular push-up', detail: 'In plank a braccia tese, avvicina e allarga le scapole, 8 ripetizioni' });
    if (session.pull && hasBar) items.push({ name: 'Appeso attivo', detail: '2 serie da 15 secondi, spalle basse' });
    if (session.wt) items.push({ name: 'Serie di avvicinamento', detail: session.bar
      ? 'Per ogni esercizio con bilanciere: 1 serie da 10 a vuoto o leggera, poi 1 da 5 al 60% del carico di lavoro'
      : 'Per ogni esercizio: 1 serie leggera da 10 ripetizioni con metà del carico di lavoro' });
    if (session.lower) items.push({ name: 'Squat leggeri e cerchi con le anche', detail: '8 squat + 8 cerchi per lato' });
    if (m <= 4) return items.slice(0, 3);
    return items;
  }
  function cooldown(session) {
    const items = [{ name: 'Respirazione diaframmatica', detail: '5 respiri lenti, mani sull\'addome' }];
    if (session.upper) {
      items.push({ name: 'Pettorali al muro', detail: '30 secondi per lato' });
      items.push({ name: 'Posizione del bambino con braccia avanti', detail: '30 secondi' });
    }
    if (session.lower) {
      items.push({ name: 'Quadricipiti in piedi', detail: '30 secondi per lato' });
      items.push({ name: 'Femorali da seduto', detail: '30 secondi per lato' });
    }
    if (session.grip) items.push({ name: 'Avambracci e polsi', detail: '30 secondi per lato' });
    return items;
  }

  /* ---------------------------------------------------------- piano */
  function normalize(p) {
    const q = Object.assign({}, p);
    q.eq = (p.eq || []).slice();
    q.limits = (p.limits || []).slice();
    q.skills = (p.skills || []).slice();
    q.starts = Object.assign({}, p.starts || {});
    q.adv = Object.assign({}, p.adv || {});
    q.checked = p.checked || 0;
    q.exp = p.exp || 'ripartenza';
    q.goal = p.goal || 'salute';
    q.minutes = Math.max(15, Math.min(90, p.minutes || 30));
    q.weeks = [4, 8, 12].indexOf(p.weeks) >= 0 ? p.weeks : 4;
    q.days = (p.days || [0, 2, 4]).slice().sort(function (a, b) { return a - b; });
    const cl = function (v, lo, hi, d) { v = +v; if (!isFinite(v) || v === 0 && d != null && lo > 0) v = d; return Math.max(lo, Math.min(hi, v)); };
    q.focus = p.focus === 'corsa' ? 'corsa' : 'muscoli';
    q.rtype = ['grow', '5k', '10k', 'half', 'marathon', 'trail'].indexOf(p.rtype) >= 0 ? p.rtype : 'grow';
    q.rtarget = cl(p.rtarget, 8, 45, 21);
    q.rtrailKm = cl(p.rtrailKm, 10, 50, 25);
    q.rdplus = cl(p.rdplus || 0, 0, 3500);
    q.rweeks = Math.round(cl(p.rweeks, 8, 52, 24));
    q.rnowLong = cl(p.rnowLong || 0, 0, 35);
    q.rnowWeek = cl(p.rnowWeek || 0, 0, 120);
    q.rpace = cl(p.rpace, 4, 10, 6.5);
    q.rn = Math.round(cl(p.rn, 2, 5, 3));
    if (q.focus === 'corsa') {
      q.weeks = q.rweeks; q.skills = []; q.run = false;
      q.days = q.days.filter(function (d, i, a) { return d >= 0 && d <= 6 && a.indexOf(d) === i; }).slice(0, 3);
    }
    q.mode = p.mode === 'pesi' ? 'pesi' : 'libero';
    q.wexp = ['mai', 'qualche', 'regolare'].indexOf(p.wexp) >= 0 ? p.wexp : 'mai';
    q.run = !!p.run;
    q.runLevel = [0, 1, 2, 3, 4].indexOf(p.runLevel) >= 0 ? p.runLevel : 0;
    q.runDays = (p.runDays || []).filter(function (d) { return d >= 0 && d <= 6; }).slice();
    if (q.goal !== 'skill' && q.goal !== 'forza' && q.goal !== 'massa' && q.goal !== 'resistenza') q.goal = 'salute';
    return q;
  }

  function buildPlan(profile) {
    const p = normalize(profile);
    const memo = {};
    const warnings = [];
    const chains = {};
    Object.keys(LIB.chains).forEach(function (cid) { chains[cid] = resolve(cid, p, memo); });

    const W = function (t, why, fix, lvl) { warnings.push({ t: t, why: why, fix: fix, lvl: lvl || 'warn' }); };
    const TENDON_WHY = 'Front lever, planche e muscle-up caricano molto gomiti, spalle e tendini, che si adattano più lentamente dei muscoli. Per questo l\'app non li mette mai in giorni consecutivi e mai due nello stesso giorno. È una regola prudente di buona pratica scelta da me, non un risultato di studi su questo programma.';
    if (p.caution)
      W('Hai risposto sì ad almeno una domanda di idoneità. Parlane con il medico prima di iniziare: il piano è in modalità prudente (intensità bassa, nessun salto, nessuna skill avanzata).',
        'Hai risposto "sì" ad almeno una delle domande iniziali. Non significa che tu abbia un problema, ma che prima di allenarti con intensità conviene un parere medico. Le domande sono scritte per questa app e non sono un test clinico validato.',
        'Parla con il tuo medico. Intanto il piano resta prudente: sforzo basso, niente salti, niente skill avanzate. Dopo la visita puoi rifare le domande da "Modifica profilo".');
    const WMAP = { push_h: 'wt_push_h', push_v: 'wt_push_v', pull_h: 'wt_pull_h', squat: 'wt_squat', hinge: 'wt_hinge', lunge: 'wt_lunge' };
    const wOK = function (c) { return p.mode === 'pesi' && chains[c] && chains[c].idx >= 0; };
    if (p.mode === 'pesi') {
      const hasDb = p.eq.indexOf('manubri') >= 0, hasBar = p.eq.indexOf('bilanciere') >= 0;
      if (!hasDb && !hasBar)
        W('Hai scelto il piano con i pesi ma non hai indicato manubri né bilanciere: uso il corpo libero.',
          'Senza carichi esterni non posso costruire un piano a pesi. Panca e rack da soli non bastano.',
          'In "Modifica profilo", passo Attrezzi, aggiungi manubri o bilanciere (anche regolabili) per attivare la modalità pesi.');
      else {
        W('Pesi: come iniziare senza farti male.',
          'Con i carichi esterni l\'errore tipico è partire troppo pesante o con tecnica approssimativa. Gli infortuni da pesi in palestra domestica nascono quasi sempre da qui, o da bilanciere senza supporti di sicurezza.',
          'Primo allenamento: carico che ti lascia 3-4 ripetizioni in riserva. Esegui prima serie leggere di avvicinamento. Aumenta solo quando tutte le serie arrivano in cima alla forbice con tecnica pulita. Con il bilanciere usa sempre rack con barre di sicurezza o un compagno. Mai a cedimento da solo su panca e squat.', 'info');
        if (hasBar && p.eq.indexOf('rack') < 0)
          W('Senza rack con barre di sicurezza escludo squat e panca con il bilanciere, e il military press con il bilanciere.',
            'Se non riesci a chiudere una ripetizione, con un bilanciere sulle spalle o sul petto non hai un modo sicuro di liberarti. Il rack con le barre di sicurezza (o un compagno esperto) è ciò che rende questi esercizi accettabili in casa.',
            'Con manubri e bilanciere resto su stacco rumeno, stacco, rematore e curl. Se ti procuri un rack, aggiungilo in Attrezzi per sbloccare squat, panca e military press.', 'info');
        if (hasDb && p.eq.indexOf('panca') < 0)
          W('Senza panca uso i manubri a terra o in piedi: floor press, rematori a busto inclinato, affondi.',
            'La panca permette panca piana con manubri, rematore con appoggio e squat bulgaro: senza, il petto resta meno stimolato e alcuni esercizi di gamba singola sono sostituiti.',
            'Una panca piana stabile è l\'attrezzo che amplia di più le possibilità. Aggiungila in Attrezzi quando ce l\'hai.', 'info');
        if (p.wexp === 'mai' && p.exp !== 'esperto')
          W('Poiché non hai mai usato i pesi, nel primo mese parto da manubri e carichi leggeri.',
            'Le articolazioni e i tendini si adattano più lentamente dei muscoli. Imparare il gesto con carichi bassi riduce il rischio e rende gli aumenti più rapidi dopo.',
            'Dopo il primo blocco il check di fine blocco può sbloccare il passo successivo. Il bilanciere arriva solo dopo almeno 4-8 settimane con tecnica pulita.', 'info');
      }
    }
    if (chains.pull_v.idx < 0 && chains.pull_h.steps.length && chains.pull_h.steps.every(function (s) { return s.eq.length === 0; }))
      W('Senza sbarra né tavolo robusto la tirata resta limitata: una sbarra da porta o due anelli cambiano molto il risultato.',
        'Trazioni e rematori richiedono un punto fisso a cui appendersi o un tavolo molto robusto. Senza, l\'app può proporre solo tirate leggere a terra, che non allenano la schiena come servirebbe, e le skill di tirata restano bloccate.',
        'Una sbarra da porta costa poco. In alternativa due anelli o cinghie appese a un punto sicuro. Poi aggiungila in "Modifica profilo", passo Attrezzi.');
    p.skills.forEach(function (sk) {
      const c = chains[sk];
      if (c.disabled && !c.unselected) {
        const dz = c.disabled;
        W(LIB.chains[sk].label + ': ' + dz,
          dz + ' Ogni skill richiede una base di forza e articolazioni sane: l\'app non te la propone finché non ci sono, per proteggere gomiti e spalle.',
          /limitazion/.test(dz) ? 'Se la limitazione è passata, toglila da "Modifica profilo". Altrimenti scegli un\'altra skill.'
            : /Prerequisito/.test(dz) ? 'Allena la base nel piano (trazioni, push-up). Quando avanzi di livello con il check di fine blocco, la skill si sblocca da sola.'
            : /prudente|sedentario|Le skill/.test(dz) ? 'Completa la fase di base: le skill si sbloccano dopo, con un nuovo piano.'
            : 'Controlla attrezzi e livello in "Modifica profilo".');
      }
    });

    if (p.minutes < 30 && activeSkillsPre(p, chains))
      W('Con meno di 30 minuti a sessione le skill avanzate restano fuori: servono riscaldamento specifico e pause lunghe.',
        'Una skill richiede energia fresca, un riscaldamento specifico e pause da 75 secondi o più tra i tentativi. In meno di 30 minuti non c\'è spazio per farle bene insieme alla forza.',
        'Porta il tempo a 30 minuti o più in "Modifica profilo", oppure tieni questo piano come fase di forza di base.');
    const n = p.days.length;
    if (p.focus === 'corsa' && n === 0) {
      const ew = [];
      for (let w = 0; w < p.weeks; w++) ew.push({ w: w, block: Math.floor(w / 4), wb: w % 4, phase: PHASES[w % 4], deload: w % 4 === 3, provisional: false, sessions: [] });
      return { profile: p, warnings: warnings, expect: [], rir: rirText(p), chains: [], sessions: [], weeks: ew, meta: { n: 0, minutes: p.minutes, goal: p.goal, exp: p.exp, caution: !!p.caution, capLv: capLv(p) } };
    }
    const kinds = p.focus === 'corsa' ? RUNKINDS[n] : (KINDS[n] || KINDS[3]);
    const activeSkills = p.skills.filter(function (sk) { return chains[sk] && chains[sk].idx >= 0; });
    const freqs = {}, reduced = [];
    let sched;
    for (;;) {
      sched = scheduleSkills(p.days, activeSkills, freqs);
      const lost = sched.dropped.filter(function (d) { return !d.partial; }).map(function (d) { return d.skill; });
      if (!lost.length) break;
      const cand = activeSkills.filter(function (sk) {
        return lost.indexOf(sk) < 0 && TENDON_SKILLS.indexOf(sk) >= 0 && (freqs[sk] || SKILL_FREQ[sk] || 1) > 1;
      });
      if (!cand.length) break;
      freqs[cand[0]] = 1; reduced.push({ skill: cand[0], for: lost });
    }
    reduced.forEach(function (r) {
      W(LIB.chains[r.skill].label + ': con i tuoi giorni la porto a una volta a settimana per far entrare ' + r.for.map(function (x) { return LIB.chains[x].label; }).join(' e ') + '.',
        'Con i giorni scelti hai pochi posti per le skill che caricano i tendini. ' + TENDON_WHY + ' Tenere due skill a una volta a settimana è meglio che farne una sola a due volte, ma i progressi su ciascuna saranno più lenti.',
        'Per tenere entrambe a due volte a settimana servono giorni più distanziati, ad esempio lunedì, martedì, giovedì e sabato. Puoi cambiarli in "Modifica profilo".', 'info');
    });
    sched.dropped.forEach(function (d) {
      W(LIB.chains[d.skill].label + (d.partial
        ? ': con i giorni scelti riesco a inserirla solo ' + d.freq + ' volta a settimana.'
        : ': non trovo un giorno compatibile con le altre skill, per questo l\'ho lasciata fuori.'),
        'Con i giorni scelti non c\'è posto sufficiente. ' + TENDON_WHY,
        'Cambia i giorni (servono giorni non consecutivi) oppure togli una delle skill in "Modifica profilo".');
    });

    const m = p.minutes;
    const warmMin = m < 20 ? 3 : Math.max(4, Math.min(8, Math.round(m * 0.12)));
    const coolMin = m < 20 ? 2 : Math.max(3, Math.min(5, Math.round(m * 0.06)));
    const hasBar = p.eq.indexOf('sbarra') >= 0;

    const sessions = [];
    const pullVDays = {};
    p.days.forEach(function (wd, di) {
      const kind = kinds[di];
      const skillsToday = (m >= 30 ? sched.plan[di] : []);
      const hasSkill = skillsToday.length > 0;
      const skillMin = hasSkill ? Math.max(6, Math.min(12, Math.round(m * 0.22))) : 0;

      let condMin = 0;
      if (m >= 25 && p.focus !== 'corsa') {
        const rem = m - warmMin - coolMin - skillMin;
        if (p.goal === 'resistenza') condMin = Math.round(rem * 0.3);
        else if (p.goal === 'salute') condMin = Math.max(5, Math.round(rem * 0.2));
        else if (kind === 'COND_CORE') condMin = Math.round(rem * 0.4);
      }
      if (kind === 'COND_CORE' && condMin === 0 && m >= 20) condMin = Math.round((m - warmMin - coolMin) * 0.3);
      const strengthBudget = m - warmMin - coolMin - skillMin - condMin;

      // skill
      const skillBlock = [];
      skillsToday.forEach(function (sk) {
        const r = chains[sk], ex = current(r);
        const allot = skillMin / skillsToday.length;
        const rest = restFor(p, ex, true);
        const maxSets = p.exp === 'esperto' ? 5 : p.exp === 'attivo' ? 4 : 3;
        let sets = maxSets;
        while (sets > 1 && worstMin(ex, p, true, sets) > allot) sets--;
        skillBlock.push({ chain: sk, exId: ex.id, sets: sets });
      });

      // forza
      const used = {};
      const strength = [];
      let acc = 0;
      const slots = SLOTS[kind];
      for (let s = 0; s < slots.length; s++) {
        let cand = slots[s];
        let cid = null;
        if (cand === 'PULL') {
          const vOK = chains.pull_v.idx >= 0;
          const adjV = p.days.some(function (od) { return adjacent(od, wd) && pullVDays[od]; });
          if (wOK('wt_pull_h')) cid = (vOK && !adjV && !used.pull_v && di % 2 === 1) ? 'pull_v' : 'wt_pull_h';
          else cid = (vOK && !adjV && !used.pull_v) ? 'pull_v' : 'pull_h';
          if (used[cid]) cid = null;
        } else {
          const list = Array.isArray(cand) ? cand : [cand];
          for (let k = 0; k < list.length; k++) {
            let c = list[k];
            if (WMAP[c] && wOK(WMAP[c])) c = WMAP[c];
            if (!used[c] && chains[c] && chains[c].idx >= 0) { cid = c; break; }
          }
        }
        if (!cid || used[cid] || chains[cid].idx < 0) continue;
        const ex = current(chains[cid]);
        const t = worstMin(ex, p, false, null);
        if (strength.length >= 1 && acc + t > strengthBudget) continue;
        strength.push({ chain: cid, exId: ex.id });
        used[cid] = true; acc += t;
        if (cid === 'pull_v') pullVDays[wd] = true;
      }
      if (p.mode === 'pesi' && p.goal === 'massa') {
        const accC = (kind === 'UPPER_1' || kind === 'FULL_A') ? 'wt_biceps' : (kind === 'UPPER_2' || kind === 'FULL_B' || kind === 'FULL_C') ? 'wt_triceps' : null;
        if (accC && wOK(accC) && !used[accC]) {
          const aex = current(chains[accC]), at = worstMin(aex, p, false, null);
          if (acc + at <= strengthBudget) { strength.push({ chain: accC, exId: aex.id }); used[accC] = true; acc += at; }
        }
      }
      if (!strength.length) {
        ['hinge', 'core_ext', 'core_post', 'pull_h'].some(function (c) {
          if (chains[c] && chains[c].idx >= 0) { strength.push({ chain: c, exId: current(chains[c]).id }); return true; }
          return false;
        });
      }
      // core in fondo
      const isCore = function (x) { return LIB.chains[x.chain].group === 'core'; };
      strength.sort(function (a, b) { return (isCore(a) ? 1 : 0) - (isCore(b) ? 1 : 0); });

      // condizionamento
      let cond = null;
      if (condMin > 0) cond = buildCond(p, chains, condMin);

      const ctx = {
        upper: strength.some(function (x) { return ['push_h', 'push_v', 'dip', 'pull_h', 'pull_v', 'wt_push_h', 'wt_push_v', 'wt_pull_h', 'wt_biceps', 'wt_triceps'].indexOf(x.chain) >= 0; }),
        lower: strength.some(function (x) { return ['squat', 'lunge', 'hinge', 'calf', 'wt_squat', 'wt_lunge', 'wt_hinge'].indexOf(x.chain) >= 0; }),
        push: strength.some(function (x) { return ['push_h', 'push_v', 'dip', 'wt_push_h', 'wt_push_v'].indexOf(x.chain) >= 0; }) || skillsToday.indexOf('sk_hs') >= 0 || skillsToday.indexOf('sk_pl') >= 0,
        pull: strength.some(function (x) { return x.chain === 'pull_v'; }) || skillsToday.some(function (s) { return s === 'sk_fl' || s === 'sk_mu'; }),
      };
      const all = strength.concat(skillBlock);
      ctx.wrist = all.some(function (x) { return BY[x.exId].flags.indexOf('polsi') >= 0; });
      ctx.grip = ctx.pull;
      ctx.wt = strength.some(function (x) { return x.chain.indexOf('wt_') === 0; });
      ctx.bar = strength.some(function (x) { return BY[x.exId].w && BY[x.exId].w.ld === 'bar'; });

      sessions.push({
        d: di, weekday: wd, dayName: DAYS[wd], kind: kind, label: KIND_LABEL[kind],
        warm: { min: warmMin, items: warmup(warmMin, ctx, p, hasBar) },
        skills: skillBlock, strength: strength, cond: cond,
        cool: { min: coolMin, items: cooldown(ctx) },
        skillMin: skillMin, condMin: condMin,
      });
    });

    // settimane
    const weeks = [];
    for (let w = 0; w < p.weeks; w++) {
      const b = Math.floor(w / 4), wb = w % 4;
      const wk = { w: w, block: b, wb: wb, phase: (b >= 1 && wb === 0) ? 'Ripresa' : PHASES[wb], deload: wb === 3, provisional: b > p.checked, sessions: [] };
      sessions.forEach(function (s) {
        const ws = {
          d: s.d, weekday: s.weekday, dayName: s.dayName, kind: s.kind, label: s.label,
          warm: s.warm, cool: s.cool, skills: [], strength: [], cond: null,
        };
        s.skills.forEach(function (x) {
          const ex = BY[x.exId], r = chains[x.chain];
          const pr = prescribe(ex, p, w, { skill: true, sets: x.sets });
          ws.skills.push(entry(ex, pr, nextStep(r), p, x.chain));
        });
        s.strength.forEach(function (x) {
          const ex = BY[x.exId], r = chains[x.chain];
          const pr = prescribe(ex, p, w);
          ws.strength.push(entry(ex, pr, nextStep(r), p, x.chain));
        });
        if (s.cond) ws.cond = condForWeek(s.cond, wk, p);
        // stima durata
        let est = s.warm.min + s.cool.min;
        ws.skills.forEach(function (e) { est += e.sets * (workSec(BY[e.exId], e.target) + e.rest) / 60; });
        ws.strength.forEach(function (e) { est += e.sets * (workSec(BY[e.exId], e.target) + e.rest) / 60; });
        if (ws.cond) est += ws.cond.min;
        const tm = function (e) { return e.sets * (workSec(BY[e.exId], e.target) + e.rest) / 60; };
        const pool = ws.strength.concat(ws.skills);
        while (est > m * 1.05 && pool.some(function (e) { return e.sets > 1; })) {
          pool.sort(function (a, b) { return tm(b) - tm(a); });
          const big = pool.filter(function (e) { return e.sets > 1; })[0];
          est -= (big.sets * (workSec(BY[big.exId], big.target) + big.rest) - (big.sets - 1) * (workSec(BY[big.exId], big.target) + big.rest)) / 60;
          big.sets -= 1;
        }
        ws.estMin = Math.round(est);
        wk.sessions.push(ws);
      });
      weeks.push(wk);
    }

    // cosa aspettarsi: stime prudenti, non promesse
    const blocks = Math.ceil(p.weeks / 4);
    const expect = [];
    function proj(cid, isSkill, freq) {
      const r = chains[cid];
      if (!r || r.idx < 0) return;
      const rate = isSkill ? (freq >= 2 ? 0.5 : 0.25) : 1;
      const gain = Math.floor(blocks * rate);
      const to = Math.min(r.steps.length - 1, r.idx + gain);
      const full = CH[cid][CH[cid].length - 1];
      expect.push({ chain: cid, label: LIB.chains[cid].label, skill: isSkill, from: r.steps[r.idx].name, to: r.steps[to].name,
        steps: to - r.idx, goal: full.name, reachesGoal: r.steps[to].id === full.id,
        capped: !isSkill && to === r.steps.length - 1 && CH[cid].length > r.steps.length });
    }
    ['push_h', chains.pull_v.idx >= 0 ? 'pull_v' : 'pull_h', 'squat', 'lunge'].forEach(function (c) { proj(WMAP[c] && wOK(WMAP[c]) ? WMAP[c] : c, false); });
    activeSkills.forEach(function (sk) {
      const days = sessions.filter(function (s) { return s.skills.some(function (x) { return x.chain === sk; }); }).length;
      if (days > 0) proj(sk, true, days);
    });
    expect.filter(function (e) { return e.skill && !e.reachesGoal; }).forEach(function (e) {
      W(e.label + ': in ' + p.weeks + ' settimane il traguardo realistico è «' + e.to + '», non «' + e.goal + '».',
        'Ogni gradino di una skill richiede in media molte settimane e la forza dei tendini cresce più lentamente di quella dei muscoli. Le mie stime (un gradino ogni 8 settimane con due sedute a settimana, uno ogni 16 con una seduta) sono prudenti e non sono una promessa: contano recupero, sonno, peso corporeo e costanza. Il piano non può saltare i gradini intermedi.',
        'Considera questo piano come la prima tappa. Alla fine rifai il profilo con i risultati nuovi e prosegui. Con 12 settimane e due sedute a settimana per la skill avanzi più in fretta.', 'info');
    });

    return {
      profile: p, warnings: warnings, expect: expect, rir: rirText(p),
      chains: summarizeChains(chains), sessions: sessions, weeks: weeks,
      meta: { n: n, minutes: m, goal: p.goal, exp: p.exp, caution: !!p.caution, capLv: capLv(p) },
    };
  }

  function activeSkillsPre(p, chains) {
    return p.skills.some(function (sk) { return chains[sk] && chains[sk].idx >= 0; });
  }

  function entry(ex, pr, next, p, chain) {
    const e = {
      exId: ex.id, chain: chain, sets: pr.sets, target: pr.target, rest: pr.rest,
      kind: ex.kind, per: ex.per, graduate: graduateText(ex, p, Math.max(2, Math.min(3, baseSets(p, 0)))),
      next: next ? { exId: next.id, name: next.name } : null,

    if (ex.w) {

      e.graduate = graduateW(ex, pr);
      e.loadTip = 'Scegli un carico con cui chiudi tutte le serie lasciando ' + (p.caution || p.exp === 'sedentario' || p.wexp === 'mai' ? '3-4 ripetizioni di riserva' : '2 ripetizioni di riserva') +
        '. Quando le serie arrivano tutte a ' + pr.range[1] + ' ripetizioni con tecnica pulita, la volta dopo aggiungi ' + ex.w.inc + ' kg.';
    }
    return e;
  }

  function summarizeChains(chains) {
    const out = {};
    Object.keys(chains).forEach(function (c) {
      const r = chains[c];

                 steps: r.steps.map(function (s) { return s.id; }),

    return out;
  }

  /* ---------------------------------------------------------- condizionamento */
  function buildCond(p, chains, minutes) {
    const gentle = p.caution || p.exp === 'sedentario' || p.exp === 'ripartenza';
    const order = ['cond', 'squat', 'push_h', 'cond'];
    const items = [];
    const usedIds = {};
    order.forEach(function (cid, i) {
      const r = chains[cid];
      if (!r || r.idx < 0) return;
      let idx = r.idx;
      if (cid === 'push_h') idx = Math.max(0, r.idx - 1);
      if (cid === 'cond' && i === 3) idx = Math.max(0, r.idx - 1);
      let ex = r.steps[idx];
      if (usedIds[ex.id] && idx > 0) ex = r.steps[idx - 1];
      if (usedIds[ex.id]) return;
      usedIds[ex.id] = true;
      items.push(ex.id);
    });
    if (items.length < 3) {
      const r = chains.core_ext;
      if (r && r.idx >= 0) items.push(r.steps[Math.max(0, r.idx - 1)].id);
    }
    return { format: gentle ? 'intervalli' : 'amrap', min: minutes, items: items };

  function condForWeek(c, wk, p) {
    const out = { format: c.format, min: c.min, items: [] };
    const scale = wk.deload ? 0.5 : 1;
    if (c.format === 'intervalli') {
      const work = 30, rest = wk.deload ? 45 : 30;
      const per = (work + rest) * c.items.length / 60;
      out.work = work; out.rest = rest;
      out.rounds = Math.max(1, Math.floor((c.min * (wk.deload ? 0.6 : 1)) / per));
      c.items.forEach(function (id) { out.items.push({ exId: id, secs: work }); });
      out.min = Math.round(out.rounds * per);
    } else {
      out.min = wk.deload ? Math.max(3, Math.round(c.min * 0.6)) : c.min;
      c.items.forEach(function (id) {
        const ex = BY[id];
        const f = frac(p.goal, wk.wb, wk.block);
        if (ex.kind === 'time') out.items.push({ exId: id, secs: Math.max(15, Math.round((ex.lo + (ex.hi - ex.lo) * f * 0.5) / 2)) });
        else out.items.push({ exId: id, reps: Math.max(4, Math.round((ex.lo + (ex.hi - ex.lo) * f * 0.5) * scale)) });
      });
    }
    return out;
  }

  /* ---------------------------------------------------------- scala di progressione (UI) */
  function ladder(cid, profile) {
    const p = normalize(profile);
    const memo = {}, r = resolve(cid, p, memo), isSkill = LIB.chains[cid].group === 'skill';
    return {
      chain: cid, label: LIB.chains[cid].label, disabled: r.disabled, idx: r.idx,
      steps: CH[cid].map(function (e) {
        const br = blockReason(e, p, isSkill);
        return { id: e.id, name: e.name, lv: e.lv, blocked: br ? br.type : null,
                 detail: br ? br.detail : null,
                 current: r.idx >= 0 && r.steps[r.idx].id === e.id };
      }),
    };
  }

  /* ---------------------------------------------------------- circuito rapido */
  const AREAS = {
    full: ['push_h', 'squat', 'PULL', 'hinge', 'core_ext', 'cond'],
    upper: ['push_h', 'PULL', 'push_v', 'dip', 'core_ext', 'pull_h'],
    lower: ['squat', 'lunge', 'hinge', 'cond', 'core_lat', 'squat'],
    core: ['core_ext', 'core_flex', 'core_lat', 'core_post', 'core_ext'],
    cardio: ['cond', 'squat', 'push_h', 'cond', 'hinge'],
  };
  function shuffle(a, rng) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  const CGOALS = {
    resistenza: {
      label: 'Resistenza',
      what: 'Allena la capacità di sostenere uno sforzo medio a lungo: ripetizioni moderate, quasi senza pause.',
      how: 'Fai i giri più bravo possibile nel tempo dato (AMRAP), senza fermarti ma senza sacrificare la tecnica. Riprova lo stesso circuito più avanti: più giri a parità di tecnica significa che sei migliorato.',
      gentle: 'Per chi riparte o è sedentario non uso l\'AMRAP: parte come lavoro a intervalli 30/30, più facile da dosare.',
    },
    cardio: {
      label: 'Cardio',
      what: 'Alza il battito con movimenti ampi e alterna lavoro e pausa breve.',
      how: 'Lavora a ritmo sostenuto per il tempo indicato e riposa nei secondi di pausa. Se non riesci a parlare a frasi brevi durante il lavoro, rallenta.',
      gentle: 'Per chi riparte uso 30 secondi di lavoro e 30 di pausa, più facili da gestire.',
    },
    forza: {
      label: 'Forza',
      what: 'Pochi esercizi impegnativi, ripetizioni basse e recuperi lunghi: serve a spingere il livello di forza, non il fiato.',
      how: 'Fai le ripetizioni indicate con tecnica pulita, tocca "Fatto" e riposa. I giri sono pochi, ma ogni serie conta: se la tecnica crolla, fermati.',
      gentle: 'Per chi riparte il circuito usa gli esercizi del tuo livello attuale con recuperi più lunghi.',
    },
  };
  function isGentle(p) { return p.caution || p.exp === 'sedentario' || p.exp === 'ripartenza'; }
  function circuitAdvice(profile, opts) {
    const p = normalize(profile);
    const g = CGOALS[opts.goal] ? opts.goal : 'resistenza';
    const minutes = opts.minutes || 10, gentle = isGentle(p);
    let format, work = 0, rest = 0, recN, rounds;
    if (g === 'forza') {
      format = 'forza'; recN = minutes <= 10 ? 3 : 4; rounds = 2;
    } else if (g === 'resistenza' && !gentle) {
      format = 'amrap'; recN = Math.max(3, Math.min(6, Math.round(minutes * 0.4)));
      rounds = Math.max(1, Math.round(minutes * 60 / (recN * 45)));
    } else {
      format = 'intervalli';
      work = (g === 'cardio' && !gentle) ? 40 : 30; rest = (g === 'cardio' && !gentle) ? 20 : 30;
      recN = Math.max(3, Math.min(6, Math.round(minutes / 3.5)));
      rounds = Math.max(1, Math.floor(minutes * 60 / (recN * (work + rest))));
    }
    const n = Math.max(3, Math.min(6, opts.n || recN));
    // giri stimati per il numero scelto
    let r;
    if (format === 'forza') r = Math.max(1, Math.min(5, Math.floor(minutes * 60 / (n * 85 + 45))));
    else if (format === 'amrap') r = Math.max(1, Math.round(minutes * 60 / (n * 45)));
    else r = Math.max(1, Math.floor(minutes * 60 / (n * (work + rest))));
    const restEx = minutes < 10 ? 30 : 45, restRound = minutes < 10 ? 60 : 90;
    if (format === 'forza') r = Math.max(1, Math.min(5, Math.floor(minutes * 60 / (n * (40 + restEx) + (restRound - restEx)))));
    let why;
    if (format === 'amrap') why = 'In ' + minutes + ' minuti con ' + n + ' esercizi fai circa ' + r + ' giri. ' + (r >= 3 ? 'È abbastanza per sentire l\'effetto della ripetizione senza far crollare la tecnica.' : 'Sono pochi giri: il circuito diventa una lista di esercizi e non un lavoro continuo. Meglio meno esercizi.') + ' Meno esercizi significa più giri sugli stessi muscoli; più esercizi significa più varietà ma meno giri e più tempo perso nei passaggi.';
    else if (format === 'intervalli') why = 'Con ' + n + ' esercizi da ' + work + ' secondi e ' + rest + ' di pausa un giro dura circa ' + Math.round(n * (work + rest) / 60 * 10) / 10 + ' minuti: in ' + minutes + ' minuti fai circa ' + r + ' giri. Servono almeno 3 giri perché il lavoro a intervalli abbia effetto.';
    else why = 'Per la forza servono pochi esercizi difficili ripetuti più volte. Con ' + n + ' esercizi fai circa ' + r + ' giri: ogni movimento riceve abbastanza serie per essere uno stimolo vero, e il recupero tra i giri è lungo.';
    return { goal: g, format: format, work: work, rest: rest, restEx: restEx, restRound: restRound, recN: recN, n: n, est: r, why: why,
             what: CGOALS[g].what, how: CGOALS[g].how, gentleNote: (gentle && g !== 'forza') ? CGOALS[g].gentle : '', label: CGOALS[g].label };
  }
  function quickCircuit(profile, opts, rng) {
    rng = rng || Math.random;
    const p = normalize(profile);
    const memo = {}, chains = {};
    Object.keys(LIB.chains).forEach(function (c) { chains[c] = resolve(c, p, memo); });
    const adv = circuitAdvice(profile, opts);
    const area = AREAS[opts.area] ? opts.area : 'full';
    const n = adv.n, drop = adv.format === 'forza' ? 0 : 1;
    let list = (adv.goal === 'cardio' && area === 'full') ? AREAS.cardio : AREAS[area];
    if (adv.goal === 'forza') list = list.filter(function (c) { return c !== 'cond'; });
    const order = shuffle(list, rng);
    const items = [], used = {};
    for (let i = 0; i < order.length * 3 && items.length < n; i++) {
      let cid = order[i % order.length];
      if (cid === 'PULL') cid = (chains.pull_v.idx >= 0 && rng() < 0.5) ? 'pull_v' : 'pull_h';
      const r = chains[cid];
      if (!r || r.idx < 0) continue;
      let k = Math.max(0, r.idx - drop);
      while (used[r.steps[k].id] && k > 0) k--;
      const ex = r.steps[k];
      if (used[ex.id]) continue;
      used[ex.id] = true; items.push(ex.id);
    }
    const res = { mode: adv.format, format: adv.format, goal: adv.goal, area: area, minutes: opts.minutes || 10, n: items.length, rounds: adv.est, work: adv.work, rest: adv.rest, restEx: adv.restEx, restRound: adv.restRound, items: [], advice: adv };
    items.forEach(function (id) {
      const ex = BY[id];
      if (adv.format === 'intervalli') res.items.push({ exId: id, secs: adv.work });
      else if (adv.format === 'amrap') res.items.push(ex.kind === 'time' ? { exId: id, secs: Math.max(20, Math.round((ex.lo + ex.hi) / 2 * 0.7)) } : { exId: id, reps: Math.max(4, Math.round(ex.lo + (ex.hi - ex.lo) * 0.25)) });
      else res.items.push(ex.kind === 'time' ? { exId: id, secs: Math.round(ex.lo + (ex.hi - ex.lo) * 0.5), manual: true } : { exId: id, reps: Math.round(ex.lo + (ex.hi - ex.lo) * 0.4), manual: true });
    });
    return res;
  }
  function circuitTimeline(c) {
    const ph = [{ type: 'prep', secs: 10, label: 'Preparati' }];
    if (c.format === 'amrap') { ph.push({ type: 'amrap', secs: c.minutes * 60, label: 'AMRAP' }); return ph; }
    const n = c.items.length;
    for (let r = 0; r < c.rounds; r++) {
      c.items.forEach(function (it, i) {
        ph.push({ type: 'work', ex: it.exId, round: r + 1, idx: i + 1, secs: c.format === 'intervalli' ? c.work : 0, manual: c.format === 'forza', reps: it.reps || 0, label: 'Lavoro' });
        const last = r === c.rounds - 1 && i === n - 1;
        if (!last) ph.push({ type: 'rest', secs: c.format === 'intervalli' ? c.rest : (i === n - 1 ? c.restRound : c.restEx), next: i === n - 1 ? c.items[0].exId : c.items[i + 1].exId, label: 'Pausa' });
      });
    }
    return ph;
  }

  /* ---------------------------------------------------------- come inserire un circuito nel piano */
  function sessLoad(s) {
    if (!s) return { up: false, low: false, tendon: false };
    const k = s.kind;
    return { up: /UPPER|FULL/.test(k), low: /LOWER|FULL/.test(k) && k !== 'FULL_LIGHT' || k === 'FULL_LIGHT',
             tendon: s.skills.some(function (x) { return TENDON_SKILLS.indexOf(x.chain) >= 0; }) };
  }
  function circuitFit(plan, ctx, opts) {
    const p = plan.profile, gentle = isGentle(p);
    const wk = plan.weeks[Math.max(0, Math.min(ctx.week || 0, plan.weeks.length - 1))];
    const byDay = {};
    wk.sessions.forEach(function (s) { byDay[s.weekday] = s; });
    const limit = gentle ? 1 : 2, recent = ctx.recent || 0;
    const out = { situation: ctx.sit, status: 'ok', headline: '', why: '', rec: null, maxMin: 10, cautions: [], limit: limit };
    const sit = ctx.sit;
    const today = byDay[ctx.weekday];
    if (sit === 'dopo') {
      out.maxMin = gentle ? 8 : 10;
      if (!today) { out.status = 'no'; out.headline = 'Oggi nel piano non hai nessuna seduta.'; out.why = 'Un circuito "dopo la seduta" ha senso solo se oggi ti alleni col piano. Se oggi è libero, scegli "Giorno libero".'; }
      else if (wk.deload) { out.status = 'no'; out.headline = 'Questa è la settimana di scarico: non aggiungere nulla.'; out.why = 'Lo scarico serve a recuperare e a consolidare il blocco. Un circuito extra toglie proprio quel recupero.'; }
      else if (today.kind === 'COND_CORE') { out.status = 'no'; out.headline = 'La seduta di oggi è già di condizionamento.'; out.why = 'Aggiungerne un altro vuol dire duplicare lo stesso lavoro senza un motivo.'; }
      else if (recent >= limit) { out.status = 'no'; out.headline = 'Hai già fatto ' + recent + (recent === 1 ? ' circuito' : ' circuiti') + ' extra negli ultimi 7 giorni.'; out.why = 'Per il tuo livello il massimo consigliato è ' + limit + ' a settimana: oltre, il rischio è accumulare fatica senza progredire.'; }
      else {
        const L = sessLoad(today), area = today.kind.indexOf('UPPER') === 0 ? 'lower' : today.kind.indexOf('LOWER') === 0 ? 'core' : 'core';
        out.rec = { area: area, goal: gentle ? 'cardio' : 'resistenza', minutes: gentle ? 8 : 10 };
        out.headline = 'Dopo la seduta di oggi (' + today.label + '): circuito corto, zona diversa.';
        out.why = 'Aggiunto in fondo alla seduta, un circuito di ' + out.rec.minutes + ' minuti lavora su muscoli che non hai già stancato' + (L.tendon ? ' e non tocca spalle e tendini, già carichi per le skill di oggi' : '') + '. Meglio brevi: dopo una seduta completa la tecnica cala presto.';
      }
    } else if (sit === 'libero') {
      out.maxMin = (gentle || wk.deload) ? 10 : 15;
      const wd = ctx.weekday, prev = byDay[(wd + 6) % 7], next = byDay[(wd + 1) % 7];
      if (today) { out.status = 'no'; out.headline = 'Oggi hai una seduta del piano.'; out.why = 'Per oggi scegli "Dopo la seduta" oppure "Al posto di una seduta". Un giorno libero è un giorno senza seduta.'; }
      else if (recent >= limit) { out.status = 'no'; out.headline = 'Hai già fatto ' + recent + (recent === 1 ? ' circuito' : ' circuiti') + ' extra negli ultimi 7 giorni.'; out.why = 'Per il tuo livello il massimo consigliato è ' + limit + ' a settimana.'; }
      else {
        const a = sessLoad(prev), b = sessLoad(next);
        const upLoaded = a.up || b.up, lowLoaded = a.low || b.low, tendon = a.tendon || b.tendon;
        let area = null;

        if (!area) { out.status = 'rest'; out.headline = 'Oggi è meglio riposare.'; out.why = 'Il giorno prima o dopo il piano ti allena già le stesse zone' + (tendon ? ' e carica i tendini con le skill' : '') + '. Il riposo è una parte dell\'allenamento: puoi fare una camminata di 20-30 minuti. Se vuoi un circuito, scegli un altro giorno libero.'; }

    '5k':     { label: '5 km', km: 5, peakL: 7, floorV: 14, taper: [0.6], minRuns: 2 },
    '10k':    { label: '10 km', km: 10, peakL: 12, floorV: 22, taper: [0.6], minRuns: 2 },
    half:     { label: 'Mezza maratona', km: 21.1, peakL: 18, floorV: 32, taper: [0.7, 0.5], minRuns: 3 },
    marathon: { label: 'Maratona', km: 42.2, peakL: 32, floorV: 46, taper: [0.8, 0.6, 0.4], minRuns: 3 },
    trail:    { label: 'Gara trail', taper: [0.75, 0.5], minRuns: 3 },
  };
  const SHARE = { 2: 0.7, 3: 0.62, 4: 0.56, 5: 0.5 };
  const G_MAX = 0.07, G_COMFORT = 0.045;
  const MILES = [5, 8, 10, 15, 21, 30, 35, 42];
  const AVVIO_END = 8; // indice di RSTAGES: 25 minuti di corsa continua

  const GEVID = [
    { id: 'tenpct', lvl: 'Probabile', t: 'La regola del «10% a settimana» non è dimostrata.',
      why: 'In uno studio randomizzato su principianti, un programma graduale (aumenti al massimo del 10% a settimana, 13 settimane) non ha ridotto gli infortuni rispetto a un programma standard di 8 settimane. È un solo studio, su una gara breve: non dimostra che ogni aumento sia sicuro. L\'app usa comunque aumenti piccoli (al massimo circa il 7% a settimana nei suoi calcoli) come scelta prudente.',
      src: 'Buist e coll., Am J Sports Med 2008', url: 'https://bjsm.bmj.com/content/43/2/155' },
    { id: 'jump', lvl: 'Prassi', t: 'Salti improvvisi di volume sono associati a più infortuni, ma l\'evidenza è molto limitata.',
      why: 'Una revisione sistematica ha trovato solo 4 studi, soprattutto su principianti e amatori. Chi aumentava la distanza settimanale di oltre il 30% aveva un rischio più alto (HR 1,59), ma il risultato non è statisticamente significativo. Per questo il piano evita i salti, senza promettere che basti a evitare gli infortuni.',
      src: 'Damsted e coll., IJSPT 2019 (sintesi RUNSAFE)', url: 'https://runsafe.au.dk/display/artikel/limited-evidence-on-changes-in-training-load-and-running-related-injury' },
    { id: 'base30', lvl: 'Probabile', t: 'Prima di una maratona conviene avere una base di almeno 30 km a settimana.',
      why: 'In uno studio su 662 maratoneti, chi correva meno di 30 km a settimana aveva un rischio di infortunio circa doppio (RR 2,0) rispetto a chi ne correva 30-60. È uno studio osservazionale e retrospettivo (dati dichiarati dai corridori): indica un\'associazione, non una causa.',
      src: 'Int J Sports Phys Ther 2013', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC3625790' },
    { id: 'strength', lvl: 'Probabile', t: 'La forza con carichi alti migliora un po\' l\'economia di corsa.',
      why: 'Una metanalisi mostra un miglioramento piccolo ma misurabile (g -0,32): l\'effetto è emerso con carichi di almeno il 90% del massimale e programmi di 10-14 settimane. Per questo il piano include forza per le gambe, ma i carichi pesanti li usa solo se scegli i pesi e hai già esperienza.',
      src: 'Eihara e coll., Sports Med Open 2022', url: 'https://sportsmedicine-open.springeropen.com/articles/10.1186/s40798-022-00511-1' },
    { id: 'taper', lvl: 'Probabile', t: 'Prima della gara si riduce il volume, non l\'intensità né la frequenza.',
      why: 'Una metanalisi sul tapering negli sport di resistenza indica una riduzione progressiva del volume del 41-60%, mantenendo intensità e frequenza. L\'effetto maggiore c\'è con 8-14 giorni; anche 21 giorni o più sono efficaci. Il piano usa 1-3 settimane a seconda della gara.',
      src: 'Wang e coll., PLOS ONE 2023', url: 'https://www.fisiologiadelejercicio.com/wp-content/uploads/2023/05/Effects-of-tapering-on-performance-in-endurance-athletes.pdf' },
    { id: 'tid', lvl: 'Certo', t: 'Non esiste una distribuzione dell\'intensità dimostrata come migliore.',
      why: 'Una metanalisi di rete su dati individuali non ha trovato un modello (polarizzato, piramidale, a soglia) chiaramente superiore; tra gli amatori c\'è solo una tendenza non significativa a favore del piramidale. Il piano tiene la maggior parte della corsa facile e inserisce al massimo una seduta di qualità a settimana: è una scelta prudente, non un risultato dimostrato.',
      src: 'Rosenblat e coll., Sports Med 2025', url: 'https://doi.org/10.1007/s40279-024-02149-3' },
    { id: 'downhill', lvl: 'Probabile', t: 'La discesa danneggia i muscoli: va introdotta gradualmente.',
      why: 'La corsa in discesa, per la sua natura eccentrica, causa danno muscolare con dolore che raggiunge il picco dopo 24-48 ore. Una sessione precedente protegge le successive, ma la protezione svanisce nel tempo (in uno studio dopo 9 settimane senza stimoli simili). La revisione raccomanda una progressione graduale.',
      src: 'Bontemps e coll., Sports Med 2020', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7674385/' },
    { id: 'medical', lvl: 'Certo', t: 'La visita medica serve se hai malattie note o sintomi.',
      why: 'Secondo l\'ACSM la visita prima di iniziare o di aumentare l\'intensità è raccomandata a chi ha una malattia cardiovascolare, metabolica o renale nota o sintomi (dolore al petto, fiato corto anomalo, palpitazioni, vertigini). Chi non ha malattie né sintomi può iniziare con intensità da leggera a moderata e aumentare gradualmente.',
      src: 'ACSM, scheda per il pubblico', url: 'https://acsm.org/docs/default-source/files-for-resource-library/cpi-who-needs-a-stress-test-before-exercising-brochure.pdf' },
    { id: 'convention', lvl: 'Prassi', t: 'Alcune regole sono convenzioni degli allenatori, non risultati di studi.',
      why: 'Sono convenzioni: settimana di scarico ogni quarta, lungo di picco (32 km per la maratona, 18 per la mezza), peso massimo del lungo sul volume settimanale, scala di sforzo da 1 a 10, «chilometro-sforzo» per il trail (km + dislivello positivo / 100). Funzionano in pratica per molti, ma non sono validate in modo sperimentale: sono qui perché servono a costruire un piano, e lo dichiaro.',
      src: '', url: '' },
  ];

  function gShare(n) { return SHARE[Math.max(2, Math.min(5, n))]; }
  function goalSpec(p) {
    const t = p.rtype, T = GT[t];
    const dens = t === 'trail' ? p.rdplus / p.rtrailKm : 0;
    let peakL, peakV, label, raceKm = null;
    if (t === 'grow') {
      peakL = Math.max(8, p.rtarget * 0.9); label = 'Arrivare a ' + Math.round(p.rtarget) + ' km di corsa continua';
    } else if (t === 'trail') {
      const E = p.rtrailKm + p.rdplus / 100;
      raceKm = p.rtrailKm;
      peakL = Math.max(10, Math.min(38, E * 0.7));
      label = 'Trail di ' + Math.round(p.rtrailKm) + ' km' + (p.rdplus ? ' con ' + Math.round(p.rdplus) + ' m di dislivello positivo' : '');
    } else { peakL = T.peakL; label = T.label; raceKm = T.km; }
    return { type: t, T: T, dens: dens, peakL: peakL, label: label, raceKm: raceKm, grow: t === 'grow', trail: t === 'trail',
      effRace: t === 'trail' ? p.rtrailKm + p.rdplus / 100 : raceKm };
  }
  function peakVolume(spec, n, p) {
    const share = gShare(n);
    let floor = spec.T.floorV || 0;
    if (spec.grow) floor = spec.peakL >= 28 ? 40 : spec.peakL >= 17 ? 28 : spec.peakL >= 12 ? 20 : 12;
    if (spec.trail) { const E = spec.effRace; floor = E >= 55 ? 45 : E >= 35 ? 34 : 22; }
    return Math.max(floor, spec.peakL / share);
  }

  /* Percorso di avvio (cammina-corri) per chi non riesce ancora a correre 25 minuti di fila. */
  function avvioStart(p) {
    if (p.rnowLong >= 4) return -1;
    if (p.rnowLong >= 2) return 4;
    return (p.exp === 'attivo' || p.exp === 'esperto') ? 1 : 0;
  }
  function avvioStageWeeks(p, i) {
    const st = RSTAGES[i];
    if (st.kind === 'walk' || st.kind === 'c') return 1;
    return (p.exp === 'attivo' || p.exp === 'esperto') ? 1 : 2;
  }
  function avvioWeeks(p, nRuns) {
    let idx = avvioStart(p);
    if (idx < 0) return [];
    const out = [];
    let used = 0, prev = idx;
    for (let w = 0; idx < AVVIO_END && w < 80; w++) {
      const deload = w % 4 === 3;
      const cur = deload ? prev : idx;
      if (!deload) prev = cur;
      out.push({ w: w, stage: RSTAGES[cur], idx: cur, deload: deload });
      if (!deload) { used++; if (used >= avvioStageWeeks(p, idx)) { used = 0; idx++; } }
    }
    return out;
  }

  /* Simulazione del volume: restituisce per ogni settimana volume (V) e lungo (L), in km o km-sforzo. */
  function simulate(c, g, total) {
    const A = c.avvio.length, T = c.taper.length;
    const B = total - A - T;
    const weeks = [];
    let reached = true;
    if (B < 1) return { weeks: weeks, reached: false, B: B, endV: c.startV, endL: c.startL };
    let Vb = c.startV, Lb = c.startL;
    for (let i = 0; i < B; i++) {
      const w = A + i;
      const cut = w % 4 === 3 && i > 0;
      if (i > 0 && !cut) {
        const next = Math.min(c.peakV, Vb + Math.max(0.5, g * Vb));
        let want;
        if (c.peakV - c.startV > 0.5) want = c.startL + (c.peakL - c.startL) * ((next - c.startV) / (c.peakV - c.startV));
        else want = Lb + 1;
        Lb = Math.min(want, c.peakL, Lb + Math.max(1, 0.1 * Lb));
        Vb = next;
      }
      Lb = Math.min(Lb, gShare(c.n) * Vb + 1e-9, c.peakL);
      const V = cut ? Vb * 0.75 : Vb, L = cut ? Math.max(c.startL * 0.8, Lb * 0.75) : Lb;
      weeks.push({ w: w, V: V, L: L, Vb: Vb, Lb: Lb, cut: cut, kind: cut ? 'cut' : 'build', i: i });
    }
    const last = weeks.filter(function (x) { return !x.cut; }).pop() || weeks[weeks.length - 1];
    reached = last.Vb >= c.peakV - 0.05 && last.Lb >= c.peakL - 0.05;
    return { weeks: weeks, reached: reached, B: B, endV: last.Vb, endL: last.Lb };
  }
  function fitGrowth(c, total) {
    for (let g = 0.015; g <= G_MAX + 1e-9; g += 0.0025) {
      const s = simulate(c, g, total);
      if (s.reached) return { g: g, sim: s, ok: true };
    }
    const s = simulate(c, G_MAX, total);
    return { g: G_MAX, sim: s, ok: false };
  }
  function minWeeksFor(c, maxComfort) {
    for (let t = c.avvio.length + c.taper.length + 2; t <= 156; t++) {
      const f = fitGrowth(c, t);
      if (f.ok && (!maxComfort || f.g <= G_COMFORT + 1e-9)) return t;
    }
    return null;
  }

  /* Giorni: lungo, qualità, facili. */
  function layoutRun(p, n, sDays, wantQual) {
    const pref = (p.runDays || []).filter(function (d) { return d >= 0 && d <= 6; });
    let best = null, bestSc = -1e9;
    combos([0, 1, 2, 3, 4, 5, 6], n).forEach(function (set) {
      if (pref.length >= n && !set.every(function (d) { return pref.indexOf(d) >= 0; })) return;
      const used = {};
      set.forEach(function (d) { used[d] = 1; }); sDays.forEach(function (d) { used[d] = 1; });
      if (Object.keys(used).length > 6) return;
      set.forEach(function (L) {
        let sc = 0;
        if (L === 5 || L === 6) sc += 3; else if (L === 4 || L === 0) sc += 0.5;
        if (sDays.indexOf(L) >= 0) sc -= 6;
        if (sDays.indexOf((L + 6) % 7) >= 0) sc -= 4;
        if (sDays.indexOf((L + 1) % 7) >= 0) sc -= 1;
        sc += set.indexOf((L + 6) % 7) >= 0 ? -1.5 : 1;
        let Q = null, qs = -1e9;
        if (wantQual) set.forEach(function (q) {
          if (q === L) return;
          let s = 0;
          const gap = (L - q + 7) % 7;
          if (gap === 1) s -= 5; else if (gap === 2) s -= 0.5; else s += 1;
          if (sDays.indexOf(q) >= 0) s -= 4;
          if (sDays.indexOf((q + 6) % 7) >= 0) s -= 1;
          if (s > qs) { qs = s; Q = q; }
        });
        if (Q != null) sc += qs;
        set.forEach(function (d) { if (d !== L && d !== Q && sDays.indexOf(d) >= 0) sc -= 2; });
        set.forEach(function (a) {
          if (set.indexOf((a + 1) % 7) >= 0) sc -= n >= 4 ? 0.5 : 1.5;
          if (set.indexOf((a + 1) % 7) >= 0 && set.indexOf((a + 2) % 7) >= 0) sc -= 2;
        });
        if (sc > bestSc) { bestSc = sc; best = { days: set.slice().sort(function (a, b) { return a - b; }), long: L, qual: Q }; }
      });
    });
    return best;
  }

  function kmS(x) { return String(x).replace('.', ','); }
  function r05(x) { return Math.max(0.5, Math.round(x * 2) / 2); }
  function fmtMin(m) { const h = Math.floor(m / 60), mm = Math.round(m % 60); return h ? h + ' h ' + (mm < 10 ? '0' : '') + mm + ' min' : mm + ' min'; }

  function goalTimeline(kind, o) {
    // o: { min, tempo, reps, rep, jog, strides }
    const W = function (s, l) { return { type: 'walk', secs: s, label: l }; };
    const R = function (s, l) { return { type: 'run', secs: Math.round(s), label: l || 'Corri facile' }; };
    const F = function (s, l) { return { type: 'fast', secs: Math.round(s), label: l }; };
    const J = function (s, l) { return { type: 'jog', secs: Math.round(s), label: l || 'Trotta piano' }; };
    const tl = [W(180, 'Riscaldamento: cammina')];
    if (kind === 'long' || kind === 'easy' || kind === 'race') tl.push(R(o.min * 60, kind === 'race' ? 'Gara: parti piano' : 'Corri facile'));
    else if (kind === 'strides') {
      tl.push(R(Math.max(5, o.min - 6) * 60));
      for (let i = 0; i < o.strides; i++) { tl.push(F(20, 'Allungo: veloce ma sciolto')); if (i < o.strides - 1) tl.push(J(60, 'Recupero: cammina o trotta')); }
    } else if (kind === 'tempo') {
      tl.push(R(o.warm * 60, 'Corri facile'));
      tl.push(F(o.tempo * 60, 'Ritmo sostenuto'));
      tl.push(R(o.cool * 60, 'Corri facile'));
    } else if (kind === 'intervals' || kind === 'hills') {
      tl.push(R(o.warm * 60, 'Corri facile'));
      for (let i = 0; i < o.reps; i++) {
        tl.push(F(o.rep * 60, kind === 'hills' ? 'Salita: forte ma controllato' : 'Ripetuta: forte ma controllato'));
        if (i < o.reps - 1) tl.push(J(o.jog * 60, kind === 'hills' ? 'Scendi trottando piano' : 'Recupero: trotta piano'));
      }
      tl.push(R(o.cool * 60, 'Corri facile'));
    }
    tl.push(W(180, 'Defaticamento: cammina'));
    return tl;
  }

  function goalPlan(profile, plan) {
    const p = normalize(profile);
    if (p.focus !== 'corsa') return null;
    const spec = goalSpec(p);
    const warnings = [];
    const W = function (t, why, fix, lvl) { warnings.push({ t: t, why: why, fix: fix, lvl: lvl || 'warn' }); };
    const blocked = runBlock(p);
    if (blocked) {
      return { enabled: true, blocked: blocked, type: p.rtype, label: spec.label, weeks: [], warnings: [blocked].map(function (b) { return Object.assign({ lvl: 'warn' }, b); }), tips: [], evidence: GEVID, days: [], perWeek: 0 };
    }
    // frequenza
    let n = p.rn;
    if (spec.T.minRuns > n)
      W('Per «' + spec.label + '» servono almeno ' + spec.T.minRuns + ' uscite a settimana: con ' + n + ' il piano è meno solido.',
        'Con poche uscite il lungo dovrebbe pesare troppo sul totale: il piano deve aumentare molto una corsa sola, che è proprio il tipo di salto che si vuole evitare. Non c\'è una soglia dimostrata: è una scelta di prudenza dell\'app.',
        'Se puoi, porta le uscite a ' + spec.T.minRuns + ' o più. Altrimenti il piano resta valido, ma lo considero meno robusto.', 'info');
    const sDays = p.days.slice();
    // scarto uscite se i giorni non bastano
    let lay = null, nUse = n;
    while (nUse >= 2) { lay = layoutRun(p, nUse, sDays, nUse >= 3); if (lay) break; nUse--; }
    if (!lay) { return { enabled: true, blocked: null, type: p.rtype, label: spec.label, weeks: [], warnings: [{ t: 'Con i giorni di forza che hai scelto non resta posto per correre.', why: 'Serve almeno un giorno intero di riposo a settimana.', fix: 'Riduci i giorni di forza e riprova.', lvl: 'warn' }], tips: [], evidence: GEVID, days: [], perWeek: 0 }; }
    if (nUse < n)
      W('Con i giorni di forza che hai scelto riesco a mettere ' + nUse + ' uscite invece di ' + n + '.',
        'Il piano lascia sempre almeno un giorno intero senza corsa né forza: è lì che il corpo si adatta.',
        'Riduci i giorni di forza o la frequenza della corsa.', 'info');
    n = nUse;
    // se meno uscite di quelle di minRuns: già avvisato
    const pace = p.rpace;
    const avvio = avvioWeeks(p, n);
    const nA = Math.min(n, 3);
    const layA = nA === n ? lay : layoutRun(p, nA, sDays, false) || lay;
    // partenza km-fase
    let startL, startV;
    if (avvio.length) { startL = Math.round(AVVIO_END_MIN() / pace * 10) / 10; startV = startL * (1 + 0.75 * (n - 1)); }
    else { startL = Math.max(2, p.rnowLong); startV = p.rnowWeek > 0 ? p.rnowWeek : startL * (1 + 0.7 * (n - 1)); }
    startV = Math.max(startV, startL / gShare(n), startL * 1.25);
    // trail: volume in km-sforzo
    const peakL = spec.peakL, peakV = peakVolume(spec, n, p);
    const taper0 = spec.grow ? [0.7, 0.85] : spec.T.taper.slice();
    const c = { avvio: avvio, startV: startV, startL: startL, peakV: Math.max(peakV, startV), peakL: Math.max(peakL, startL), n: n, taper: taper0 };
    let fit = fitGrowth(c, p.rweeks);
    if (fit.sim.B < 1) { c.taper = []; fit = fitGrowth(c, p.rweeks); }
    const minW = minWeeksFor(c, false), comfW = minWeeksFor(c, true);
    const feasible = fit.ok;
    const sim = fit.sim;
    const reachedL = sim.endL, reachedV = sim.endV;
    // --- spiegazioni di fattibilità
    const unit = spec.trail ? 'km-sforzo' : 'km';
    const fe = { ok: feasible, minWeeks: minW, comfortWeeks: comfW, weeks: p.rweeks, growth: Math.round(fit.g * 1000) / 10, reachedL: Math.round(reachedL * 10) / 10, reachedV: Math.round(reachedV), needL: Math.round(c.peakL * 10) / 10, needV: Math.round(c.peakV), avvioWeeks: avvio.length, unit: unit };
    if (feasible) {
      fe.text = 'Con ' + p.rweeks + ' settimane il traguardo è raggiungibile: ' + (avvio.length ? 'le prime ' + avvio.length + ' sono di avvio (cammina-corri), poi ' : '') + 'il volume cresce in media del ' + (Math.round(fit.g * 1000) / 10).toString().replace('.', ',') + '% a settimana nelle settimane di carico, con una settimana di scarico ogni quattro.' + (comfW && p.rweeks < comfW ? ' È un ritmo vicino al massimo che l\'app si concede.' : '');
    } else {
      fe.text = 'Con ' + p.rweeks + ' settimane non ci arrivi in modo prudente: ' + (minW ? 'servono almeno ' + minW + ' settimane' : 'servirebbe più di tre anni') + (comfW ? ', meglio ' + comfW + ' per avere margine' : '') + '. In ' + p.rweeks + ' settimane il piano porta il lungo a ' + fe.reachedL.toString().replace('.', ',') + ' ' + unit + ' (servono ' + fe.needL.toString().replace('.', ',') + ') e il volume a ' + fe.reachedV + ' ' + unit + ' (servono ' + fe.needV + ').';
      W('«' + spec.label + '» in ' + p.rweeks + ' settimane non è realistico: ' + (minW ? 'servono almeno ' + minW + ' settimane.' : 'servirebbe più di tre anni.'),
        'Il piano calcola quanto volume serve per arrivarci in sicurezza e quanto in fretta può crescere (al massimo circa il 7% a settimana, con una settimana di scarico ogni quattro). Con il tuo punto di partenza e il tempo che hai, il piano si ferma a un traguardo intermedio. Le stime dipendono da regole scelte dall\'app: il limite del 10% non è dimostrato e la progressione è una scelta prudente, non una soglia scientifica.',
        'Aumenta le settimane' + (comfW ? ' (almeno ' + comfW + ' per stare comodi)' : '') + ', oppure scegli un obiettivo più vicino: il piano ti mostra qui sotto il traguardo che raggiungi davvero in ' + p.rweeks + ' settimane. Rifai poi il piano con i nuovi risultati.');
    }
    if (spec.type === 'marathon' || spec.type === 'half' || (spec.trail && spec.effRace >= 40))
      if (startV < 30 && !avvio.length)
        W('Parti con meno di 30 ' + unit + ' a settimana: prima della gara il piano ti porta oltre.',
          'In uno studio osservazionale su maratoneti, correre meno di 30 km a settimana prima della gara era associato a un rischio di infortunio circa doppio. È un\'associazione e non una causa; per questo il piano costruisce la base prima delle settimane specifiche.', 'Non saltare le settimane di base e non anticipare il lungo.', 'info');
    if (spec.trail && spec.effRace > 80)
      W('Una gara di questa lunghezza/dislivello è oltre ciò che questa app sa preparare.', 'Gli ultra-trail richiedono gestione di alimentazione, notte, materiali e tempi di recupero che qui non sono modellati.', 'Per distanze molto lunghe affidati a un allenatore.', 'warn');
    if (feasible && startL >= c.peakL * 0.95 && startV >= c.peakV * 0.95)
      W('Hai già il volume e il lungo richiesti da questo obiettivo.', 'Il piano non ha bisogno di farti crescere: consolida quello che fai, aggiunge un po\' di qualità e arriva al traguardo.', 'Se vuoi un obiettivo più ambizioso, scegli una distanza maggiore o una gara con più dislivello.', 'info');
    const sCount = sDays.length;
    // --- costruzione settimane
    const weeks = [];
    const kmRound = function (x) { return spec.trail ? Math.round(x) : Math.round(x * 2) / 2; };
    let qCount = 0, aw = avvio.length;
    const taper = c.taper;
    const lastIdx = p.rweeks - 1;
    // 1) avvio
    avvio.forEach(function (a) {
      const sessions = [];
      layA.days.forEach(function (d, i) {
        const last = i === layA.days.length - 1;
        const ss = stageSession(a.stage, a.deload, last, layA.days.length);

  /* ---------------------------------------------------------- stretching */

    const S = function (name, detail) { return { name: name, detail: detail }; };

    const lowerItems = [];
    if (!has('ginocchia')) lowerItems.push(S('Quadricipiti in piedi', hold + ' per lato, ginocchia vicine, bacino leggermente in avanti'));
    lowerItems.push(S('Femorali', hold + ' per lato: gamba tesa sul rialzo o a terra da seduto, busto lungo e schiena dritta'));
    lowerItems.push(S('Flessori dell\'anca', hold + ' per lato: affondo basso con il bacino che spinge in avanti, senza inarcare la schiena'));
    lowerItems.push(S('Polpacci al muro', hold + ' per lato: tallone a terra, gamba posteriore tesa'));

      else if (a === 'crepl') { S.circCtx.replace = +v; }

      else if (a === 'cusefit') { var f2 = E.circuitFit(plan, fitCtx(), S.circOpt); if (f2.rec) { S.circOpt.area = f2.rec.area; S.circOpt.goal = f2.rec.goal; S.circOpt.minutes = f2.rec.minutes; S.circOpt.n = null; S.circ = E.quickCircuit(profile(), S.circOpt); } }
      else if (a === 'clog') { S.circLog.push(Date.now()); S.circLog = S.circLog.slice(-30); toast('Circuito registrato'); }
      else if (a === 'addc') { S.circCtx = { sit: 'dopo', replace: null, weekday: +v, week: S.wk }; S.tab = 'circuito'; top(); }
      else if (a === 'circ') S.circ = E.quickCircuit(profile(), S.circOpt);
      else if (a === 'lc') S.ladderChain = v;
      else if (a === 'reset1') S.confirmReset = true;
      else if (a === 'reset0') S.confirmReset = false;
      else if (a === 'reset2') { S = JSON.parse(JSON.stringify(DEF)); plan = null; try { localStorage.removeItem(KEY); } catch (e) {} }
    });
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.notif) { S.notif = false; render(); } });
  document.addEventListener('change', function (ev) {
    var t = ev.target, p = S.p;
    if (t.dataset.bind) { p[t.dataset.bind] = t.type === 'checkbox' ? t.checked : t.value; if (t.type === 'checkbox' || t.dataset.bind === 'weight') render(); else save(); }
    else if (t.dataset.tog) { toggle(p[t.dataset.tog], t.dataset.v); if (t.dataset.tog !== 'skills') p.starts = p.starts; render(); }
    else if (t.dataset.cfg) { S.runCfg[t.dataset.cfg] = t.checked; render(); }
    else if (t.dataset.load) { var kgv = parseFloat(String(t.value).replace(',', '.')); if (kgv > 0) S.loads[t.dataset.load] = Math.round(kgv * 10) / 10; else delete S.loads[t.dataset.load]; render(); }
    else if (t.dataset.chk) { S.chk[t.dataset.chk] = t.checked; render(); }
    else if (t.dataset.done) { S.done[t.dataset.done] = t.checked; render(); }
    else if (t.dataset.gdone) { S.rdone[t.dataset.gdone] = t.checked; render(); }
  });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (S.firstVer == null) S.firstVer = S.step >= 1 ? '0' : APP_VER;
  window.addEventListener('pl-update', function () {
    S.updReady = true;
    try {
      if (S.updAlerts && 'Notification' in window && Notification.permission === 'granted' && document.hidden) {
        var msg = (window.CHANGES && window.CHANGES[0]) ? window.CHANGES[0].title : 'Nuova versione disponibile';
        navigator.serviceWorker.getRegistration().then(function (r) { if (r && r.showNotification) r.showNotification('Palestra Libera aggiornata', { body: msg, icon: 'icon-192.png', tag: 'pl-update' }); });
      }
    } catch (e) {}
    render();
  });
  if (S.step >= PLAN_STEP) rebuild();
  render();
})();
</script>
