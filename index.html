<style>
:root{--bg:#eceff0;--card:#fff;--fg:#14211d;--mut:#55655f;--line:#d3dbd8;--acc:#1f5c4a;--acc-fg:#fff;--acc-soft:#dcebe5;--tape:#f2c230;--tape-fg:#2a2100;--warn:#8a3b12;--warn-bg:#fbe9dc;--ok:#1f6b3a;--dis:#e3e8e6;--shadow:0 1px 0 rgba(20,33,29,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--card:#17211e;--fg:#e8efec;--mut:#9fb0a9;--line:#2b3a35;--acc:#5fc4a2;--acc-fg:#0a1713;--acc-soft:#1d332c;--tape:#f2c230;--tape-fg:#2a2100;--warn:#f0a57a;--warn-bg:#36211a;--ok:#7fd49b;--dis:#202c28;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1715;--card:#17211e;--fg:#e8efec;--mut:#9fb0a9;--line:#2b3a35;--acc:#5fc4a2;--acc-fg:#0a1713;--acc-soft:#1d332c;--tape:#f2c230;--tape-fg:#2a2100;--warn:#f0a57a;--warn-bg:#36211a;--ok:#7fd49b;--dis:#202c28;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 Barlow,system-ui,sans-serif;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{margin:0}.mut{color:var(--mut)}.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.35rem;text-transform:uppercase;letter-spacing:.05em}
.brand i{display:inline-block;width:10px;height:18px;background:var(--tape);margin-right:8px;transform:skewX(-14deg);vertical-align:-2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;color:var(--mut);font:600 .8rem Barlow,sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:8px 4px;border-radius:8px;min-height:44px;cursor:pointer}
nav.tabs button[aria-selected=true]{color:var(--fg);background:var(--acc-soft);box-shadow:inset 0 -3px 0 var(--tape)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--acc-fg);border:0;border-radius:8px;padding:12px 18px;font:600 1rem Barlow,sans-serif;min-height:46px;cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.tape{background:var(--tape);color:var(--tape-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input[type=text],input[type=number],select{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--card);cursor:pointer;min-width:0;width:100%;text-align:left}
.opt[aria-pressed=true],.opt.on{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 4px 0 0 var(--tape)}
.opt b{display:block}
.opt span.small{display:block}
.opt input{margin-top:4px;width:20px;height:20px;accent-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.chip.done::after{content:" ✓"}
.warn,.note{border-radius:10px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.warn{background:var(--warn-bg);color:var(--warn)}
.note{background:var(--acc-soft);color:var(--fg)}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--tape);color:var(--tape-fg);font:700 .75rem Barlow,sans-serif;display:grid;place-items:center;padding:0 5px}
.nt{border-left:6px solid var(--acc);background:var(--bg);border-radius:8px;padding:10px 12px}.nt.w{border-left-color:var(--warn)}
.tm{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--fg);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.tmband{display:flex;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));font:700 1.3rem 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.tmband.work{background:var(--acc);color:var(--acc-fg)}.tmband.rest{background:var(--tape);color:var(--tape-fg)}.tmband.prep{background:var(--fg);color:var(--bg)}
.tmbar{height:6px;background:var(--line)}.tmbar i{display:block;height:100%;width:0;background:var(--tape)}
.tmin{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px))}
.tmtime{font:700 6rem/1 'Barlow Condensed',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.tmcount{font:700 4rem/1 'Barlow Condensed',sans-serif;text-align:center}
.rmap{display:block;width:100%;height:38vh;min-height:220px;background:var(--dis)}
.rcv{display:block;width:100%;height:140px;background:var(--bg);border-radius:8px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rcell b{font:700 1.7rem 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
nav.tabs button{font-size:.72rem}
.qbtn{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;font:700 1rem Barlow,sans-serif;cursor:pointer}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.steps{display:flex;gap:4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--acc)}.steps i.cur{background:var(--tape)}
.tag{display:inline-block;font:700 .72rem 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:4px;background:var(--acc-soft);color:var(--fg)}
.tag.tp{background:var(--tape);color:var(--tape-fg)}
.ex{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.ex:first-of-type{border-top:0}
.ex .nm{font-weight:600;display:flex;justify-content:space-between;gap:10px}
.ex .rx{font:700 1.05rem 'Barlow Condensed',sans-serif;letter-spacing:.03em;white-space:nowrap}
details>summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:.9rem;min-height:32px}
details ol{margin:6px 0 0;padding-left:22px}details li{margin-bottom:4px}
.ladder{display:flex;flex-direction:column;gap:6px}
.stepbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg);border-left:6px solid var(--line)}
.stepbar.cur{border-left-color:var(--tape);background:var(--acc-soft);font-weight:600}
.stepbar.blk{opacity:.55;background:var(--dis)}
.stepbar .lv{font:700 .8rem 'Barlow Condensed',sans-serif;color:var(--mut);min-width:34px}
.checkrow{display:flex;gap:10px;align-items:center;min-height:44px}
.checkrow input{width:22px;height:22px;accent-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-weight:600}
pre.lic{white-space:pre-wrap;font:.78rem/1.45 ui-monospace,Menlo,monospace;background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto}
.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.timeline div{padding:6px 0;border-radius:6px;background:var(--bg);font:700 .8rem 'Barlow Condensed',sans-serif;text-transform:uppercase}
.timeline .on{background:var(--acc);color:var(--acc-fg)}
.timeline .alt{background:var(--tape);color:var(--tape-fg)}
@media (max-width:400px){h1{font-size:1.7rem}.ex .nm{flex-direction:column;gap:2px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

<script>window.LIB={"equipment":{"rialzo":"Sedia robusta, panca, gradino o tavolo","sbarra":"Sbarra per trazioni","tavolo":"Tavolo molto robusto, sbarra bassa o anelli (per i rematori)","parallele":"Parallele o due supporti stabili","anelli":"Anelli o cinghie di sospensione","elastico":"Elastico di resistenza","manubri":"Manubri (anche regolabili)","bilanciere":"Bilanciere con dischi e fermadischi","panca":"Panca piana stabile","rack":"Rack o supporti con barre di sicurezza regolabili"},"limits":{"polsi":"Polsi (appoggio sulle mani)","spalle":"Spalle","gomiti":"Gomiti (tendini)","ginocchia":"Ginocchia","schiena":"Zona lombare","salti":"Niente salti e impatti"},"chains":{"push_h":{"label":"Spinta orizzontale","sub":"Push-up e varianti","group":"forza"},"push_v":{"label":"Spinta verticale","sub":"Spalle (pike)","group":"forza","derive":{"frm":"push_h","off":-1}},"dip":{"label":"Dip","sub":"Spinta e tricipiti","group":"forza","derive":{"frm":"push_h","off":-1}},"pull_h":{"label":"Tirata orizzontale","sub":"Rematori","group":"forza"},"pull_v":{"label":"Tirata verticale","sub":"Trazioni","group":"forza"},"squat":{"label":"Squat","sub":"Gambe, due appoggi","group":"forza"},"calf":{"label":"Polpacci","sub":"Alzate sui polpacci","group":"forza"},"lunge":{"label":"Gamba singola","sub":"Step-up, affondi, pistol","group":"forza"},"hinge":{"label":"Catena posteriore","sub":"Glutei e femorali","group":"forza"},"core_ext":{"label":"Core: plank e hollow","sub":"Anti-estensione","group":"core"},"core_flex":{"label":"Core: sollevamento gambe","sub":"Flessione d'anca","group":"core","derive":{"frm":"core_ext","off":0}},"core_lat":{"label":"Core: laterale","sub":"Plank laterale","group":"core","derive":{"frm":"core_ext","off":0}},"core_post":{"label":"Core: schiena e stabilità","sub":"Bird dog, superman","group":"core","derive":{"frm":"core_ext","off":0}},"cond":{"label":"Condizionamento","sub":"Cardio e circuiti","group":"cond"},"wt_squat":{"label":"Pesi: squat","sub":"Goblet e bilanciere","group":"pesi"},"wt_hinge":{"label":"Pesi: stacchi","sub":"Stacco rumeno e da terra","group":"pesi"},"wt_push_h":{"label":"Pesi: panca","sub":"Floor press e panca piana","group":"pesi"},"wt_push_v":{"label":"Pesi: spalle","sub":"Military press","group":"pesi"},"wt_pull_h":{"label":"Pesi: rematori","sub":"Manubri e bilanciere","group":"pesi"},"wt_lunge":{"label":"Pesi: gamba singola","sub":"Affondi e squat bulgaro","group":"pesi"},"wt_biceps":{"label":"Pesi: bicipiti","sub":"Curl","group":"pesi"},"wt_triceps":{"label":"Pesi: tricipiti","sub":"Estensioni","group":"pesi"},"sk_hs":{"label":"Verticale","sub":"Handstand","group":"skill","prereq":[{"chain":"push_h","min":"push_std"}],"forbid":["polsi","spalle"],"reqmsg":"Servono almeno 8 push-up standard di fila."},"sk_fl":{"label":"Front lever","sub":"Leva frontale","group":"skill","prereq":[{"chain":"pull_v","min":"pv_pull"}],"forbid":["gomiti","spalle"],"reqmsg":"Servono almeno 8 trazioni alla sbarra di fila."},"sk_mu":{"label":"Muscle-up","sub":"Dalla sbarra all'appoggio","group":"skill","prereq":[{"chain":"pull_v","min":"pv_pull"},{"chain":"push_h","min":"push_std"}],"forbid":["gomiti","spalle","polsi"],"reqmsg":"Servono almeno 8 trazioni e 8 push-up standard di fila."},"sk_pl":{"label":"Planche","sub":"Leva in appoggio","group":"skill","prereq":[{"chain":"push_h","min":"push_dec"}],"forbid":["polsi","spalle","gomiti"],"reqmsg":"Servono almeno 15 push-up standard di fila, anche con i piedi rialzati."}},"exercises":[{"id":"push_wall","chain":"push_h","name":"Push-up al muro","lv":0,"kind":"reps","lo":8,"hi":15,"eq":[],"flags":[],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Mettiti di fronte a un muro, a circa un braccio di distanza, con i piedi larghi come i fianchi.","Appoggia i palmi sul muro all'altezza delle spalle, poco più larghi delle spalle.","Piega i gomiti e porta il petto verso il muro, tenendo il corpo in linea dalla testa ai talloni.","Spingi sul muro fino a distendere le braccia."],"ds":null,"note":"Più i piedi sono lontani dal muro, più l'esercizio è difficile."},{"id":"push_inc_hi","chain":"push_h","name":"Push-up inclinato alto","lv":1,"kind":"reps","lo":8,"hi":15,"eq":["rialzo"],"flags":["polsi"],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Metti le mani su una superficie rialzata, come una panca o un gradino, leggermente più larga della larghezza delle spalle.","Estendi le gambe dietro di te, appoggiandole sulle punte dei piedi, creando una linea retta dalla testa ai talloni.","Abbassa il petto verso la superficie rialzata piegando i gomiti, mantenendo il corpo in linea retta.","Fai una pausa per un momento in basso, quindi ritorna alla posizione di partenza raddrizzando le braccia."],"ds":"0493","note":"Mani su un piano alto (tavolo, piano di lavoro). Più è alto, più è facile."},{"id":"push_knee","chain":"push_h","name":"Push-up sulle ginocchia","lv":2,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":["polsi","ginocchia"],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Parti a quattro zampe con le mani sotto le spalle, poi porta le ginocchia indietro fino a formare una linea dalle ginocchia alla testa.","Stringi addome e glutei e tieni i gomiti a circa 45° dal busto.","Scendi finché il petto è vicino al pavimento, senza far cadere il bacino.","Spingi sul pavimento fino a distendere le braccia."],"ds":null,"note":"Usa un tappetino per proteggere le ginocchia."},{"id":"push_inc_lo","chain":"push_h","name":"Push-up inclinato basso","lv":2,"kind":"reps","lo":6,"hi":15,"eq":["rialzo"],"flags":["polsi"],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Metti le mani sul bordo di una scatola o di una superficie rialzata, leggermente più larghe della larghezza delle spalle.","Estendi le gambe dietro di te, appoggiandole sulle punte dei piedi, creando una linea retta dalla testa ai talloni.","Abbassa il petto verso il box piegando i gomiti, mantenendo il corpo in linea retta.","Fai una pausa per un momento in basso, quindi ritorna alla posizione di partenza raddrizzando le braccia."],"ds":"3785","note":"Mani su un gradino o una panca. Più è basso, più è difficile."},{"id":"push_std","chain":"push_h","name":"Push-up","lv":3,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":["polsi"],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Inizia in una posizione di plancia alta con le mani leggermente più larghe della larghezza delle spalle e i piedi uniti.","Coinvolgi il core e abbassa il corpo verso terra piegando i gomiti, mantenendo il corpo in linea retta.","Fai una pausa per un momento quando il petto è appena sopra il suolo, quindi ritorna alla posizione di partenza raddrizzando le braccia."],"ds":"0662"},{"id":"push_dia","chain":"push_h","name":"Push-up a diamante","lv":3,"kind":"reps","lo":5,"hi":12,"eq":[],"flags":["polsi","gomiti"],"per":false,"focus":"Tricipiti, petto","steps":["Inizia in posizione di tavola alta con le mani vicine, formando una forma di diamante con pollici e indici.","Mantieni il corpo in linea retta dalla testa ai piedi, attivando core e glutei.","Abbassa il petto verso la forma a diamante formata dalle mani, tenendo i gomiti vicini al corpo.","Fermati un attimo in fondo, poi risali fino alla posizione iniziale."],"ds":"0283"},{"id":"push_dec","chain":"push_h","name":"Push-up con piedi rialzati","lv":4,"kind":"reps","lo":6,"hi":15,"eq":["rialzo"],"flags":["polsi","spalle"],"per":false,"focus":"Petto alto, spalle","steps":["Appoggia le mani a terra, leggermente più larghe della larghezza delle spalle, con i piedi sollevati su una superficie stabile.","Mantieni il corpo in linea retta dalla testa ai piedi, attivando i muscoli del core.","Abbassa il petto verso il suolo piegando i gomiti, tenendoli vicini al corpo.","Spingi attraverso i palmi per estendere le braccia e tornare alla posizione iniziale."],"ds":"0279"},{"id":"push_arc","chain":"push_h","name":"Archer push-up","lv":4,"kind":"reps","lo":4,"hi":10,"eq":[],"flags":["polsi","spalle","gomiti"],"per":true,"focus":"Petto, tricipiti (un lato alla volta)","steps":["Inizia in una posizione push-up con le mani leggermente più larghe della larghezza delle spalle.","Estendi un braccio di lato, parallelo al suolo.","Abbassa il corpo piegando i gomiti, mantenendo la schiena dritta e il core impegnato.","Spingi indietro fino alla posizione di partenza.","Continua ad alternare i lati per il numero di ripetizioni desiderato."],"ds":"3294"},{"id":"pv_pike_el","chain":"push_v","name":"Pike push-up con mani rialzate","lv":2,"kind":"reps","lo":5,"hi":10,"eq":["rialzo"],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, tricipiti","steps":["Metti le mani su un rialzo stabile, larghe come le spalle, e porta i piedi indietro con i fianchi alti: il corpo forma una V rovesciata.","Piega i gomiti portando la testa verso il rialzo, tra le mani.","Spingi fino a distendere le braccia, mantenendo i fianchi alti."],"ds":null},{"id":"pv_pike","chain":"push_v","name":"Pike push-up","lv":3,"kind":"reps","lo":5,"hi":12,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, tricipiti","steps":["Mani a terra larghe come le spalle, piedi indietro e fianchi alti: il corpo forma una V rovesciata.","Piega i gomiti e porta la testa verso il pavimento, davanti alle mani.","Spingi sulle mani fino a distendere le braccia, con le gambe quasi tese."],"ds":null},{"id":"pv_pike_feet","chain":"push_v","name":"Pike push-up con piedi rialzati","lv":4,"kind":"reps","lo":4,"hi":10,"eq":["rialzo"],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, tricipiti","steps":["Come il pike push-up, ma con i piedi appoggiati su un rialzo stabile: il peso passa sulle spalle.","Scendi con la testa davanti alle mani, gomiti a circa 45°.","Spingi fino a distendere le braccia."],"ds":null,"note":"Più i piedi sono alti, più è difficile."},{"id":"dip_bench","chain":"dip","name":"Dip su panca","lv":2,"kind":"reps","lo":5,"hi":12,"eq":["rialzo"],"flags":["spalle","gomiti","polsi"],"per":false,"focus":"Tricipiti","steps":["Siediti sul bordo di una panca o di una sedia con le mani che stringono il bordo accanto ai fianchi.","Fai scivolare il sedere fuori dalla panca e raddrizzare le gambe davanti a te, tenendo i talloni a terra.","Piega i gomiti e abbassa il corpo verso terra, tenendo la schiena vicina alla panca.","Fermati un attimo in fondo, poi risali fino alla posizione iniziale."],"ds":"0129","note":"Scendi poco: se senti fastidio davanti alla spalla, scegli i push-up."},{"id":"dip_par","chain":"dip","name":"Dip alle parallele","lv":3,"kind":"reps","lo":5,"hi":12,"eq":["parallele"],"flags":["spalle","gomiti"],"per":false,"focus":"Petto basso, tricipiti","steps":["Posizionati sulle barre parallele con le braccia completamente estese e il corpo dritto.","Abbassa il corpo piegando i gomiti finché le spalle non saranno sotto i gomiti.","Spingi di nuovo verso la posizione iniziale raddrizzando le braccia."],"ds":"0251","note":"Scendi solo fino a una profondità comoda per le spalle."},{"id":"dip_ring","chain":"dip","name":"Dip agli anelli","lv":5,"kind":"reps","lo":4,"hi":10,"eq":["anelli"],"flags":["spalle","gomiti"],"per":false,"focus":"Petto, tricipiti, spalle","steps":["Inizia appendendoti agli anelli con le braccia completamente distese e il corpo dritto.","Abbassa il corpo piegando i gomiti finché le spalle non sono sotto i gomiti.","Spingiti indietro fino alla posizione di partenza raddrizzando le braccia."],"ds":"0677"},{"id":"ph_ywt","chain":"pull_h","name":"Y-T-W a pancia in giù","lv":0,"kind":"reps","lo":5,"hi":10,"eq":[],"flags":[],"per":false,"focus":"Scapole, schiena alta","steps":["Sdraiati a pancia in giù con la fronte appoggiata, braccia lungo il corpo.","Solleva leggermente il petto e porta le braccia in Y sopra la testa, poi in T ai lati, poi in W con i gomiti piegati.","Muoviti piano stringendo le scapole, senza inarcare la zona lombare e senza forzare il collo.","Una Y, una T e una W contano come una ripetizione."],"ds":null},{"id":"ph_row_bent","chain":"pull_h","name":"Rematore inverso con ginocchia piegate","lv":1,"kind":"reps","lo":6,"hi":15,"eq":["tavolo"],"flags":["gomiti"],"per":false,"focus":"Dorsali, bicipiti","steps":["Sdraiati sotto una sbarra bassa o un tavolo molto robusto e afferra il bordo con le mani poco più larghe delle spalle.","Piega le ginocchia e appoggia i piedi a terra, con il corpo in linea dalle spalle alle ginocchia.","Tira il petto verso il bordo stringendo le scapole, poi scendi con controllo."],"ds":null,"note":"Verifica che il tavolo sia stabile e non possa ribaltarsi."},{"id":"ph_row","chain":"pull_h","name":"Rematore inverso","lv":2,"kind":"reps","lo":6,"hi":15,"eq":["tavolo"],"flags":["gomiti"],"per":false,"focus":"Dorsali, bicipiti","steps":["Installa una barra all'altezza della vita o usa un trainer per le sospensioni.","Mettiti di fronte alla barra o al trainer in sospensione, con i piedi alla larghezza delle spalle.","Afferra la barra o le maniglie con una presa prona, leggermente più larga della larghezza delle spalle.","Appoggiati all'indietro, mantenendo il corpo dritto e i talloni a terra.","Tira il petto verso la barra o le maniglie, stringendo insieme le scapole.","Fermati per un momento in alto, quindi abbassati lentamente nella posizione di partenza."],"ds":"0499"},{"id":"ph_row_feet","chain":"pull_h","name":"Rematore inverso con piedi rialzati","lv":3,"kind":"reps","lo":6,"hi":12,"eq":["tavolo","rialzo"],"flags":["gomiti"],"per":false,"focus":"Dorsali, bicipiti","steps":["Come il rematore inverso, ma con i talloni appoggiati su un rialzo stabile.","Tieni il corpo rigido in linea retta e tira il petto verso la sbarra.","Scendi senza far cedere i fianchi."],"ds":null},{"id":"ph_row_arch","chain":"pull_h","name":"Archer row agli anelli","lv":4,"kind":"reps","lo":4,"hi":10,"eq":["anelli"],"flags":["gomiti","spalle"],"per":true,"focus":"Dorsali, bicipiti (un lato alla volta)","steps":["Appeso agli anelli con il corpo inclinato e presa larga.","Tira il petto verso una mano mentre l'altro braccio resta quasi disteso e fa da supporto.","Torna al centro e alterna i lati."],"ds":null},{"id":"pv_hang","chain":"pull_v","name":"Appeso attivo","lv":1,"kind":"time","lo":15,"hi":40,"eq":["sbarra"],"flags":["spalle"],"per":false,"focus":"Presa, spalle","steps":["Appenditi alla sbarra a braccia distese, con le mani larghe come le spalle o poco più.","Spingi le spalle lontano dalle orecchie (scapole verso il basso) senza piegare i gomiti.","Respira con regolarità. Scendi se senti dolore alla spalla o formicolio alle mani."],"ds":null},{"id":"pv_scap","chain":"pull_v","name":"Scapular pull-up","lv":1,"kind":"reps","lo":5,"hi":10,"eq":["sbarra"],"flags":["spalle"],"per":false,"focus":"Dorsali, scapole","steps":["Appenditi alla sbarra a braccia distese.","Senza piegare i gomiti, porta le scapole verso il basso: il corpo sale di pochi centimetri.","Torna lentamente in posizione di partenza."],"ds":null},{"id":"pv_neg","chain":"pull_v","name":"Trazione negativa","lv":2,"kind":"reps","lo":3,"hi":6,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, bicipiti","steps":["Sali alla posizione alta, con il mento sopra la sbarra, con un salto o con l'aiuto di un rialzo.","Scendi lentamente in 3-5 secondi, fino ad avere le braccia quasi distese.","Torna in alto con l'aiuto del rialzo, non con la forza dal basso."],"ds":null},{"id":"pv_band","chain":"pull_v","name":"Trazione assistita con elastico","lv":2,"kind":"reps","lo":4,"hi":10,"eq":["sbarra","elastico"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, bicipiti","steps":["Fissa un elastico robusto alla sbarra e infilaci un piede o un ginocchio.","Parti appeso a braccia distese e tira fino a portare il mento sopra la sbarra.","Scendi con controllo. Passa a un elastico più sottile quando diventa facile."],"ds":null},{"id":"pv_chin","chain":"pull_v","name":"Chin-up","lv":3,"kind":"reps","lo":3,"hi":10,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, bicipiti","steps":["Appenditi a una barra per trazioni con i palmi rivolti verso di te e le mani distanti alla larghezza delle spalle.","Attiva il core e tira il corpo verso la barra, iniziando con il petto.","Continua a tirare finché il mento non è sopra il bilanciere.","Fermati un attimo in cima, poi abbassa lentamente il corpo fino alla posizione iniziale."],"ds":"1326"},{"id":"pv_pull","chain":"pull_v","name":"Trazione alla sbarra","lv":3,"kind":"reps","lo":3,"hi":10,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, bicipiti","steps":["Appendi a una barra per trazioni con i palmi delle mani rivolti lontano da te e le braccia completamente distese.","Coinvolgi il tuo core e stringi insieme le scapole.","Tira il corpo verso la sbarra piegando i gomiti e portando il petto verso la sbarra.","Fai una pausa nella parte superiore del movimento, quindi abbassa lentamente il corpo fino alla posizione iniziale."],"ds":"0652"},{"id":"pv_wide","chain":"pull_v","name":"Trazione a presa larga","lv":4,"kind":"reps","lo":3,"hi":10,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali","steps":["Appendi a una barra per trazioni con i palmi rivolti lontano da te e le mani più larghe della larghezza delle spalle.","Coinvolgi il tuo core e stringi insieme le scapole.","Tira il corpo verso la barra finché il mento non è sopra la barra.","Abbassa il corpo nella posizione iniziale mantenendo il controllo."],"ds":"1429"},{"id":"pv_arch","chain":"pull_v","name":"Archer pull-up","lv":5,"kind":"reps","lo":2,"hi":6,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":true,"focus":"Dorsali, bicipiti (un lato alla volta)","steps":["Inizia appendendoti a una barra per trazioni con una presa prona, leggermente più larga della larghezza delle spalle.","Coinvolgi il tuo core e tira le scapole verso il basso e all'indietro.","Mentre ti tiri su, piega un braccio e porta il gomito verso il fianco, mantenendo l'altro braccio dritto.","Continua a tirare finché il mento non è sopra la barra e il braccio piegato è completamente flesso.","Abbassati di nuovo con controllo, raddrizzando il braccio piegato e ripetendo il movimento dall'altro lato.","Lati alternativi ad ogni ripetizione."],"ds":"3293"},{"id":"sq_sit","chain":"squat","name":"Alzarsi dalla sedia","lv":0,"kind":"reps","lo":6,"hi":15,"eq":["rialzo"],"flags":[],"per":false,"focus":"Gambe, glutei","steps":["Siediti sul bordo di una sedia stabile, con i piedi larghi come le spalle e ben appoggiati.","Spingi sui piedi e alzati in piedi con il busto inclinato in avanti, senza aiutarti con le mani se riesci.","Risiediti lentamente in 2-3 secondi."],"ds":null},{"id":"sq_bw","chain":"squat","name":"Squat a corpo libero","lv":1,"kind":"reps","lo":8,"hi":20,"eq":[],"flags":["ginocchia"],"per":false,"focus":"Gambe, glutei","steps":["Piedi larghi come le spalle, punte leggermente aperte.","Scendi spingendo i fianchi indietro e piegando le ginocchia, con il petto alto e le ginocchia nella direzione delle punte dei piedi.","Scendi fin dove mantieni la schiena neutra e i talloni a terra, poi spingi per risalire."],"ds":null},{"id":"sq_pause","chain":"squat","name":"Squat con pausa in basso","lv":2,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":["ginocchia"],"per":false,"focus":"Gambe, glutei","steps":["Esegui lo squat come di consueto, con il petto alto e i talloni a terra.","Fermati 2 secondi nella posizione più bassa che controlli bene.","Spingi sui piedi per risalire senza rimbalzare."],"ds":null},{"id":"sq_tempo","chain":"squat","name":"Squat con discesa lenta","lv":3,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":["ginocchia"],"per":false,"focus":"Gambe, glutei","steps":["Scendi in 3 secondi, tenendo il petto alto e i talloni a terra.","Fermati 1 secondo in basso.","Risali con decisione."],"ds":null},{"id":"ca_raise","chain":"calf","name":"Alzate sui polpacci a due gambe","lv":0,"kind":"reps","lo":12,"hi":25,"eq":[],"flags":[],"per":false,"focus":"Polpacci","steps":["In piedi, mani appoggiate a un muro o a una sedia per l'equilibrio, piedi larghi come le anche.","Sali sulle punte il più in alto possibile, fermati un secondo in cima.","Scendi lentamente, in circa tre secondi, fino a sentire allungarsi il polpaccio."],"ds":null},{"id":"ca_single","chain":"calf","name":"Alzate sui polpacci a una gamba","lv":1,"kind":"reps","lo":8,"hi":20,"eq":[],"flags":[],"per":true,"focus":"Polpacci","steps":["In piedi su una gamba sola, una mano al muro per l'equilibrio.","Sali sulla punta del piede fino in cima e fermati un secondo.","Scendi lentamente in tre secondi. Finisci le ripetizioni e cambia gamba."],"ds":null},{"id":"ca_step","chain":"calf","name":"Alzate a una gamba dal bordo di un gradino","lv":2,"kind":"reps","lo":8,"hi":15,"eq":[],"flags":[],"per":true,"focus":"Polpacci, tendine d'Achille","steps":["Appoggia l'avampiede sul bordo di un gradino, tallone nel vuoto, una mano alla ringhiera.","Sali sulla punta e fermati un secondo.","Scendi lentamente in tre secondi sotto il livello del gradino, poi risali con entrambe le gambe se serve."],"ds":null,"note":"Il tallone scende sotto il gradino: parti con un range breve e aumenta piano. Se senti dolore al tendine d'Achille, torna alle alzate a terra."},{"id":"ca_weight","chain":"calf","name":"Alzate a una gamba dal gradino con zaino carico","lv":3,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":[],"per":true,"focus":"Polpacci, tendine d'Achille","steps":["Indossa uno zaino con un carico moderato. Avampiede sul bordo di un gradino, una mano alla ringhiera.","Sali sulla punta e fermati un secondo.","Scendi lentamente in tre secondi sotto il livello del gradino."],"ds":null,"note":"Carica lo zaino con libri o bottiglie, poco alla volta. Fermati se senti dolore al tendine d'Achille."},{"id":"lu_step","chain":"lunge","name":"Step-up su gradino","lv":1,"kind":"reps","lo":6,"hi":12,"eq":["rialzo"],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei","steps":["Appoggia un piede su un gradino o una sedia stabile (altezza massima: il ginocchio).","Spingi con la gamba sul gradino per salire, senza darti la spinta con l'altra gamba.","Scendi lentamente. Finite le ripetizioni, cambia gamba."],"ds":null},{"id":"lu_split","chain":"lunge","name":"Affondo statico","lv":2,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei","steps":["Stai con i piedi alla larghezza delle spalle.","Fai un passo avanti con un piede e posizionalo a circa mezzo metro davanti all'altro piede.","Abbassa il corpo piegando le ginocchia e le anche, mantenendo la schiena dritta.","Continua ad abbassarti finché la coscia anteriore non è parallela al suolo e il ginocchio posteriore si libra appena sopra il suolo.","Fai una pausa per un momento, quindi spingi il tallone anteriore per tornare alla posizione di partenza."],"ds":"2368"},{"id":"lu_fwd","chain":"lunge","name":"Affondo in avanti alternato","lv":2,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei","steps":["Stai in piedi con i piedi alla larghezza dei fianchi e le mani sui fianchi.","Fai un grande passo avanti con il piede destro, abbassando il corpo in una posizione di affondo.","Piega il ginocchio destro a circa 90 gradi, mantenendo il ginocchio allineato con la caviglia.","Spingi con il piede destro e torna alla posizione di partenza."],"ds":"3470"},{"id":"lu_walk","chain":"lunge","name":"Affondo camminato","lv":3,"kind":"reps","lo":8,"hi":16,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei","steps":["Stai con i piedi alla larghezza delle spalle.","Fai un passo avanti con la gamba destra, abbassando il corpo in una posizione di affondo.","Mantieni il busto in posizione verticale e il ginocchio anteriore allineato con la caviglia.","Spingi con il piede destro e porta il piede sinistro in avanti, assumendo una posizione di affondo con la gamba sinistra.","Continua ad alternare le gambe e a camminare in avanti, mantenendo un ritmo controllato e costante."],"ds":"1460","note":"Serve spazio per camminare in avanti."},{"id":"lu_curt","chain":"lunge","name":"Curtsey squat","lv":3,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Glutei, gambe","steps":["Stai con i piedi a larghezza delle spalle.","Fai un passo diagonalmente dietro e attraverso il corpo con il piede destro, incrociandolo dietro la gamba sinistra.","Piega entrambe le ginocchia come se stessi facendo un inchino, abbassando il corpo verso terra.","Mantieni il busto eretto e il peso sul piede anteriore.","Spingi con il piede anteriore per tornare alla posizione di partenza."],"ds":"3769"},{"id":"lu_bulg","chain":"lunge","name":"Squat bulgaro","lv":3,"kind":"reps","lo":5,"hi":12,"eq":["rialzo"],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei","steps":["Appoggia il collo del piede posteriore su una sedia o una panca stabile dietro di te.","Scendi in verticale con il ginocchio anteriore sopra la caviglia e il busto leggermente inclinato in avanti.","Spingi sul piede anteriore per risalire. Finite le ripetizioni, cambia gamba."],"ds":null},{"id":"lu_shrimp","chain":"lunge","name":"Shrimp squat","lv":4,"kind":"reps","lo":3,"hi":8,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei, equilibrio","steps":["In piedi su una gamba, piega l'altra dietro di te e tienine il piede con la mano dello stesso lato.","Scendi finché il ginocchio posteriore sfiora il pavimento, con il busto inclinato in avanti per bilanciarti.","Risali spingendo con la gamba d'appoggio. Tieniti a un sostegno se perdi l'equilibrio."],"ds":null},{"id":"lu_pistol_as","chain":"lunge","name":"Pistol squat assistito","lv":4,"kind":"reps","lo":3,"hi":8,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei, equilibrio","steps":["Stai in piedi su una gamba vicino a un sostegno stabile (maniglia, anelli, stipite) e tienilo con una o due mani.","Estendi in avanti l'altra gamba e scendi lentamente piegando il ginocchio d'appoggio.","Risali spingendo sul tallone, aiutandoti il meno possibile con le mani."],"ds":null},{"id":"lu_pistol","chain":"lunge","name":"Pistol squat","lv":5,"kind":"reps","lo":2,"hi":6,"eq":[],"flags":["ginocchia"],"per":true,"focus":"Gambe, glutei, equilibrio","steps":["Stai con i piedi alla larghezza delle spalle e le braccia distese davanti a te.","Solleva il piede destro da terra ed estendilo in avanti.","Abbassa lentamente il corpo piegando il ginocchio sinistro e spingendo indietro i fianchi.","Tieni il petto in alto e la schiena dritta mentre ti abbassi.","Abbassati finché la coscia sinistra non è parallela al suolo o il più in basso possibile.","Fermati per un momento in basso, quindi spingi attraverso il tallone sinistro per tornare alla posizione di partenza."],"ds":"1759"},{"id":"hi_bridge","chain":"hinge","name":"Ponte glutei a terra","lv":0,"kind":"reps","lo":8,"hi":20,"eq":[],"flags":[],"per":false,"focus":"Glutei, femorali","steps":["Sdraiati sulla schiena con le ginocchia piegate e i piedi appoggiati a terra.","Metti le braccia lungo i fianchi, i palmi rivolti verso il basso.","Coinvolgi i glutei e il core, quindi solleva i fianchi da terra finché il tuo corpo non forma una linea retta dalle ginocchia alle spalle.","Fermati un attimo in alto, contraendo i glutei.","Abbassa lentamente i fianchi fino alla posizione iniziale."],"ds":"3013"},{"id":"hi_march","chain":"hinge","name":"Ponte glutei con marcia","lv":1,"kind":"reps","lo":6,"hi":16,"eq":[],"flags":[],"per":false,"focus":"Glutei, core","steps":["Sdraiati sulla schiena con le ginocchia piegate e i piedi appoggiati a terra.","Coinvolgi i glutei e solleva i fianchi da terra, formando una linea retta dalle ginocchia alle spalle.","Tenendo i fianchi sollevati, solleva un piede da terra e avvicina il ginocchio al petto.","Riporta il piede a terra e ripeti il ​​movimento con l'altra gamba.","Continua ad alternare le gambe in un movimento di marcia mantenendo la posizione del ponte."],"ds":"3561"},{"id":"hi_single","chain":"hinge","name":"Ponte glutei a una gamba","lv":2,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":[],"per":true,"focus":"Glutei, femorali","steps":["Sdraiati sulla schiena con le ginocchia piegate e i piedi appoggiati a terra.","Estendi una gamba davanti a te.","Coinvolgi i glutei e solleva i fianchi da terra, formando una linea retta dalle ginocchia alle spalle.","Mantieni la posizione in alto per un momento, quindi abbassa lentamente i fianchi fino alla posizione iniziale."],"ds":"3645"},{"id":"hi_slider","chain":"hinge","name":"Curl femorale con asciugamano","lv":3,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":[],"per":false,"focus":"Femorali, glutei","steps":["Sdraiato sulla schiena, ginocchia piegate, con i talloni su un asciugamano o un calzino su un pavimento liscio.","Solleva il bacino, poi fai scivolare i talloni in avanti distendendo le gambe, restando con il bacino alto.","Riporta i talloni verso i glutei con controllo. Se senti un crampo, accorcia l'escursione."],"ds":null},{"id":"hi_single_el","chain":"hinge","name":"Ponte a una gamba con piede rialzato","lv":3,"kind":"reps","lo":6,"hi":12,"eq":["rialzo"],"flags":[],"per":true,"focus":"Glutei, femorali","steps":["Sdraiato sulla schiena con un piede appoggiato su un rialzo stabile e l'altra gamba tesa in aria.","Spingi sul piede d'appoggio e solleva il bacino fino a formare una linea dalla spalla al ginocchio.","Scendi lentamente senza appoggiare il bacino. Finite le ripetizioni, cambia gamba."],"ds":null},{"id":"hi_slider1","chain":"hinge","name":"Curl femorale a una gamba con asciugamano","lv":4,"kind":"reps","lo":4,"hi":10,"eq":[],"flags":[],"per":true,"focus":"Femorali, glutei","steps":["Sdraiato sulla schiena con un tallone su un asciugamano su pavimento liscio e l'altra gamba sollevata.","Solleva il bacino, poi fai scivolare il tallone in avanti fino a distendere la gamba.","Torna indietro con controllo mantenendo il bacino alto. Se senti un crampo, accorcia l'escursione."],"ds":null},{"id":"ce_deadbug","chain":"core_ext","name":"Dead bug","lv":0,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":[],"per":true,"focus":"Addome profondo","steps":["Sdraiati sulla schiena con le braccia tese verso il soffitto.","Piega le ginocchia e solleva le gambe da terra, creando un angolo di 90 gradi tra fianchi e ginocchia.","Attiva il core e la parte bassa della schiena per premere la parte bassa della schiena contro il terreno.","Abbassa lentamente il braccio destro e la gamba sinistra verso terra, mantenendoli dritti e sospesi appena sopra il pavimento.","Fermati un attimo, poi torna alla posizione iniziale.","Continua ad alternare i lati per il numero desiderato di ripetizioni."],"ds":"0276"},{"id":"ce_plank_k","chain":"core_ext","name":"Plank sulle ginocchia","lv":1,"kind":"time","lo":15,"hi":40,"eq":[],"flags":[],"per":false,"focus":"Addome","steps":["Avambracci a terra con i gomiti sotto le spalle, ginocchia appoggiate.","Linea retta dalle ginocchia alla testa, glutei e addome contratti.","Respira con regolarità e non far cadere il bacino."],"ds":null},{"id":"ce_plank","chain":"core_ext","name":"Plank sugli avambracci","lv":2,"kind":"time","lo":20,"hi":60,"eq":[],"flags":[],"per":false,"focus":"Addome","steps":["Avambracci a terra con i gomiti sotto le spalle, piedi larghi come i fianchi.","Corpo in linea retta dalla testa ai talloni, glutei e addome contratti.","Non inarcare la schiena e non alzare troppo il bacino. Respira."],"ds":null},{"id":"ce_plank_tap","chain":"core_ext","name":"Plank con tocco della spalla","lv":3,"kind":"reps","lo":8,"hi":20,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Addome, spalle","steps":["Parti in plank alto con le mani sotto le spalle e i piedi larghi.","Tocca la spalla opposta con una mano, senza ruotare il bacino.","Alterna i lati. Più larghi sono i piedi, più è facile restare stabili."],"ds":null},{"id":"ce_hollow","chain":"core_ext","name":"Hollow body hold","lv":3,"kind":"time","lo":15,"hi":40,"eq":[],"flags":["schiena"],"per":false,"focus":"Addome","steps":["Sdraiato sulla schiena con braccia sopra la testa e gambe tese.","Solleva spalle e gambe da terra, con la schiena bassa ben appoggiata al pavimento.","Se la zona lombare si stacca da terra, piega le ginocchia o alza meno le gambe."],"ds":null},{"id":"ce_hollow_rock","chain":"core_ext","name":"Hollow rock","lv":4,"kind":"reps","lo":8,"hi":20,"eq":[],"flags":["schiena"],"per":false,"focus":"Addome","steps":["Parti in posizione hollow body, con la schiena bassa a terra.","Dondola avanti e indietro come una barca, mantenendo la forma rigida.","Interrompi se la zona lombare si stacca da terra."],"ds":null},{"id":"ce_lsit","chain":"core_ext","name":"L-sit a terra","lv":4,"kind":"time","lo":5,"hi":20,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Addome, tricipiti, spalle","steps":["Siediti sul pavimento con le gambe distese davanti a te.","Metti le mani sul pavimento accanto ai fianchi, con le dita rivolte in avanti.","Coinvolgi il tuo core e solleva le gambe da terra, mantenendole dritte.","Cerca di portare le gambe parallele al pavimento, formando una \"L\" con il tuo corpo.","Mantieni questa posizione il più a lungo possibile.","Abbassa lentamente le gambe fino alla posizione di partenza."],"ds":"3419"},{"id":"ce_dragon","chain":"core_ext","name":"Dragon flag negativo","lv":5,"kind":"reps","lo":2,"hi":6,"eq":["rialzo"],"flags":["schiena","spalle"],"per":false,"focus":"Addome, schiena","steps":["Sdraiato su una panca stabile, afferra il bordo dietro la testa.","Parti con il corpo teso e sollevato, appoggiato solo sulle spalle.","Scendi lentamente in 4-5 secondi senza piegarti ai fianchi. Fermati se senti dolore al collo o alla schiena."],"ds":null},{"id":"cf_lying","chain":"core_flex","name":"Sollevamento gambe da sdraiato","lv":1,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":["schiena"],"per":false,"focus":"Addome basso","steps":["Sdraiati sulla schiena con le gambe distese e le braccia lungo i fianchi.","Metti le mani sotto i glutei per supporto.","Coinvolgi il tuo core e solleva le gambe da terra, sollevandole verso il soffitto.","Fai una pausa per un momento in alto, quindi abbassa lentamente le gambe fino alla posizione di partenza."],"ds":"0865"},{"id":"cf_hang_knee","chain":"core_flex","name":"Alzate delle ginocchia alla sbarra","lv":2,"kind":"reps","lo":5,"hi":12,"eq":["sbarra"],"flags":["spalle"],"per":false,"focus":"Addome basso","steps":["Appendi a una barra per trazioni con le braccia completamente distese e i palmi rivolti lontano da te.","Coinvolgi il core e solleva le gambe flettendo i fianchi e le ginocchia finché le cosce non sono parallele al suolo.","Fai una pausa per un momento in alto, quindi abbassa lentamente le gambe fino alla posizione di partenza."],"ds":"1764"},{"id":"cf_hang_leg","chain":"core_flex","name":"Alzate delle gambe alla sbarra","lv":3,"kind":"reps","lo":4,"hi":12,"eq":["sbarra"],"flags":["spalle"],"per":false,"focus":"Addome, flessori dell'anca","steps":["Appendi a una barra per trazioni con le braccia completamente distese e i palmi rivolti lontano da te.","Coinvolgi il tuo core e solleva le gambe davanti a te, mantenendole dritte.","Continua a sollevare finché le gambe non sono parallele al suolo o il più in alto possibile.","Fai una pausa per un momento in alto, quindi abbassa lentamente le gambe fino alla posizione di partenza."],"ds":"0472"},{"id":"cf_hang_str","chain":"core_flex","name":"Alzate delle gambe tese alla sbarra","lv":4,"kind":"reps","lo":4,"hi":10,"eq":["sbarra"],"flags":["spalle"],"per":false,"focus":"Addome, flessori dell'anca","steps":["Appendi a una barra per trazioni con le braccia completamente distese e i palmi rivolti lontano da te.","Coinvolgi il tuo core e solleva le gambe davanti a te, mantenendole dritte.","Continua a sollevare finché le gambe non sono parallele al suolo o il più in alto possibile.","Fai una pausa per un momento in alto, quindi abbassa lentamente le gambe fino alla posizione di partenza."],"ds":"0475"},{"id":"cf_ttb","chain":"core_flex","name":"Toes to bar","lv":5,"kind":"reps","lo":3,"hi":8,"eq":["sbarra"],"flags":["spalle"],"per":false,"focus":"Addome, dorsali","steps":["Appeso alla sbarra, braccia distese e spalle attive.","Solleva le gambe tese fino a toccare la sbarra con le punte dei piedi.","Scendi lentamente, senza dondolare."],"ds":null},{"id":"cl_side_k","chain":"core_lat","name":"Plank laterale sulle ginocchia","lv":1,"kind":"time","lo":15,"hi":30,"eq":[],"flags":[],"per":true,"focus":"Obliqui","steps":["Sdraiati su un fianco con l'avambraccio a terra, gomito sotto la spalla e ginocchia piegate a 90°.","Solleva i fianchi fino a formare una linea dalle ginocchia alla testa.","Mantieni la posizione, poi cambia lato."],"ds":null},{"id":"cl_side","chain":"core_lat","name":"Plank laterale","lv":2,"kind":"time","lo":20,"hi":45,"eq":[],"flags":[],"per":true,"focus":"Obliqui","steps":["Sdraiati su un fianco con le gambe distese e impilate una sopra l'altra.","Posiziona l'avambraccio a terra direttamente sotto la spalla, con il gomito piegato con un angolo di 90 gradi.","Coinvolgi il tuo core e solleva i fianchi da terra, creando una linea retta dalla testa ai piedi.","Mantieni questa posizione per il tempo desiderato.","Abbassa i fianchi fino alla posizione di partenza."],"ds":"0705"},{"id":"cl_side_lift","chain":"core_lat","name":"Plank laterale con sollevamento della gamba","lv":3,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":[],"per":true,"focus":"Obliqui, glutei","steps":["Inizia sdraiandoti su un fianco con le gambe distese e impilate una sopra l'altra.","Appoggiati sull'avambraccio, mantenendo il gomito direttamente sotto la spalla.","Coinvolgi il tuo core e solleva i fianchi da terra, creando una linea retta dalla testa ai piedi.","Mantenendo la posizione della plancia laterale, solleva la gamba superiore verso il soffitto, mantenendola dritta.","Abbassa lentamente la gamba fino alla posizione di partenza."],"ds":"1775"},{"id":"cl_pu_side","chain":"core_lat","name":"Push-up con rotazione in plank laterale","lv":4,"kind":"reps","lo":4,"hi":10,"eq":[],"flags":["polsi","spalle"],"per":true,"focus":"Obliqui, petto","steps":["Inizia in una posizione push-up con le mani alla larghezza delle spalle e il corpo in linea retta.","Abbassa il corpo verso terra piegando i gomiti, mantenendo il core impegnato.","Spingi indietro fino alla posizione di partenza.","Sposta il peso sulla mano sinistra e ruota il corpo verso destra, sollevando il braccio destro verso il soffitto.","Mantieni la posizione della plancia laterale per alcuni secondi, quindi torna alla posizione di partenza.","Continua ad alternare i lati per il numero di ripetizioni desiderato."],"ds":"0664"},{"id":"cp_bird","chain":"core_post","name":"Bird dog","lv":0,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":[],"per":true,"focus":"Schiena, core","steps":["Parti a quattro zampe con le mani sotto le spalle e le ginocchia sotto i fianchi.","Estendi un braccio in avanti e la gamba opposta indietro, senza ruotare il bacino né inarcare la schiena.","Tieni 2 secondi, torna e cambia lato."],"ds":null},{"id":"cp_super","chain":"core_post","name":"Superman","lv":1,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":["schiena"],"per":false,"focus":"Schiena","steps":["Sdraiati a pancia in giù con le braccia in avanti e le gambe distese.","Solleva leggermente braccia, petto e gambe da terra, guardando il pavimento.","Tieni 1-2 secondi e scendi. Non forzare l'inarcamento della zona lombare."],"ds":null},{"id":"cp_rev","chain":"core_post","name":"Plank inverso con sollevamento della gamba","lv":3,"kind":"reps","lo":6,"hi":12,"eq":[],"flags":["polsi","spalle"],"per":true,"focus":"Glutei, schiena, core","steps":["Siediti a terra con le gambe distese davanti a te e le mani appoggiate a terra dietro di te, con le dita rivolte verso i tuoi piedi.","Premi tra le mani e solleva i fianchi da terra, arrivando in una posizione di plancia inversa.","Coinvolgi il core e solleva una gamba da terra, estendendola verso il soffitto.","Mantieni la posizione per un momento, quindi abbassa nuovamente la gamba.","Continua ad alternare le gambe per il numero di ripetizioni desiderato."],"ds":"3663"},{"id":"cd_march","chain":"cond","name":"Marcia sul posto con ginocchia alte","lv":0,"kind":"time","lo":30,"hi":60,"eq":[],"flags":[],"per":false,"focus":"Cardio","steps":["Cammina sul posto sollevando le ginocchia a un'altezza comoda e muovendo le braccia a ritmo.","Respira in modo regolare: devi riuscire a parlare."],"ds":null},{"id":"cd_stepjack","chain":"cond","name":"Step jack senza salto","lv":1,"kind":"time","lo":30,"hi":60,"eq":[],"flags":[],"per":false,"focus":"Cardio","steps":["Parti in piedi con i piedi uniti.","Fai un passo laterale con un piede mentre sollevi le braccia sopra la testa, poi torna al centro.","Alterna i lati a ritmo costante, senza saltare."],"ds":null},{"id":"cd_burpee_lite","chain":"cond","name":"Burpee semplificato","lv":2,"kind":"reps","lo":5,"hi":12,"eq":[],"flags":["polsi","ginocchia"],"per":false,"focus":"Cardio, tutto il corpo","steps":["In piedi, scendi in squat e appoggia le mani a terra.","Porta un piede alla volta indietro fino alla posizione di plank alto.","Riporta i piedi vicino alle mani uno alla volta e rialzati con le braccia in alto. Niente salto e niente push-up."],"ds":null},{"id":"cd_mountain","chain":"cond","name":"Mountain climber","lv":2,"kind":"time","lo":20,"hi":45,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Cardio, core","steps":["Inizia in una posizione di plancia alta con le mani direttamente sotto le spalle e il corpo in linea retta.","Coinvolgi il core e porta il ginocchio destro verso il petto, quindi cambia rapidamente e porta il ginocchio sinistro verso il petto.","Continua ad alternare le gambe con un movimento di corsa, mantenendo i fianchi bassi e il core impegnato.","Mantieni un ritmo costante e respira in modo uniforme durante l'esercizio."],"ds":"0630"},{"id":"cd_jacks","chain":"cond","name":"Jumping jack","lv":2,"kind":"time","lo":30,"hi":60,"eq":[],"flags":["salti"],"per":false,"focus":"Cardio","steps":["Parti in piedi con i piedi uniti e le braccia lungo i fianchi.","Salta divaricando le gambe e portando le braccia sopra la testa, poi torna alla posizione iniziale.","Atterra morbido sulle punte dei piedi, con le ginocchia leggermente piegate."],"ds":null},{"id":"cd_bear","chain":"cond","name":"Bear crawl","lv":3,"kind":"time","lo":20,"hi":40,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Cardio, spalle, core","steps":["Inizia a quattro zampe con le mani direttamente sotto le spalle e le ginocchia sotto i fianchi.","Alza leggermente le ginocchia da terra, mantenendo la schiena piatta e il core attivo.","Muovi in avanti contemporaneamente la mano destra e il piede sinistro, seguiti dalla mano sinistra e dal piede destro.","Continua a strisciare in avanti, alternando movimenti di mani e piedi.","Mantieni un ritmo costante e tieni il core teso durante tutto l'esercizio.","Continua per la distanza o il tempo desiderato."],"ds":"3360"},{"id":"cd_jump_sq","chain":"cond","name":"Squat con salto","lv":3,"kind":"reps","lo":8,"hi":15,"eq":[],"flags":["salti","ginocchia"],"per":false,"focus":"Gambe, cardio","steps":["Stai con i piedi alla larghezza delle spalle.","Abbassa il corpo in una posizione tozza piegando le ginocchia e spingendo indietro i fianchi.","Salta in modo esplosivo da terra, estendendo i fianchi, le ginocchia e le caviglie.","Mentre sei a mezz'aria, porta rapidamente le braccia in avanti per mantenere l'equilibrio.","Atterra dolcemente sulle punte dei piedi e passa immediatamente alla ripetizione successiva."],"ds":"0514"},{"id":"cd_burpee","chain":"cond","name":"Burpee","lv":4,"kind":"reps","lo":6,"hi":15,"eq":[],"flags":["salti","polsi","ginocchia"],"per":false,"focus":"Cardio, tutto il corpo","steps":["Inizia in posizione eretta, con i piedi alla larghezza delle spalle.","Abbassa il corpo in posizione accovacciata piegando le ginocchia e appoggiando le mani sul pavimento davanti a te.","Rimetti i piedi in posizione di piegamenti.","Fai una flessione, mantenendo il corpo in linea retta.","Rimetti i piedi in posizione squat.","Salta su esplosivamente, allungando le braccia sopra la testa.","Atterra dolcemente e poi si abbassa subito in posizione accovacciato per iniziare la prossima ripetizione."],"ds":"1160"},{"id":"wt_goblet","chain":"wt_squat","name":"Goblet squat con manubrio","lv":0,"kind":"reps","lo":8,"hi":15,"eq":["manubri"],"flags":["ginocchia"],"per":false,"focus":"Gambe, glutei, core","steps":["Tieni un manubrio verticale davanti al petto con entrambe le mani, gomiti vicini al corpo.","Piedi larghi come le spalle, punte leggermente aperte. Scendi tenendo il petto alto e le ginocchia in linea con le punte.","Scendi finché mantieni la schiena neutra, poi spingi sui talloni per risalire."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_squat_back","chain":"wt_squat","name":"Squat con bilanciere dietro la schiena","lv":3,"kind":"reps","lo":5,"hi":10,"eq":["bilanciere","rack"],"flags":["ginocchia","schiena"],"per":false,"focus":"Gambe, glutei, schiena","steps":["Appoggia il bilanciere sulla parte alta della schiena, non sul collo, e sollevalo dai supporti. Fai due passi indietro.","Piedi larghi come le spalle. Respira, tieni il tronco rigido e scendi con le ginocchia in linea con le punte.","Risali spingendo sui talloni, senza far cadere il petto. Fine serie: riappoggia il bilanciere sui supporti."],"ds":null,"note":"Regola le barre di sicurezza del rack appena sotto la profondità dello squat. Non fare serie al cedimento.","w":{"ld":"bar","inc":5,"mv":"comp"}},{"id":"wt_squat_front","chain":"wt_squat","name":"Front squat con bilanciere","lv":4,"kind":"reps","lo":5,"hi":8,"eq":["bilanciere","rack"],"flags":["ginocchia","schiena","polsi"],"per":false,"focus":"Gambe, core","steps":["Appoggia il bilanciere sulla parte anteriore delle spalle, gomiti alti davanti a te.","Scendi tenendo il petto alto e il tronco verticale.","Risali spingendo sui talloni mantenendo i gomiti alti."],"ds":null,"note":"Richiede polsi e spalle mobili. Se non riesci a tenere i gomiti alti, resta sullo squat dietro la schiena.","w":{"ld":"bar","inc":5,"mv":"comp"}},{"id":"wt_rdl_db","chain":"wt_hinge","name":"Stacco rumeno con manubri","lv":1,"kind":"reps","lo":8,"hi":12,"eq":["manubri"],"flags":["schiena"],"per":false,"focus":"Femorali, glutei","steps":["In piedi con un manubrio per mano davanti alle cosce, ginocchia appena piegate.","Spingi il bacino indietro e fai scorrere i manubri lungo le gambe, con la schiena neutra, finché senti tirare i femorali.","Risali spingendo il bacino in avanti. Non arrotondare mai la schiena."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_rdl_bar","chain":"wt_hinge","name":"Stacco rumeno con bilanciere","lv":3,"kind":"reps","lo":6,"hi":10,"eq":["bilanciere"],"flags":["schiena"],"per":false,"focus":"Femorali, glutei, schiena","steps":["In piedi con il bilanciere davanti alle cosce, presa poco più larga delle anche.","Spingi il bacino indietro e fai scorrere il bilanciere vicino alle gambe, schiena neutra.","Scendi fin dove la schiena resta piatta, poi risali con il bacino."],"ds":null,"w":{"ld":"bar","inc":5,"mv":"comp"}},{"id":"wt_deadlift","chain":"wt_hinge","name":"Stacco da terra con bilanciere","lv":4,"kind":"reps","lo":3,"hi":8,"eq":["bilanciere"],"flags":["schiena"],"per":false,"focus":"Schiena, glutei, gambe","steps":["Bilanciere sopra il centro dei piedi. Afferra con presa poco più larga delle gambe, schiena neutra, petto alto.","Spingi sui piedi come per allontanare il pavimento, bilanciere vicino alle gambe.","In piedi, blocca bacino e ginocchia. Scendi con controllo, senza rimbalzare."],"ds":null,"note":"Parti da carichi leggeri e imparane la tecnica. Non fare serie al cedimento.","w":{"ld":"bar","inc":5,"mv":"comp"}},{"id":"wt_floor_db","chain":"wt_push_h","name":"Floor press con manubri","lv":0,"kind":"reps","lo":8,"hi":15,"eq":["manubri"],"flags":[],"per":false,"focus":"Petto, tricipiti","steps":["Sdraiato a terra, ginocchia piegate, un manubrio per mano appoggiato sulle cosce poi portato ai lati del petto.","Spingi i manubri verso l'alto fino a distendere le braccia.","Scendi lentamente finché i gomiti toccano il pavimento, poi risali."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_bench_db","chain":"wt_push_h","name":"Panca piana con manubri","lv":1,"kind":"reps","lo":6,"hi":12,"eq":["manubri","panca"],"flags":["spalle"],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Sdraiato sulla panca, piedi a terra, scapole indietro e giù. Manubri sopra il petto.","Scendi con i gomiti a circa 45 gradi dal busto fino a sentire il petto lavorare.","Spingi in alto con controllo senza far battere i manubri."],"ds":null,"note":"Porta i manubri in posizione con le ginocchia e rimettili a terra a fine serie. Se non puoi farlo in sicurezza, scendi di peso.","w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_bench_bar","chain":"wt_push_h","name":"Panca piana con bilanciere","lv":3,"kind":"reps","lo":4,"hi":10,"eq":["bilanciere","panca","rack"],"flags":["spalle","polsi"],"per":false,"focus":"Petto, spalle, tricipiti","steps":["Sdraiato con gli occhi sotto il bilanciere, piedi a terra, scapole indietro. Presa poco più larga delle spalle.","Sgancia, scendi controllato fino a sfiorare il petto, gomiti a circa 45 gradi.","Spingi verso l'alto. A fine serie riaggancia il bilanciere ai supporti."],"ds":null,"note":"Usa i supporti e le barre di sicurezza del rack, oppure un compagno. Mai alla ricerca del cedimento da solo.","w":{"ld":"bar","inc":2.5,"mv":"comp"}},{"id":"wt_ohp_db","chain":"wt_push_v","name":"Military press con manubri","lv":1,"kind":"reps","lo":8,"hi":12,"eq":["manubri"],"flags":["spalle","schiena"],"per":false,"focus":"Spalle, tricipiti","steps":["In piedi, manubri all'altezza delle spalle, glutei e addome contratti.","Spingi i manubri sopra la testa senza inarcare la schiena.","Scendi con controllo fino alle spalle."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_ohp_bar","chain":"wt_push_v","name":"Military press con bilanciere","lv":3,"kind":"reps","lo":5,"hi":10,"eq":["bilanciere","rack"],"flags":["spalle","schiena"],"per":false,"focus":"Spalle, tricipiti","steps":["Bilanciere sui supporti all'altezza delle spalle, presa poco più larga delle spalle.","Spingi sopra la testa portando la testa leggermente avanti quando il bilanciere la supera. Glutei e addome contratti.","Scendi con controllo, poi riappoggia sui supporti."],"ds":null,"w":{"ld":"bar","inc":2.5,"mv":"comp"}},{"id":"wt_row_db_bench","chain":"wt_pull_h","name":"Rematore a un braccio con appoggio su panca","lv":0,"kind":"reps","lo":8,"hi":12,"eq":["manubri","panca"],"flags":[],"per":true,"focus":"Dorsali, bicipiti","steps":["Appoggia una mano e il ginocchio dello stesso lato sulla panca. Schiena piatta, manubrio nell'altra mano.","Tira il gomito verso l'anca, avvicinando la scapola alla colonna.","Scendi lentamente senza ruotare il busto."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_row_db","chain":"wt_pull_h","name":"Rematore con manubri a busto inclinato","lv":1,"kind":"reps","lo":8,"hi":12,"eq":["manubri"],"flags":["schiena"],"per":false,"focus":"Dorsali, bicipiti","steps":["Ginocchia leggermente piegate, busto inclinato in avanti con la schiena neutra, manubri sotto le spalle.","Tira i gomiti indietro e verso le anche.","Scendi con controllo. Se la schiena si arrotonda, riduci il peso."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_row_bar","chain":"wt_pull_h","name":"Rematore con bilanciere","lv":3,"kind":"reps","lo":6,"hi":10,"eq":["bilanciere"],"flags":["schiena"],"per":false,"focus":"Dorsali, schiena, bicipiti","steps":["Busto inclinato, schiena neutra, bilanciere davanti alle ginocchia, presa poco più larga delle spalle.","Tira il bilanciere verso l'ombelico, gomiti vicini al corpo.","Scendi con controllo senza dondolare il busto."],"ds":null,"w":{"ld":"bar","inc":2.5,"mv":"comp"}},{"id":"wt_split_db","chain":"wt_lunge","name":"Affondo statico con manubri","lv":1,"kind":"reps","lo":8,"hi":12,"eq":["manubri"],"flags":["ginocchia"],"per":true,"focus":"Quadricipiti, glutei","steps":["Un manubrio per mano, un piede avanti e uno indietro, tronco dritto.","Scendi con il ginocchio posteriore verso il pavimento, il ginocchio davanti sopra la caviglia.","Risali spingendo sul piede davanti. Finisci tutte le ripetizioni e cambia gamba."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_bulg_db","chain":"wt_lunge","name":"Squat bulgaro con manubri","lv":2,"kind":"reps","lo":6,"hi":12,"eq":["manubri","panca"],"flags":["ginocchia"],"per":true,"focus":"Quadricipiti, glutei","steps":["Appoggia il collo del piede posteriore sulla panca, manubri nelle mani.","Scendi verticalmente con il ginocchio davanti in linea con il piede.","Risali con la gamba davanti. Finisci le ripetizioni e cambia gamba."],"ds":null,"w":{"ld":"db","inc":2,"mv":"comp"}},{"id":"wt_curl_db","chain":"wt_biceps","name":"Curl con manubri","lv":0,"kind":"reps","lo":8,"hi":15,"eq":["manubri"],"flags":["gomiti"],"per":false,"focus":"Bicipiti","steps":["In piedi, un manubrio per mano, palmi in avanti, gomiti vicini ai fianchi.","Fletti i gomiti portando i manubri verso le spalle senza dondolare.","Scendi lentamente."],"ds":null,"w":{"ld":"db","inc":1,"mv":"iso"}},{"id":"wt_curl_bar","chain":"wt_biceps","name":"Curl con bilanciere","lv":1,"kind":"reps","lo":8,"hi":12,"eq":["bilanciere"],"flags":["gomiti","polsi"],"per":false,"focus":"Bicipiti","steps":["In piedi, presa larga come le spalle, braccia distese.","Fletti i gomiti portando il bilanciere verso le spalle, gomiti fermi.","Scendi lentamente."],"ds":null,"w":{"ld":"bar","inc":2.5,"mv":"iso"}},{"id":"wt_kick_db","chain":"wt_triceps","name":"Kickback con manubrio","lv":0,"kind":"reps","lo":10,"hi":15,"eq":["manubri"],"flags":["gomiti"],"per":false,"focus":"Tricipiti","steps":["Busto inclinato in avanti con la schiena neutra, gomito piegato a 90 gradi e vicino al fianco.","Distendi il gomito portando il manubrio indietro, senza muovere la spalla.","Torna lentamente. Finisci le ripetizioni e cambia braccio."],"ds":null,"w":{"ld":"db","inc":1,"mv":"iso"}},{"id":"wt_ext_db","chain":"wt_triceps","name":"Estensione sopra la testa con manubrio","lv":1,"kind":"reps","lo":10,"hi":15,"eq":["manubri"],"flags":["gomiti","spalle"],"per":false,"focus":"Tricipiti","steps":["In piedi o seduto, tieni un manubrio con entrambe le mani sopra la testa, gomiti vicini alle orecchie.","Piega i gomiti portando il manubrio dietro la nuca, poi distendi.","Non inarcare la schiena. Se senti fastidio al gomito, scendi di peso."],"ds":null,"w":{"ld":"db","inc":1,"mv":"iso"}},{"id":"hs_walk","chain":"sk_hs","name":"Wall walk parziale","lv":3,"kind":"reps","lo":3,"hi":6,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, polsi, core","steps":["Parti in plank con i piedi contro il muro (mani a terra, braccia tese, a circa un piede dal muro).","Cammina con i piedi sul muro verso l'alto e con le mani verso il muro, solo fino a dove ti senti stabile.","Spingi forte il pavimento con le mani, con le spalle alte e le braccia tese, poi scendi camminando con i piedi.","Usa un tappetino e lascia libero lo spazio. Scendi sempre in modo controllato."],"ds":null},{"id":"hs_chest","chain":"sk_hs","name":"Verticale a muro, petto al muro","lv":4,"kind":"time","lo":10,"hi":40,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, polsi, core","steps":["Dal plank con i piedi sul muro, cammina con le mani verso il muro finché il petto è vicino al muro.","Braccia tese, spalle spinte verso l'alto (lontane dalle orecchie), corpo in linea retta, sguardo tra le mani.","Tieni la posizione respirando. Per uscire, cammina con i piedi verso il basso lungo il muro."],"ds":null},{"id":"hs_back","chain":"sk_hs","name":"Verticale a muro con kick-up","lv":4,"kind":"time","lo":10,"hi":40,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, polsi, core","steps":["Con la schiena rivolta al muro, appoggia le mani a terra a circa 20-30 cm dal muro.","Calcia verso l'alto una gamba alla volta fino ad appoggiare i talloni al muro. Braccia tese, spalle alte.","Tieni la posizione. Per scendere riporta una gamba alla volta a terra.","Impara anche un'uscita laterale (ruota) per i casi in cui perdi l'equilibrio."],"ds":null},{"id":"hs_free","chain":"sk_hs","name":"Verticale libera","lv":5,"kind":"time","lo":3,"hi":20,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, polsi, equilibrio","steps":["Scegli uno spazio libero con un tappetino e senza ostacoli. Tieni il muro dietro di te come rete di sicurezza.","Calcia verso l'alto con controllo e cerca la linea retta, con le mani che premono forte sul pavimento.","Se cadi in avanti, premi con le dita; se cadi all'indietro, premi con la base del palmo.","Per uscire ruota di lato oppure scendi con una gamba alla volta."],"ds":null,"note":"Tentativi brevi e di qualità: smetti quando l'equilibrio peggiora."},{"id":"fl_tuck","chain":"sk_fl","name":"Front lever tuck","lv":3,"kind":"time","lo":5,"hi":15,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, core, spalle","steps":["Appeso alla sbarra a braccia tese, con le scapole portate verso il basso.","Solleva le ginocchia al petto e inclina il corpo all'indietro, con la schiena orizzontale.","Tieni le braccia tese per tutto il tempo e scendi lentamente."],"ds":null},{"id":"fl_adv","chain":"sk_fl","name":"Front lever tuck avanzato","lv":4,"kind":"time","lo":4,"hi":12,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, core, spalle","steps":["Parti dalla posizione tuck.","Allontana le ginocchia dal petto (angolo dell'anca di circa 90°) con la schiena piatta e orizzontale.","Tieni le braccia tese e le scapole basse. Scendi lentamente."],"ds":null},{"id":"fl_str","chain":"sk_fl","name":"Front lever straddle","lv":5,"kind":"time","lo":3,"hi":10,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, core, spalle","steps":["Dalla posizione tuck avanzato, estendi le gambe lateralmente divaricate e tese.","Corpo orizzontale, braccia tese, scapole basse.","Tieni poco e riposa a lungo: la tensione sui gomiti è alta."],"ds":null},{"id":"fl_full","chain":"sk_fl","name":"Front lever completo","lv":5,"kind":"time","lo":2,"hi":8,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, core, spalle","steps":["Corpo teso in linea retta e orizzontale, appeso alla sbarra a braccia tese.","Glutei e addome contratti, scapole basse.","Scendi con controllo e riposa a lungo tra le serie."],"ds":null},{"id":"mu_false","chain":"sk_mu","name":"False grip hang","lv":3,"kind":"time","lo":8,"hi":25,"eq":["sbarra"],"flags":["polsi","gomiti"],"per":false,"focus":"Polsi, presa","steps":["Appoggia il polso sopra la sbarra, con la base del palmo sulla sbarra e le dita a uncino (false grip).","Resta appeso a braccia tese.","Interrompi se senti dolore al polso. Inizia con pochi secondi."],"ds":null},{"id":"mu_high","chain":"sk_mu","name":"High pull","lv":4,"kind":"reps","lo":3,"hi":6,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, bicipiti","steps":["Appeso alla sbarra, tira in modo esplosivo portando la sbarra verso la parte bassa del petto o l'addome.","Inclina leggermente il busto all'indietro e porta i gomiti dietro.","Scendi lentamente. Tieni poche ripetizioni e di qualità."],"ds":null},{"id":"mu_band","chain":"sk_mu","name":"Transizione con elastico","lv":5,"kind":"reps","lo":3,"hi":6,"eq":["sbarra","elastico"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, tricipiti","steps":["Fissa un elastico alla sbarra e infilaci un ginocchio o un piede in modo che aiuti il passaggio.","Tira in alto in modo esplosivo e porta rapidamente i gomiti sopra la sbarra, con il petto sopra.","Distendi le braccia in appoggio sopra la sbarra, poi scendi con controllo."],"ds":null},{"id":"mu_neg","chain":"sk_mu","name":"Muscle-up negativo","lv":5,"kind":"reps","lo":2,"hi":5,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, tricipiti","steps":["Parti in appoggio sopra la sbarra con le braccia tese.","Scendi lentamente in 4-5 secondi attraverso il passaggio, portando i gomiti sotto la sbarra.","Termina appeso a braccia tese, poi scendi a terra e riposa."],"ds":null},{"id":"mu_full","chain":"sk_mu","name":"Muscle-up","lv":5,"kind":"reps","lo":1,"hi":4,"eq":["sbarra"],"flags":["gomiti","spalle"],"per":false,"focus":"Dorsali, tricipiti","steps":["Parti appeso, con la false grip se la padroneggi.","Tira in modo esplosivo portando la sbarra vicino all'addome.","Passa rapidamente con i gomiti sopra la sbarra inclinando il busto in avanti, poi distendi le braccia.","Qualità prima della quantità: ferma la serie se il passaggio si rompe."],"ds":null},{"id":"pl_lean","chain":"sk_pl","name":"Planche lean","lv":4,"kind":"time","lo":8,"hi":25,"eq":[],"flags":["polsi","spalle","gomiti"],"per":false,"focus":"Spalle, polsi, core","steps":["In plank alto, spingi le spalle in avanti oltre le mani mantenendo il corpo in linea retta.","Braccia tese, spalle ben spinte lontano dalle orecchie, glutei contratti.","Tieni la posizione e torna lentamente. Scalda bene i polsi."],"ds":null},{"id":"pl_pseudo","chain":"sk_pl","name":"Pseudo planche push-up","lv":4,"kind":"reps","lo":4,"hi":10,"eq":[],"flags":["polsi","spalle","gomiti"],"per":false,"focus":"Spalle, petto, tricipiti","steps":["In plank con le mani all'altezza dei fianchi, dita leggermente verso l'esterno, spalle in avanti.","Piega i gomiti tenendoli vicini ai fianchi e scendi mantenendo l'inclinazione in avanti.","Spingi fino a distendere le braccia."],"ds":null},{"id":"pl_frog","chain":"sk_pl","name":"Frog stand","lv":4,"kind":"time","lo":5,"hi":20,"eq":[],"flags":["polsi","spalle"],"per":false,"focus":"Spalle, polsi, equilibrio","steps":["Accovacciati con le mani a terra davanti a te, dita aperte.","Appoggia le ginocchia sulla parte esterna dei gomiti e inclina il peso in avanti.","Solleva i piedi da terra e tieni l'equilibrio. Metti un cuscino davanti al viso per sicurezza."],"ds":null},{"id":"pl_tuck","chain":"sk_pl","name":"Tuck planche","lv":5,"kind":"time","lo":3,"hi":12,"eq":[],"flags":["polsi","spalle","gomiti"],"per":false,"focus":"Spalle, polsi, core","steps":["Dalla frog stand o dalla lean, solleva i piedi con le ginocchia al petto e le braccia tese.","I fianchi sono all'altezza delle spalle e la schiena è leggermente arrotondata.","Tieni pochi secondi, poi scendi."],"ds":null},{"id":"pl_str","chain":"sk_pl","name":"Straddle planche","lv":5,"kind":"time","lo":2,"hi":8,"eq":[],"flags":["polsi","spalle","gomiti"],"per":false,"focus":"Spalle, polsi, core","steps":["Dalla posizione tuck, estendi le gambe divaricate e tese.","Corpo orizzontale, braccia tese, spalle spinte in avanti.","Tieni poco e riposa a lungo: il carico su polsi, gomiti e spalle è molto alto."],"ds":null},{"id":"pl_full","chain":"sk_pl","name":"Planche completa","lv":5,"kind":"time","lo":2,"hi":6,"eq":[],"flags":["polsi","spalle","gomiti"],"per":false,"focus":"Spalle, polsi, core","steps":["Corpo teso e orizzontale in equilibrio sulle sole mani, a braccia tese.","Glutei e addome contratti, spalle spinte in avanti.","Tieni pochi secondi e riposa a lungo tra i tentativi."],"ds":null}],"tests":[{"chain":"push_h","q":"Quanti push-up standard (petto quasi a terra, corpo in linea) riesci a fare di fila?","skill":false,"needs":[],"opts":[{"label":"Non ne ho mai fatti o sono molto fuori allenamento","start":"push_wall"},{"label":"Nemmeno uno a terra","start":"push_inc_hi"},{"label":"Da 1 a 7","start":"push_inc_lo"},{"label":"Da 8 a 14","start":"push_std"},{"label":"Da 15 a 29","start":"push_dec"},{"label":"30 o più","start":"push_arc"}]},{"chain":"pull_v","q":"Quante trazioni alla sbarra riesci a fare di fila?","skill":false,"needs":["sbarra"],"opts":[{"label":
